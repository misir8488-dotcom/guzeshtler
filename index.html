    } else go("#/oxu/" + item.article);
    return;
  }
  if (action === "copy") { copyText(act.closest("[data-id]").dataset.id); return; }
  if (action === "note") {
    const notes = act.parentElement.querySelector(".notes");
    if (!notes) return;
    notes.hidden = !notes.hidden;
    act.textContent = notes.hidden ? "Qeyd" : "Qeydi gizlət";
    return;
  }
  if (action === "star") {
    const el = act.closest("[data-id]");
    const id = el.dataset.id;
    if (store.stars[id]) delete store.stars[id];
    else store.stars[id] = true;
    save();
    if (ui.filter === "star" && !store.stars[id]) el.remove();
    else paintClause(el);
    const rc = document.getElementById("resultCount");
    if (rc && document.getElementById("list")) rc.textContent = document.querySelectorAll("#list .clause").length + " bənd";
    return;
  }
  if (action === "status" && parseHash().name !== "kart") {
    const el = act.closest("[data-id]");
    const id = el.dataset.id;
    const next = act.dataset.status;
    toggleStatus(id, next);
    if (ui.filter === "left" && !document.body.contains(el)) return;
    if (ui.filter === "left" && getStatus(id) === "know") {
      const node = el.closest(".node");
      if (node && node.querySelectorAll(".clause").length === 1) {
        const parentKids = node.parentElement;
        node.remove();
        if (parentKids && parentKids.classList.contains("kids") && !parentKids.children.length) parentKids.remove();
      } else el.remove();
    } else paintClause(el);
    const rc = document.getElementById("resultCount");
    if (rc && document.getElementById("list")) rc.textContent = document.querySelectorAll("#list .clause").length + " bənd";
    return;
  }
  if (action === "card-article") {
    ui.cardArticle = act.dataset.code;
    store.cardArticle = ui.cardArticle;
    if (ui.cardArticle !== "all") { ui.article = ui.cardArticle; store.article = ui.article; }
    ui.forceQueue = true;
    save();
    renderCard();
    return;
  }
  if (action === "dir") { ui.cardDir = act.dataset.dir; ui.revealed = false; store.cardDir = ui.cardDir; save(); renderCard(); return; }
  if (action === "only-left" || action === "show-known") {
    ui.onlyLeft = action === "show-known" ? false : !ui.onlyLeft;
    store.onlyLeft = ui.onlyLeft;
    ui.forceQueue = true;
    save();
    renderCard();
    return;
  }
  if (action === "shuffle") {
    resetQueue();
    ui.queue = shuffle(ui.queue);
    ui.forceQueue = false;
    renderCard();
    return;
  }
  if (action === "reveal") { ui.revealed = true; renderCard(); return; }
  if (action === "card-prev") { ui.pos = Math.max(0, ui.pos - 1); ui.revealed = false; renderCard(); return; }
  if (action === "card-next") { ui.pos = Math.min((ui.queue?.length || 1) - 1, ui.pos + 1); ui.revealed = false; renderCard(); return; }
  if (action === "status" && parseHash().name === "kart") { rateCard(act.dataset.status); return; }
  if (action === "quiz-article") { ui.quizArticle = act.dataset.code; store.quizArticle = ui.quizArticle; save(); renderQuizHome(); return; }
  if (action === "quiz-len") { ui.quizLen = Number(act.dataset.len); store.quizLen = ui.quizLen; save(); renderQuizHome(); return; }
  if (action === "quiz-start") { startQuiz(act.dataset.kind); return; }
  if (action === "quiz-pick") {
    const q = ui.quiz?.questions[ui.quiz.index];
    if (!q || q.picked) return;
    q.picked = q.options[Number(act.dataset.i)];
    const ok = q.picked === q.answer;
    if (!ok && getStatus(q.itemId) !== "know") setStatus(q.itemId, "again");
    buzz(ok);
    renderQuiz();
    return;
  }
  if (action === "quiz-next") {
    if (ui.quiz.index < ui.quiz.questions.length - 1) ui.quiz.index += 1;
    else ui.quiz.done = true;
    renderQuiz();
    return;
  }
  if (action === "quiz-retry") { startQuiz(ui.quiz.kind); return; }
  if (action === "quiz-exit") { ui.quiz = null; go("#/sinaq"); return; }
  if (action === "overlap-min") {
    ui.overlapMin = Number(act.dataset.min);
    renderOverlaps();
    return;
  }
  if (action === "vat-filter") {
    ui.vatFilter = act.dataset.filter;
    renderVatMatrix();
    return;
  }
  if (action === "vat-open") {
    e.preventDefault();
    e.stopPropagation();
    openClauseModal(act.dataset.id);
    return;
  }
  if (action === "ok-cell") {
    e.preventDefault();
    e.stopPropagation();
    openOkModal(act.dataset.oid, act.dataset.tax);
    return;
  }
  if (action === "open-item") {
    const item = ITEM[act.dataset.id];
    closeSheet();
    ui.pendingScroll = item.id;
    ui.article = item.article;
    ui.filter = "all";
    store.article = item.article;
    save();
    go("#/oxu/" + item.article);
  }
}

document.body.addEventListener("click", onClick);
document.body.addEventListener("input", (e) => {
  if (e.target.id !== "q") return;
  ui.query = e.target.value;
  fillList(false);
});
document.body.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && document.getElementById("sheetRoot")) { closeSheet(); return; }
  if (e.target.id === "q" && e.key === "Enter") e.target.blur();
  if (e.target.matches("input, textarea")) return;
  if (parseHash().name !== "kart") return;
  if (e.key === " ") { e.preventDefault(); ui.revealed = !ui.revealed; renderCard(); }
  if (e.key === "ArrowRight") { ui.pos = Math.min((ui.queue?.length || 1) - 1, ui.pos + 1); ui.revealed = false; renderCard(); }
  if (e.key === "ArrowLeft") { ui.pos = Math.max(0, ui.pos - 1); ui.revealed = false; renderCard(); }
  if (ui.revealed && e.key === "1") rateCard("again");
  if (ui.revealed && e.key === "2") rateCard("hard");
  if (ui.revealed && e.key === "3") rateCard("know");
});
document.body.addEventListener("touchstart", (e) => {
  if (!e.target.closest(".study") || e.target.closest("button")) { ui.touchX = null; return; }
  ui.touchX = e.changedTouches[0].clientX;
}, { passive: true });
document.body.addEventListener("touchend", (e) => {
  if (ui.touchX == null || !e.target.closest(".study")) { ui.touchX = null; return; }
  const dx = e.changedTouches[0].clientX - ui.touchX;
  ui.touchX = null;
  if (Math.abs(dx) < 60 || parseHash().name !== "kart") return;
  if (dx > 0) ui.pos = Math.max(0, ui.pos - 1);
  else ui.pos = Math.min((ui.queue?.length || 1) - 1, ui.pos + 1);
  ui.revealed = false;
  renderCard();
}, { passive: true });

applyChrome();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (!store.theme) applyChrome(); });
window.addEventListener("hashchange", route);
if (!location.hash) history.replaceState(null, "", "#/ana");
route();
if (location.protocol.startsWith("http") && "serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
</script>
</body>
</html>

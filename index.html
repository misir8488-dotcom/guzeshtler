nin yerinə yetirilməsi ilə bağlı Azərbaycan Respublikasının Mərkəzi Bankı tərəfindən mal idxalı, iş görülməsi, xidmət göstərilməsi və Azərbaycan Respublikasının Mərkəzi Bankı üçün xidmətlərin göstərilməsi və işlərin görülməsi, o cümlədən xəzinə avadanlıqlarına texniki servis xidməti, pul nişanlarının istehsalı, daşınması, saxlanılması, sığortalanması, istehsal prosesinin auditinin keçirilməsi, ekspertizası, beynəlxalq qızıl-valyuta ehtiyatlarının saxlanılması və idarə edilməsi ilə əlaqədar xidmətlərin, informasiya sistemləri üzrə dəstəkləmə xidmətlərinin, habelə Azərbaycan Respublikası Mərkəzi Bankının məqsəd və funksiyalarının həyata keçirilməsi ilə əlaqədar məsləhət xidmətlərinin göstərilməsi;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Mərkəzi Bankın xidmət və idxalı"},{"id":"164.1.10","text":"Azərbaycan Respublikasının Dövlət Neft Fondunun qanunvericiliklə nəzərdə tutulmuş vəzifələrinin yerinə yetirilməsi ilə bağlı mal idxalı, iş görülməsi və xidmət göstərilməsi.","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Dövlət Neft Fondunun idxalı"},{"id":"164.1.10-1","text":"yaşayış sahələrini satmaq öhdəliyi ilə kirayəyə vermə sahəsində fəaliyyət göstərən müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən yaşayış sahələrinin kirayəçilərə təqdim edilməsi;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Satmaq öhdəliyi ilə kirayə mənzil"},{"id":"164.1.11","text":"Azərbaycan Respublikasına, o cümlədən onu təmsil edən hüquqi şəxslərə neft-qaz ehtiyatlarının kəşfiyyatı, işlənməsi və hasilatın pay bölgüsü, ixrac boru kəmərləri haqqında və bu qəbildən olan digər sazişlərə uyğun olaraq verilməsi nəzərdə tutulan əsas fondların, daşınan əmlakın və digər aktivlərin Azərbaycan Respublikası Dövlət Neft Fonduna və ya Azərbaycan Respublikasını təmsil edən tərəfə hər hansı şəkildə təqdim edilməsi, habelə idxalı üzrə əməliyyatlar.","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Neft-qaz / pay bölgüsü aktivləri"},{"id":"164.1.12","text":"Metropolitenlə sərnişindaşıma xidmətləri.","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Metropoliten sərnişindaşıma"},{"id":"164.1.13","text":"Ödənişli təhsil xidmətlərinin göstərilməsi (digər fəaliyyətləri ilə bağlı xidmətlərin göstərilməsi istisna olmaqla).","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Ödənişli təhsil xidmətləri"},{"id":"164.1.14","text":"Bu Məcəllənin 106.1.9-106.1.11-ci maddələri ilə müəyyən olunan aktivlərin dəyəri və onların hər hansı şəkildə təqdim olunması üzrə əməliyyatlar;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"106.1.9–11 aktivlərinin təqdimi"},{"id":"164.1.15","text":"müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) yaratdığı sənaye, yaxud texnologiyalar parklarının infrastrukturunun, istehsal sahələrinin yaradılması və tikintisi, habelə elmi-tədqiqat və təcrübə-konstruktor işlərinin görülməsi məqsədi ilə sənaye, yaxud texnologiyalar parklarının idarəedici təşkilatı və ya operatoru tərəfindən müvafiq icra hakimiyyəti orqanının təsdiqedici sənədi əsasında siyahısı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən təsdiq edilən texnikanın, texnoloji avadanlıqların və qurğuların idxalı;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Park operatorunun texnika idxalı"},{"id":"164.1.16","text":"müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) yaratdığı sənaye və texnologiyalar parkında istehsal sahələrinin tikintisi, elmi-tədqiqat və təcrübə-konstruktor işlərinin görülməsi və istehsal məqsədi ilə sənaye, yaxud texnologiyalar parklarının rezidenti olan hüquqi şəxslər və hüquqi şəxs yaratmadan sahibkarlıq fəaliyyətini həyata keçirən fiziki şəxslər tərəfindən müvafiq icra hakimiyyəti orqanının təsdiqedici sənədi əsasında idxal olunan siyahısı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən təsdiq edilən texnikanın, texnoloji avadanlıqların və qurğuların idxalı - rezidentin sənaye və texnologiyalar parkında qeydiyyata alındığı tarixdən 10 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Park rezidentinin texnika idxalı — 10 il"},{"id":"164.1.17","text":"hüquqi şəxsin iştirak paylarının və ya səhmlərinin təqdim edilməsi;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"İştirak payı / səhmin təqdimi"},{"id":"164.1.18","text":"kənd təsərrüfatı məhsullarının istehsalçıları (o cümlədən, sənaye üsulu ilə) tərəfindən özlərinin istehsal etdikləri kənd təsərrüfatı məhsullarının satışı üzrə dövriyyələr - 2014-cü il yanvarın 1-dən 13 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Kənd təsərrüfatı satışı — 13 il"},{"id":"164.1.19","text":"müdafiə təyinatlı məmulatların (döyüş təyinatlı hərbi texnika, hərbi silah və döyüş sursatlarının, partlayıcı maddə və qurğuların, onların dəstləşdirici hissələrinin) layihələndirilməsi, istehsalı, satışı, təmiri və onlara texniki xidmət göstərilməsi fəaliyyətini həyata keçirən şəxslər tərəfindən bu məqsədlə müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) təsdiqedici sənədi əsasında texnologiyaların, avadanlıqların, dəstləşdirici hissələrin, materialların və xammalın idxalı, habelə həmin şəxslər tərəfindən müdafiə təyinatlı məmulatların satışı, təmiri və onlara texniki xidmət göstərilməsi;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Müdafiə təyinatlı məmulatlar"},{"id":"164.1.19-1","text":"müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum), Azərbaycan Respublikasının Baş Prokurorluğu tərəfindən verilmiş təsdiqedici sənəd əsasında müdafiə və dövlət təhlükəsizliyi məqsədləri üçün istifadə olunan bütün növ texnika və texniki vasitələrin, onların ehtiyat hissələrinin, xüsusi proqram təminatlarının və silah-sursatın idxalı və satışı;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Müdafiə və təhlükəsizlik texnikası"},{"id":"164.1.20","text":"Azərbaycan Respublikasının ərazisində mövcud qaydada qeydiyyatdan keçmiş humanitar təşkilatlar, həmçinin müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) razılığı ilə digər hüquqi və fiziki şəxslər tərəfindən humanitar yardım kimi gətirilən mallar;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Humanitar yardım malları"},{"id":"164.1.21","text":"texniki yardım da daxil olmaqla, təmənnasız yardım və xeyriyyə məqsədi ilə dövlətlərin, hökumətlərin və beynəlxalq təşkilatların xətti ilə gətirilən mallar;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Təmənnasız / xeyriyyə malları"},{"id":"164.1.22","text":"müvafiq icra hakimiyyəti orqanı tərəfindən müəyyən edilmiş hallarda və qaydada fiziki şəxs tərəfindən gömrük sərhədindən keçirilən istehsal, yaxud kommersiya məqsədləri üçün nəzərdə tutulmayan mallar;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Fiziki şəxsin qeyri-kommersiya malları"},{"id":"164.1.23","text":"ixrac məqsədli neft-qaz fəaliyyəti ilə əlaqədar gətirilən avadanlıq və materiallar (müvafiq icra hakimiyyəti orqanı tərəfindən ixrac məqsədli neft-qaz fəaliyyəti üzrə Azərbaycan Respublikasına idxal olunan avadanlıq və materialların təsdiq olunmuş siyahısı gömrük orqanlarına təqdim edildiyi təqdirdə);","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"İxrac məqsədli neft-qaz avadanlığı"},{"id":"164.1.24","text":"xüsusi iqtisadi zonaya idxal edilən mallar (aksizli mallar istisna olmaqla);","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Xüsusi iqtisadi zona idxalı"},{"id":"164.1.25","text":"siyahısı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən təsdiq edilən lizinq müqaviləsinin obyekti olan əsas vəsaitlərin idxalı;","notes":["(164.1.25-ci maddəyə Azərbaycan Respublikasının 2026-cı il 26 may tarixli 413-VIIQD nömrəli Qanunu ilə edilmiş dəyişiklik 2026-cı il dekabr 25-dən qüvvəyə minir.)"],"parent":"164.1","article":"164","repealed":false,"title":"Lizinq obyekti olan əsas vəsait"},{"id":"164.1.26","text":"investisiya təşviqi sənədini almış hüquqi şəxslər və fərdi sahibkarlar tərəfindən müvafiq icra hakimiyyəti orqanının təsdiqedici sənədi əsasında texnikanın, texnoloji avadanlıqların və qurğuların idxalı – investisiya təşviqi sənədinin alındığı tarixdən 7 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"İnvestisiya təşviqi idxalı — 7 il"},{"id":"164.1.27","text":"buğdanın idxalı və satışı, buğda ununun və çörəyin istehsalı və satışı - 2017-ci il yanvarın 1-dən 10 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Buğda, un, çörək — 10 il"},{"id":"164.1.28","text":"gəmiqayırma və gəmi təmiri müəssisələri tərəfindən müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) təsdiqedici sənədi əsasında həmin fəaliyyətin məqsədləri üçün bütün növ malların idxalı – 2026-cı il mayın 1-dən 3 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Gəmiqayırma / təmir idxalı — 3 il"},{"id":"164.1.29","text":"damazlıq heyvanların idxalı və satışı;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Damazlıq heyvanlar"},{"id":"164.1.30","text":"toxum və tinglərin idxalı və satışı;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Toxum və tinglər"},{"id":"164.1.31","text":"siyahısı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən təsdiq edilən gübrələrin, pestisidlərin idxalı və satışı;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Gübrə və pestisidlər"},{"id":"164.1.32","text":"siyahısı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən təsdiq edilən toxumların yetişdirilməsi, quşçuluq və arıçılıq üçün avadanlıqların, o cümlədən bu sahələrdə istifadəsi nəzərdə tutulmuş laboratoriya avadanlıqlarının, toxum, taxıl və quru paxlalı bitkilərin təmizlənməsi, çeşidlənməsi və ya kalibrlənməsi üçün maşınların idxalı və satışı;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Toxum / quşçuluq / arıçılıq avadanlığı"},{"id":"164.1.33","text":"siyahısı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən təsdiq edilən kənd təsərrüfatı heyvanlarının və quşların profilaktikası, diaqnostikası və müalicəsi üçün istifadə olunan baytarlıq preparatlarının idxalı;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Baytarlıq preparatları"},{"id":"164.1.34","text":"siyahısı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən təsdiq olunmuş bilavasitə kənd təsərrüfatı təyinatlı suvarma və digər qurğuların, maşınların, avadanlıqların və texnikaların, habelə kənd təsərrüfatı texnikasının ehtiyat hissələrinin istehsalı, idxalı və satışı;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Kənd təsərrüfatı texnikası"},{"id":"164.1.34-1","text":"kənd təsərrüfatı texnikalarının mülkiyyət hüququnun keçməməsişərtilə kənd təsərrüfatı istehsalçılarına lizinqə (icarəyə) verilməsi;","notes":["(164.1.34-1-ci maddəyə Azərbaycan Respublikasının 2026-cı il 26 may tarixli 413-VIIQD nömrəli Qanunu ilə edilmiş dəyişiklik 2026-cı il dekabr 25-dən qüvvəyə minir.)"],"parent":"164.1","article":"164","repealed":false,"title":"KT texnikasının lizinqi"},{"id":"164.1.34-2","text":"kənd təsərrüfatı məhsullarının istehsalçılarına aqrotexniki xidmətlərin göstərilməsi;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Aqrotexniki xidmətlər"},{"id":"164.1.35","text":"siyahısı müvafiq icra hakimiyyəti orqanı tərəfindən müəyyən olunan xammalın və materialların idxalı;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Müəyyən xammal və material idxalı"},{"id":"164.1.36","text":"ödəmə qabiliyyətini itirmiş bankların rezolyusiyası və sağlamlaşdırma tədbirləri çərçivəsində müvafiq icra hakimiyyəti orqanının müəyyən etdiyi qaydada qeyri-işlək (toksik) aktivlərin təqdim edilməsi, habelə bankın iflas proseduru çərçivəsində aktivlərinin təqdim edilməsi – 2017-ci il yanvarın 1-dən 14 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Bank rezolyusiyası aktivləri — 14 il"},{"id":"164.1.37","text":"heyvan və quş ətinin satışı – 2020-ci il yanvarın 1-dən 7 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Heyvan və quş ətinin satışı — 7 il"},{"id":"164.1.38","text":"mülki aviasiya məqsədləri üçün idxal edilən hava gəmiləri, onların ehtiyat hissələri, mühərrikləri və güc qurğuları;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Mülki aviasiya hava gəmiləri"},{"id":"164.1.40","text":"KOB klaster şirkəti tərəfindən mikro, kiçik və orta sahibkarlığın inkişafını dəstəkləyən müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) təsdiqedici sənədi əsasında istehsal, yaxud emal məqsədləri üçün texnikanın, texnoloji avadanlıqların və qurğuların idxalı – KOB klaster şirkətinin KOB klaster şirkətlərinin reyestrinə daxil edildiyi tarixdən 7 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"KOB klaster texnika idxalı — 7 il"},{"id":"164.1.41","text":"müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən verilmiş təsdiqedici sənədə əsasən sənaye parklarının rezidentləri tərəfindən sənaye istehsalı (yığımı) məqsədilə oturacaqsız, tutacaqsız və monitoru quraşdırılmamış yalnız elektrik mühərriki ilə işləyən avtobusların idxalı və sənaye parklarının rezidentləri tərəfindən idxal edilmiş həmin avtobusların oturacağı, tutacağı və monitoru quraşdırılmaqla satışı – 2026-cı il yanvarın 1-dən 1 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Elektrik avtobus idxalı — 1 il"},{"id":"164.1.41-1","text":"istehsal tarixi 3 ildən və mühərrikinin həcmi 2500 kubsantimetrdən çox olmayan hibrid avtomobillərin idxalı və satışı - 2022-ci il yanvarın 1-dən 4 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Hibrid avtomobil — 4 il"},{"id":"164.1.41-2","text":"elektrik mühərriki ilə işləyən avtomobillər üçün ikinci və üçüncü səviyyə elektrik enerji doldurucularının idxalı və satışı - 2022-ci il yanvarın 1-dən 5 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Elektrik doldurucu — 5 il"},{"id":"164.1.41-3","text":"Azərbaycan Respublikasının ərazisində istehsal olunan minik avtomobillərinin satışı – 2023-cü il mayın 1-dən 10 il müddətinə;","notes":["(164.1.41-3-cü maddəyə Azərbaycan Respublikasının 2025-ci il 9 dekabr tarixli 297-VIIQD nömrəli Qanunu ilə edilmiş dəyişiklik 2027-ci il 1 yanvar tarixində qüvvəyə minir.)"],"parent":"164.1","article":"164","repealed":false,"title":"Yerli minik avtomobili — 10 il"},{"id":"164.1.41-4","text":"Azərbaycan Respublikasının ərazisində istehsal olunan avtobusların və yük avtomobillərinin satışı, habelə müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) təsdiqedici sənədi əsasında hüquqi şəxslər tərəfindən istehsal məqsədilə avtobusların və yük avtomobillərinin ehtiyat hissələrinin idxalı – avtobuslara münasibətdə 2025-ci il yanvarın 1-dən 8 il müddətinə, yük avtomobillərinə münasibətdə 2026-cı il yanvarın 1-dən 7 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Yerli avtobus və yük avtomobili"},{"id":"164.1.41-5","text":"müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) təsdiqedici sənədi əsasında şəxs tərəfindən təqvim ili ərzində 1 ədəddən (ölkə üzrə ümumilikdə 10 ədəddən) artıq olmamaqla raritet avtonəqliyyat vasitələrinin idxalı;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Raritet avtomobil (ildə 1 ədəd)"},{"id":"164.1.42","text":"“Məşğulluq haqqında” Azərbaycan Respublikasının Qanununa uyğun olaraq müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən haqqı ödənilən ictimai işlərin təşkili ilə əlaqədar işçi qüvvəsinin təqdim edilməsi üzrə əməliyyatlar;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"İctimai işlərə işçi qüvvəsi"},{"id":"164.1.43","text":"kəpəyin istehsalı və satışı – 2019-cu il martın 1-dən 8 il müddətinə.","notes":["(2019-cu il martın 1-dən 2021-ci il avqustun 1-dək qüvvədədir.)"],"parent":"164.1","article":"164","repealed":false,"title":"Kəpək istehsalı və satışı — 8 il"},{"id":"164.1.46","text":"siyahısı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən təsdiq edilən yem məhsullarının və yem əlavələrinin satışı üzrə dövriyyələr – 2020-ci il yanvarın 1-dən 7 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Yem və yem əlavələri — 7 il"},{"id":"164.1.47","text":"bina tikintisi fəaliyyəti ilə məşğul olan şəxslər tərəfindən tikilən binanın yaşayış və qeyri-yaşayış sahələrinin dövlətə ayrılan hissəsinin təqdim edilməsi üzrə dövriyyələr;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Binanın dövlətə ayrılan hissəsi"},{"id":"164.1.48","text":"siyahısı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən təsdiq edilən dövlət adından yaradılan publik hüquqi şəxslər tərəfindən nizamnamələrində nəzərdə tutulan və onlara həvalə edilən vəzifələrin yerinə yetirilməsi üçün dövlət büdcəsindən ayrılmış vəsait hesabına müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) ilə bağlanılmış müqavilə əsasında işlərin və xidmətlərin göstərilməsi – 2020-ci il yanvarın 1-dən 7 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Publik hüquqi şəxsin büdcə işləri — 7 il"},{"id":"164.1.49","text":"Azərbaycan Respublikasında keçirilən Formula 1 və Formula 2 yarışları ilə bağlı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) ilə bağlanılmış müqavilə əsasında mal, iş və xidmətin təqdim edilməsi – 2018-ci il yanvarın 1-dən 9 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Formula 1 / 2 — 9 il"},{"id":"164.1.50","text":"Azərbaycan Respublikasında daimi nümayəndəlik yaratmayan qeyri-rezident şəxslərin mülki aviasiya fəaliyyəti çərçivəsində hava gəmilərinin və hava gəmilərinin mühərriklərinin rezident hüquqi şəxslərə icarəyə və ya lizinqə verilməsi;","notes":["(164.1.50-ci maddəyə Azərbaycan Respublikasının 2026-cı il 26 may tarixli 413-VIIQD nömrəli Qanunu ilə edilmiş dəyişiklik 2026-cı il dekabr 25-dən qüvvəyə minir.)"],"parent":"164.1","article":"164","repealed":false,"title":"Qeyri-rezident hava gəmisi icarəsi"},{"id":"164.1.51","text":"“Tibbi sığorta haqqında” Azərbaycan Respublikasının Qanununa uyğun olaraq icbari tibbi sığorta fondunun, habelə siyahısı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən təsdiq edilən ictimai və sosial məqsədlər üçün yaradılmış fondların vəsaiti hesabına tibbi xidmətlərin göstərilməsi – 2024-cü il yanvarın 1-dən 3 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"İcbari tibbi sığorta xidmətləri — 3 il"},{"id":"164.1.51-1","text":"tədris bazası kimi fəaliyyət göstərən tibb müəssisələrində tibbi xidmətlərin göstərilməsi -2024-cü il yanvarın 1-dən 3 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Tədris tibb müəssisəsi — 3 il"},{"id":"164.1.52","text":"müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) təsdiqedici sənədi əsasında iri neft emalı zavodlarının (xam neft üzrə illik emal gücü 3 milyon tondan az olmayan) yenidən qurulması layihələri çərçivəsində avadanlıqların və materialların idxalı – 2021-ci il yanvarın 1-dən 8 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"İri neft emalı zavodu — 8 il"},{"id":"164.1.54","text":"qızıldan və gümüşdən hazırlanan zərgərlik məmulatlarının istehsalı və emalı işlərinin görülməsi məqsədilə müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) təsdiqedici sənədi əsasında dəzgahların, avadanlıqların və qurğuların idxalı – 2021-ci il yanvarın 1-dən 6 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Zərgərlik dəzgahı idxalı — 6 il"},{"id":"164.1.55","text":"külçə, sikkə və ya qranul şəklində qızılın və gümüşün satışı;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Külçə / sikkə qızıl və gümüş"},{"id":"164.1.56","text":"müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) təsdiqedici sənədi əsasında Azərbaycan Respublikasının işğaldan azad edilmiş ərazilərinin, habelə müharibə və hərbi əməliyyatların təsirinə məruz qalmış digər təhlükəli ərazilərin minalardan və digər partlayıcı sursatlardan təmizlənməsi çərçivəsində bütün növ texnikanın, avadanlıqların, texniki vasitələrin və qurğuların, onların ehtiyat hissələrinin, fərdi zirehli qoruyucu geyimlərin, alətlərin, partlayıcı və pirotexniki vasitələrin , onların yaradılması və (və ya) istehsalı üçün texnologiyaların, avadanlıqların, dəstləşdirici hissələrin və xammalın, habelə minaaxtaran itlərin idxalı – 2023-cü il martın 1-dən 5 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Minatəmizləmə idxalı — 5 il"},{"id":"164.1.56-1","text":"müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) təsdiqedici sənədi əsasında Azərbaycan Respublikasının işğaldan azad edilmiş ərazilərinin, habelə müharibə və hərbi əməliyyatların təsirinə məruz qalmış digər təhlükəli ərazilərin minalardan və digər partlayıcı sursatlardan təmizlənməsi çərçivəsində bütün növ texnikanın, avadanlıqların, texniki vasitələrin və qurğuların, onların ehtiyat hissələrinin, fərdi zirehli qoruyucu geyimlərin, alətlərin, partlayıcı və pirotexniki vasitələrin istehsalı və satışı – 2023-cü il martın 1-dən 5 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Minatəmizləmə istehsalı — 5 il"},{"id":"164.1.57","text":"lotereya biletlərinin satıcısı ilə bağlanmış müqavilə əsasında və ya onun tapşırığı əsasında lotereya biletlərinin bütün mərhələlərdə agent qaydasında satışının həyata keçirilməsi üzrə xidmətlərin göstərilməsi;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Lotereya bileti agent satışı"},{"id":"164.1.58","text":"özəl baytarlıq xidmətlərinin göstərilməsi;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Özəl baytarlıq xidmətləri"},{"id":"164.1.59","text":"vəkillər və vəkil qurumları tərəfindən order markasının əldə edilməsi ilə bağlı Azərbaycan Respublikasının Vəkillər Kollegiyasına edilən ödənişlər; (vəkillər və vəkil qurumları tərəfindən order markasının əldə edilməsi ilə bağlı “Vəkillər və vəkillik fəaliyyəti haqqında” Azərbaycan Respublikasının Qanununa ediləcək dəyişikliklərlə eyni gündə qüvvəyə minir)","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Vəkil order markası"},{"id":"164.1.60","text":"siyahısı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən təsdiq edilmiş əsas vəsaitlərin idxalı;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Müəyyən əsas vəsait idxalı"},{"id":"164.1.61","text":"müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) təsdiqedici sənədi əsasında müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) yenidən qurulması layihəsi çərçivəsində avadanlıqların və ehtiyat hissələrinin idxalı – 2023-cü il yanvarın 1-dən 3 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Qurumun yenidən qurulması — 3 il"},{"id":"164.1.62","text":"müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) verdiyi təsdiqedici sənəd əsasında svop əməliyyatları çərçivəsində xam neftin və təbii qazın idxalı -2024-cü il yanvarın 1-dən 3 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Svop — xam neft və qaz — 3 il"},{"id":"164.1.63","text":"aşağıda göstərilən hallarda və müddətlərdə müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) təsdiqedici sənədi əsasında malların idxalı:","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"DÖT / enerji layihəsi idxalı — 30 il"},{"id":"164.1.63.1","text":"dövlət-özəl tərəfdaşlığı layihələri çərçivəsində özəl tərəfdaş və ya layihə şirkəti olan şəxslər tərəfindən texnikanın, texnoloji avadanlıqların və qurğuların idxalı – “Dövlət-özəl tərəfdaşlığı haqqında” Azərbaycan Respublikasının Qanununa uyğun olaraq bağlanılmış dövlət-özəl tərəfdaşlığı müqaviləsində müəyyən olunan müddətdə, lakin 30 ildən (tikinti dövrü də daxil olmaqla) çox olmayaraq;","notes":[],"parent":"164.1.63","article":"164","repealed":false,"title":"DÖT özəl tərəfdaşın idxalı"},{"id":"164.1.63.2","text":"dövlətin satınalma öhdəliyi ilə bərpa olunan enerji mənbələrindən istifadə edilməklə, müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) müəyyən etdiyi məbləğdən aşağı olmayan elektrik enerjisi istehsalı layihələri üzrə istehsalçı olan şəxslər tərəfindən texnikanın, texnoloji avadanlıqların və qurğuların idxalı – “Elektrik enerjisi istehsalında bərpa olunan enerji mənbələrindən istifadə haqqında” Azərbaycan Respublikasının Qanununa uyğun olaraq bağlanılmış elektrik enerjisinin satınalma müqaviləsi ilə müəyyən olunan müddətdə, lakin 30 ildən (tikinti dövrü də daxil olmaqla) çox olmayaraq;","notes":[],"parent":"164.1.63","article":"164","repealed":false,"title":"Bərpa olunan enerji idxalı"},{"id":"164.1.63.3","text":"dövlət-özəl tərəfdaşlığı müqaviləsində vergi güzəştlərindən istifadə etmək hüququ nəzərdə tutulan və belə müqavilə üzrə özəl tərəfdaşın və ya layihə şirkətinin tikinti işlərinə cəlb etdiyi podratçısı tərəfindən texnikanın, texnoloji avadanlıqların və qurğuların idxalı (idxal edilən mallar həmin layihənin dəyərinə aid edildiyi təqdirdə) - dövlət-özəl tərəfdaşlığı müqaviləsində tikinti işlərinin həyata keçirilməsi üçün nəzərdə tutulan müddətdə;","notes":[],"parent":"164.1.63","article":"164","repealed":false,"title":"DÖT podratçısının idxalı"},{"id":"164.1.64","text":"müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) təsdiqedici sənədi əsasında xarici iqtisadi fəaliyyətin mal nomenklaturasının kodları üzrə siyahısı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən müəyyən olunan incəsənət əsərlərinin, kolleksiya əşyalarının və əntiq əşyaların idxalı.","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"İncəsənət, kolleksiya, əntiq əşya"}]},{"code":"199","title":"Əmlak vergisindən azadolmalar və güzəştlər","notes":[],"items":[{"id":"199.1","text":"Dövlət hakimiyyəti orqanları, büdcə təşkilatları və yerli özünü idarəetmə orqanları, Azərbaycan Respublikasının Mərkəzi Bankı və onun qurumları, dövlətin adından yaradılan publik hüquqi şəxslər (sahibkarlıq fəaliyyəti məqsədləri üçün istifadə olunan əmlaka görə ödənilməli əmlak vergisi istisna olmaqla), dövlət fondları və əlilliyi olan şəxslərin qeyri-hökumət təşkilatları əmlak vergisini ödəməkdən azaddır.","notes":[],"parent":null,"article":"199","repealed":false,"title":"Dövlət orqanları, MB, əlillik QHT"},{"id":"199.2","text":"Misgərlik, qalayçılıq, dulusçuluq və saxsı məmulatlarının, təsərrüfat müxəlləfatının, bağçılıq-bostançılıq alətlərinin, xalq musiqi alətlərinin, oyuncaqların, suvenirlərin, qamışdan və qarğıdan məişət əşyalarının düzəldilməsi, keramika məmulatlarının bədii işlənməsi, bədii tikmə, ağac materiallardan məişət alətlərinin hazırlanması sahəsində hüquqi şəxs yaratmadan sahibkarlıq fəaliyyəti ilə məşğul olan fiziki şəxslərin sənətkarlıq emalatxanalarının binaları və ya binaların bu emalatxanalar yerləşən hissələri əmlak vergisinə cəlb edilmir.","notes":[],"parent":null,"article":"199","repealed":false,"title":"Sənətkarlıq emalatxanası"},{"id":"199.3","text":"Binaların icarəyə, kirayəyə verildiyi, habelə sahibkarlıq və ya kommersiya fəaliyyəti ilə məşğul olmaq üçün istifadə edildiyi hallar istisna olmaqla, bu Məcəllənin 102.1-1-ci və 102.2-ci maddələrində göstərilən şəxslərin, habelə pensiyaçıların və müddətli hərbi xidmət hərbi qulluqçularının və onların ailə üzvlərinin müddətli hərbi xidmət dövründə binalara görə ödəməli olduqları əmlak vergisininin məbləği 30 manat azaldılır.","notes":[],"parent":null,"article":"199","repealed":false,"title":"102.1-1 / 102.2 / pensiyaçı — 30 manat"},{"id":"199.4","text":"Vergitutma məqsədləri üçün müəssisənin və fərdi sahibkarın əmlakının dəyəri aşağıdakı əmlakların dəyərində (bu Məcəllənin 199.4.4-cü maddəsində nəzərdə tutulmuş əsas vəsaitlərə münasibətdə onların dəyərinin 75 faizi həddində) azaldılır:","notes":[],"parent":null,"article":"199","repealed":false,"title":"Əmlak dəyərinin azaldılması"},{"id":"199.4.1","text":"ekologiya və yanğından mühafizə üçün istifadə edilən əsas vəsaitlər;","notes":[],"parent":"199.4","article":"199","repealed":false,"title":"Ekologiya və yanğından mühafizə"},{"id":"199.4.1-1","text":"müəssisələrin mülkiyyətində (balansında) olan və siyahısı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən təsdiq edilən mülki müdafiə təyinatlı əmlaklar;","notes":[],"parent":"199.4","article":"199","repealed":false,"title":"Mülki müdafiə əmlakı"},{"id":"199.4.2","text":"məhsul ötürən kəmərlər, dəmir və avtomobil yolları, rabitə və enerji ötürücü xətləri, meliorasiya və suvarma sistemi obyektləri, peyklər və digər kosmik obyektlər;","notes":[],"parent":"199.4","article":"199","repealed":false,"title":"Kəmər, yol, xətt, peyk"},{"id":"199.4.3","text":"fiziki şəxslərə məxsus sahibkarlıq fəaliyyətində istifadə olunmayan minik avtomobilləri;","notes":[],"parent":"199.4","article":"199","repealed":false,"title":"Sahibkarlıqda istifadə olunmayan minik"},{"id":"199.4.4","text":"təhsil, tibb, mədəniyyət və idman sahəsində fəaliyyət göstərən vergi ödəyicilərinin yalnız bu sahələrin təyinatı üzrə istifadə etdiyi əsas vəsaitlər;","notes":[],"parent":"199.4","article":"199","repealed":false,"title":"Təhsil, tibb, mədəniyyət, idman"},{"id":"199.4.5","text":"Çıxarılmışdır.","notes":[],"parent":"199.4","article":"199","repealed":true,"title":""},{"id":"199.5","text":"Şəhərlərdə sərnişin daşımaları üçün istifadə olunan trolleybuslar və tramvaylar əmlak vergisindən azaddır.","notes":[],"parent":null,"article":"199","repealed":false,"title":"Trolleybus və tramvay"},{"id":"199.6","text":"Çıxarılmışdır.","notes":[],"parent":null,"article":"199","repealed":true,"title":""},{"id":"199.7","text":"Müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) yaratdığı sənaye, yaxud texnologiyalar parklarının rezidenti olan hüquqi şəxslər və hüquqi şəxs yaratmadan sahibkarlıq fəaliyyətini həyata keçirən fiziki şəxslər qanunvericiliyə uyğun olaraq, sənaye və texnologiyalar parkında qeydiyyata alındıqları hesabat ilindən başlayaraq, 10 il müddətinə sənaye və texnologiyalar parkındakı əmlaklarına görə əmlak vergisini ödəməkdən azaddırlar. Bu maddədə nəzərdə tutulan güzəşt texnologiyalar parkının rezidenti kimi texnologiyalar parkından kənar sistem inteqrasiyası, proqram təminatının hazırlanması və inkişaf etdirilməsi fəaliyyətini həyata keçirən şəxslərə də tətbiq edilir.","notes":[],"parent":null,"article":"199","repealed":false,"title":"Sənaye / texnopark rezidenti — 10 il"},{"id":"199.7-1","text":"Müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) yaratdığı sənaye parkında müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) müəyyən etdiyi fəaliyyətlə məşğul olan sənaye parkının rezidenti həmin fəaliyyət prosesində istifadə etdiyi sənaye parkındakı əmlakına görə 2025-ci il yanvarın 1-dən 6 il müddətinə əmlak vergisini ödəməkdən azaddır.","notes":[],"parent":null,"article":"199","repealed":false,"title":"Sənaye parkı xüsusi fəaliyyət — 6 il"},{"id":"199.8","text":"Müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) yaratdığı sənaye, yaxud texnologiyalar parklarının və sənaye məhəllələrinin idarəedici təşkilatı və ya operatoru sənaye, yaxud texnologiyalar parklarının və sənaye məhəllələrinin ərazisində yerləşən əmlaklarına görə əmlak vergisini ödəməkdən azaddır.","notes":[],"parent":null,"article":"199","repealed":false,"title":"Park operatorunun əmlakı"},{"id":"199.9","text":"Kənd təsərrüfatı məhsullarının istehsalı ilə məşğul olan (o cümlədən, sənaye üsulu ilə) hüquqi və fiziki şəxslər həmin fəaliyyət prosesində istifadə olunan əmlaka görə 2014-cü il yanvarın 1-dən 13 il müddətinə əmlak vergisini ödəməkdən azaddırlar.","notes":[],"parent":null,"article":"199","repealed":false,"title":"Kənd təsərrüfatı əmlakı — 13 il"},{"id":"199.11","text":"İnvestisiya təşviqi sənədini almış hüquqi şəxs və fərdi sahibkar həmin sənədi aldığı tarixdən müvafiq investisiya layihəsi çərçivəsində investisiya vəsaiti hesabına əldə edilmiş (alınmış, gətirilmiş, istehsal edilmiş, tikilmiş və ya quraşdırılmış) əmlakına görə 7 il müddətinə əmlak vergisini ödəməkdən azaddır. Bu maddə ilə müəyyən edilmiş azadolma investisiya təşviqi sənədi alınan tarixədək əldə edilmiş və hüquqi şəxs və ya fərdi sahibkar tərəfindən sahibkarlıq fəaliyyətində istifadə edilmiş əmlaklara tətbiq edilmir. Bu maddə ilə müəyyən edilən azadolma investisiya layihəsi çərçivəsində sahibkarlıq fəaliyyətinə cəlb edilən və əvvəllər vergi ödəyicisinin sahibkarlıq fəaliyyətində istifadə edilməyən binalara da şamil edilir.","notes":[],"parent":null,"article":"199","repealed":false,"title":"İnvestisiya təşviqi əmlakı — 7 il"},{"id":"199.12","text":"2019-cu il yanvarın 1-dən 2022-ci il yanvarın 1-dək özəlləşdirilməsi başa çatmış dövlət əmlakına görə ödənilmiş əmlak vergisi aşağıdakı şərtlər daxilində vergi ödəyicisinin ərizəsi əsasında qaytarılır və ya onun razılığı ilə sonrakı vergi öhdəliklərinin yerinə yetirilməsinə aid edilir:","notes":[],"parent":null,"article":"199","repealed":false,"title":"Özəlləşdirilmiş əmlak vergisinin qaytarılması"},{"id":"199.12.1","text":"hesabat ilində digər vergilər üzrə hesablanmış və ödənilmiş verginin məbləği özəlləşdirilməsi başa çatmış əmlaka görə həmin hesabat ili üçün dövlət büdcəsinə hesablanmış və ödənilmiş verginin məbləğindən az olmasın;","notes":[],"parent":"199.12","article":"199","repealed":false,"title":"Digər vergilər az olmasın"},{"id":"199.12.2","text":"ödənilmiş əmlak vergisinin qaytarılmasına dair ərizə ilə müraciət edildiyi tarixə vergi ödəyicisinin dövlət büdcəsinə vergilər, faizlər və maliyyə sanksiyaları üzrə borcu olmasın.","notes":[],"parent":"199.12","article":"199","repealed":false,"title":"Büdcəyə borc olmasın"},{"id":"199.13","text":"Bu Məcəllənin 199.12-ci maddəsi ilə müəyyən olunmuş güzəşt hüququ eyni əmlaka görə yalnız bir hesabat ili üzrə tətbiq edilir.","notes":[],"parent":null,"article":"199","repealed":false,"title":"Qaytarma yalnız 1 il üçün"},{"id":"199.14","text":"Mikro sahibkarlıq subyekti olan şəxslər əmlak vergisini ödəməkdən azaddırlar (mülkiyyətində olan əsas vəsaitlərin ilin əvvəlinə qalıq dəyəri 1.000.000 manatdan artıq olan şəxslər istisna olmaqla).","notes":[],"parent":null,"article":"199","repealed":false,"title":"Mikro sahibkar — əmlak azad"},{"id":"199.15","text":"KOB klaster şirkətləri KOB klaster şirkətlərinin reyestrinə daxil edildiyi tarixdən KOB klaster fəaliyyətində istifadə olunan əmlaklara görə 7 il müddətinə əmlak vergisini ödəməkdən azaddırlar.","notes":[],"parent":null,"article":"199","repealed":false,"title":"KOB klaster əmlakı — 7 il"},{"id":"199.16","text":"Müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) ödəmə qabiliyyətini itirmiş bankların rezolyusiyası və sağlamlaşdırma tədbirləri çərçivəsində müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanının (qurumun) qərarına əsasən aldığı problemli aktivlərin (borcların) əvəzində əldə etdiyi, onun mülkiyyətində (balansında) olan və siyahısını müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) ilə razılaşdırdığı əmlaka görə 2019-cu il yanvarın 1-dən 12 il müddətinə əmlak vergisini ödəməkdən azaddır.","notes":[],"parent":null,"article":"199","repealed":false,"title":"Bank rezolyusiyası əmlakı — 12 il"},{"id":"199.17","text":"Siyahısı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən təsdiq edilmiş idxal mallarını yerli istehsal (emal) malları ilə əvəz edəcək qida məhsullarının istehsalı ilə məşğul olan hüquqi və fiziki şəxslər həmin fəaliyyət prosesində istifadə olunan əmlaka görə müvafiq siyahının təsdiq edildiyi ildən etibarən 7 il müddətinə əmlak vergisini ödəməkdən azaddırlar.","notes":[],"parent":null,"article":"199","repealed":false,"title":"Qida idxalını əvəzetmə — 7 il"},{"id":"199.18","text":"Kredit təşkilatları məhkəmənin qanuni qüvvəyə minmiş qərarına əsasən müflis elan olunduğu halda kredit təşkilatının müflis elan olunması ilə bağlı məhkəmə qərarının qüvvəyə mindiyi aydan etibarən əmlak vergisini ödəməkdən azaddırlar.","notes":[],"parent":null,"article":"199","repealed":false,"title":"Müflis kredit təşkilatı"},{"id":"199.19","text":"Azərbaycan Respublikasında dövlət əmlakının özəlləşdirilməsinin dövlət proqramlarına uyğun olaraq 2023-cü il 1 yanvar tarixindən sonra özəlləşdirilməsi barədə qərar qəbul edilən dövlətə məxsus hüquqi şəxslər özəlləşdirilməsi barədə qərarın qəbul edildiyi ildən etibarən özəlləşdirilmə prosesi müddətində, lakin 3 ildən çox olmayaraq, əmlak vergisini ödəməkdən azaddırlar.","notes":[],"parent":null,"article":"199","repealed":false,"title":"Özəlləşdirmə prosesi — 3 il"},{"id":"199.20","text":"Kredit təşkilatları verilmiş kredit müqabilində onların mülkiyyətinə keçən əmlaklara görə həmin əmlakların balansa götürüldüyü təqvim ilindən başlayaraq 2 il müddətinə əmlak vergisini ödəməkdən azaddırlar.","notes":[],"parent":null,"article":"199","repealed":false,"title":"Kredit müqabilində əmlak — 2 il"},{"id":"199.21","text":"Bu Məcəllənin 199.11-ci, 199.14-cü və 199.15-ci maddələri nəzərə alınmaqla, Bakı, Sumqayıt, Xırdalan şəhərləri və Abşeron rayonu istisna olmaqla, respublikanın digər şəhər və rayonlarında, o cümlədən Naxçıvan Muxtar Respublikasında mehmanxana (hotel) və sanatoriya fəaliyyətində istifadə edilən (bu Məcəllənin 16.3-cü maddəsinə müvafiq olaraq sahibkarlıq fəaliyyətinin müvəqqəti dayandırıldığı dövr istisna olmaqla) yerləşmə vasitəsi olan daşınmaz əmlaklara görə əmlak vergisi 2024-ci il yanvarın 1-dən 3 il müddətinə 75 faiz azaldılır.","notes":[],"parent":null,"article":"199","repealed":false,"title":"Region hotel / sanatoriya — 75%, 3 il"},{"id":"199.22","text":"dövlət-özəl tərəfdaşlığı layihələri üzrə özəl tərəfdaş və ya layihə şirkəti olan, habelə dövlətin satınalma öhdəliyi ilə bərpa olunan enerji mənbələrindən istifadə edilməklə, müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) müəyyən etdiyi məbləğdən aşağı olmayan elektrik enerjisi istehsalı layihələri üzrə istehsalçı olan fərdi sahibkarlar və hüquqi şəxslər müvafiq olaraq “Dövlət-özəl tərəfdaşlığı haqqında” Azərbaycan Respublikasının Qanununa uyğun olaraq bağlanılmış dövlət-özəl tərəfdaşlığı müqaviləsində və ya “Elektrik enerjisi istehsalında bərpa olunan enerji mənbələrindən istifadə haqqında” Azərbaycan Respublikasının Qanununa uyğun olaraq bağlanılmış elektrik enerjisinin satınalma müqaviləsi ilə müəyyən olunan müddətə, lakin 30 ildən (tikinti dövrü də daxil olmaqla) çox olmayaraq həmin layihələr çərçivəsində istifadə olunan əmlaka görə əmlak vergisini ödəməkdən azaddırlar.","notes":[],"parent":null,"article":"199","repealed":false,"title":"DÖT və bərpa olunan enerji — 30 il"}]},{"code":"207","title":"Torpaq vergisindən azadolmalar və güzəştlər","notes":[],"items":[{"id":"207.1","text":"Aşağıdakı torpaqlar torpaq vergisinə cəlb edilmir:","notes":[],"parent":null,"article":"207","repealed":false,"title":"Torpaq vergisinə cəlb olunmayanlar"},{"id":"207.1.1","text":"yaşayış məntəqələrinin ümumi istifadədə olan torpaqları;","notes":[],"parent":"207.1","article":"207","repealed":false,"title":"Ümumi istifadə torpaqları"},{"id":"207.1.2","text":"Dövlət hakimiyyəti orqanlarının, büdcə təşkilatlarının və yerli özünü idarəetmə orqanlarının, Azərbaycan Respublikası Mərkəzi Bankının və onun qurumlarının, dövlətin adından yaradılan publik hüquqi şəxslərin (sahibkarlıq fəaliyyəti məqsədləri üçün istifadə olunan torpaqlar istisna olmaqla), habelə Azərbaycan Respublikasının Dövlət Neft Fondunun mülkiyyətində və ya istifadəsində olan torpaqlar;","notes":[],"parent":"207.1","article":"207","repealed":false,"title":"Dövlət orqanları, MB, Neft Fondu"},{"id":"207.1.3","text":"fiziki və hüquqi şəxslərin istifadəsinə verilməmiş dövlət, meşə və su fondu torpaqları, Xəzər dənizinin (gölünün) Azərbaycan Respublikasına məxsus olan sektorunun altında yerləşən torpaqlar;","notes":[],"parent":"207.1","article":"207","repealed":false,"title":"Dövlət, meşə, su fondu, Xəzər dibi"},{"id":"207.1.4","text":"dövlət sərhəd zolaqları və müdafiə təyinatlı torpaqlar.","notes":[],"parent":"207.1","article":"207","repealed":false,"title":"Sərhəd zolağı və müdafiə torpaqları"},{"id":"207.2","text":"Bu Məcəllənin 102.1-1-ci və 102.2-ci maddələrində göstərilən şəxslərin mülkiyyətində olan torpaqlara görə torpaq vergisinin məbləği 10 manat azaldılır.","notes":[],"parent":null,"article":"207","repealed":false,"title":"102.1-1 / 102.2 şəxslər — 10 manat"},{"id":"207.3","text":"Müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) yaratdığı sənaye, yaxud texnologiyalar parklarının rezidenti olan hüquqi şəxslər və hüquqi şəxs yaratmadan sahibkarlıq fəaliyyətini həyata keçirən fiziki şəxslər qanunvericiliyə uyğun olaraq, sənaye və texnologiyalar parkında qeydiyyata alındıqları hesabat ilindən başlayaraq, sənaye və texnologiyalar parkında istifadə etdikləri torpaqlara görə 10 il müddətinə torpaq vergisini ödəməkdən azaddırlar. Bu maddədə nəzərdə tutulan güzəşt texnologiyalar parkının rezidenti kimi texnologiyalar parkından kənar sistem inteqrasiyası, proqram təminatının hazırlanması və inkişaf etdirilməsi fəaliyyətini həyata keçirən şəxslərə də tətbiq edilir.","notes":[],"parent":null,"article":"207","repealed":false,"title":"Sənaye / texnopark rezidenti — 10 il"},{"id":"207.3-1","text":"Müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) yaratdığı sənaye parkında müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) müəyyən etdiyi fəaliyyətlə məşğul olan sənaye parkının rezidenti həmin fəaliyyət prosesində istifadə etdiyi sənaye parkındakı torpaqlara görə 2025-ci il yanvarın 1-dən 6 il müddətinə torpaq vergisini ödəməkdən azaddır.","notes":[],"parent":null,"article":"207","repealed":false,"title":"Sənaye parkı xüsusi fəaliyyət — 6 il"},{"id":"207.4","text":"Müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) yaratdığı sənaye, yaxud texnologiyalar parklarının və sənaye məhəllələrinin idarəedici təşkilatı və ya operatoru sənaye, yaxud texnologiyalar parklarının və sənaye məhəllələrinin ərazisində istifadə etdiyi torpaqlara görə torpaq vergisini ödəməkdən azaddır.","notes":[],"parent":null,"article":"207","repealed":false,"title":"Park operatorunun torpağı"},{"id":"207.5","text":"İnvestisiya təşviqi sənədini almış hüquqi şəxs və fərdi sahibkar həmin sənədi aldığı tarixdən mülkiyyətində və ya istifadəsində olan müvafiq torpaqlara görə 7 il müddətinə torpaq vergisini ödəməkdən azaddır.","notes":[],"parent":null,"article":"207","repealed":false,"title":"İnvestisiya təşviqi — 7 il"},{"id":"207.6","text":"KOB klaster şirkətləri KOB klaster şirkətlərinin reyestrinə daxil edildiyi tarixdən 7 il müddətinə mülkiyyətində və ya istifadəsində olan və KOB klaster fəaliyyətində istifadə olunan torpaqlara görə torpaq vergisini ödəməkdən azad edilirlər.","notes":[],"parent":null,"article":"207","repealed":false,"title":"KOB klaster — 7 il"},{"id":"207.7","text":"Müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) ödəmə qabiliyyətini itirmiş bankların rezolyusiyası və sağlamlaşdırma tədbirləri çərçivəsində müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanının (qurumun) qərarına əsasən aldığı problemli aktivlərin (borcların) əvəzində əldə etdiyi, onun mülkiyyətində (balansında) olan və siyahısını müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) ilə razılaşdırdığı torpağa görə 2019-cu il yanvarın 1-dən 12 il müddətinə torpaq vergisini ödəməkdən azaddır.","notes":[],"parent":null,"article":"207","repealed":false,"title":"Bank rezolyusiyası torpağı — 12 il"},{"id":"207.8","text":"Geoloji ayırma sənədi əsasında faydalı qazıntı yataqlarının (neft və qaz yataqları istisna olmaqla) axtarışı, qiymətləndirilməsi və kəşfiyyatı işlərinə cəlb edilən torpaq sahələrinə görə torpaq vergisi müvafiq təsdiqedici sənədlər (geoloji-kəşfiyyat işlərini həyata keçirən şəxsin podrat müqaviləsi, geoloji-kəşfiyyat planı, geoloji-kəşfiyyatla bağlı təqdim edilən hesabat) əsasında faydalı qazıntı yataqlarının axtarışı, qiymətləndirilməsi və kəşfiyyatı işlərinə başlanıldığı təqvim ili üzrə 75 faiz azaldılır. Bu maddənin müddəaları eyni vergi ilində geoloji ayırma sənədi əsasında faydalı qazıntı yataqlarının (neft və qaz yataqları istisna olmaqla) axtarışı, qiymətləndirilməsi və kəşfiyyatı işlərinə cəlb edilən və istismar edilərək faydalı qazıntılar çıxarılan torpaq sahələrinə münasibətdə tətbiq edilmir.","notes":[],"parent":null,"article":"207","repealed":false,"title":"Geoloji kəşfiyyat — 75%"},{"id":"207.9","text":"Kredit təşkilatları məhkəmənin qanuni qüvvəyə minmiş qərarına əsasən müflis elan olunduğu halda kredit təşkilatının müflis elan olunması ilə bağlı məhkəmə qərarının qüvvəyə mindiyi ildən etibarən torpaq vergisini ödəməkdən azaddırlar.","notes":[],"parent":null,"article":"207","repealed":false,"title":"Müflis kredit təşkilatı"},{"id":"207.10","text":"Siyahısı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən təsdiq edilmiş idxal mallarını yerli istehsal (emal) malları ilə əvəz edəcək qida məhsullarının istehsalı ilə məşğul olan hüquqi və fiziki şəxslər həmin fəaliyyət prosesində istifadə olunan torpaqlara görə müvafiq siyahının təsdiq edildiyi ildən etibarən 7 il müddətinə torpaq vergisini ödəməkdən azaddırlar.","notes":[],"parent":null,"article":"207","repealed":false,"title":"Qida idxalını əvəzetmə — 7 il"},{"id":"207.11","text":"Azərbaycan Respublikasında dövlət əmlakının özəlləşdirilməsinin dövlət proqramlarına uyğun olaraq 2023-cü il 1 yanvar tarixindən sonra özəlləşdirilməsi barədə qərar qəbul edilən dövlətə məxsus hüquqi şəxslər özəlləşdirilməsi barədə qərarın qəbul edildiyi ildən etibarən özəlləşdirilmə prosesi müddətində, lakin 3 ildən çox olmayaraq, torpaq vergisini ödəməkdən azaddırlar.","notes":[],"parent":null,"article":"207","repealed":false,"title":"Özəlləşdirmə prosesi — 3 il"},{"id":"207.12","text":"Kredit təşkilatları verilmiş kredit müqabilində onların mülkiyyətinə keçən torpaqlara görə həmin torpaqların balansa götürüldüyü təqvim ilindən başlayaraq 2 il müddətinə torpaq vergisini ödəməkdən azaddırlar.","notes":[],"parent":null,"article":"207","repealed":false,"title":"Kredit müqabilində torpaq — 2 il"},{"id":"207.13","text":"Dövlət-özəl tərəfdaşlığı layihələri üzrə özəl tərəfdaş və ya layihə şirkəti olan, habelə dövlətin satınalma öhdəliyi ilə bərpa olunan enerji mənbələrindən istifadə edilməklə, müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) müəyyən etdiyi məbləğdən aşağı olmayan elektrik enerjisi istehsalı layihələri üzrə istehsalçı olan fərdi sahibkarlar və hüquqi şəxslər müvafiq olaraq “Dövlət-özəl tərəfdaşlığı haqqında” Azərbaycan Respublikasının Qanununa uyğun olaraq bağlanılmış dövlət-özəl tərəfdaşlığı müqaviləsində və ya “Elektrik enerjisi istehsalında bərpa olunan enerji mənbələrindən istifadə haqqında” Azərbaycan Respublikasının Qanununa uyğun olaraq bağlanılmış elektrik enerjisinin satınalma müqaviləsi ilə müəyyən olunan müddətə, lakin 30 ildən (tikinti dövrü də daxil olmaqla) çox olmayaraq həmin layihələr çərçivəsində istifadə olunan torpaqlara görə torpaq vergisini ödəməkdən azaddırlar.","notes":[],"parent":null,"article":"207","repealed":false,"title":"DÖT və bərpa olunan enerji — 30 il"},{"id":"207.14","text":"Qanunla müəyyən edilmiş qaydada Azərbaycan Respublikasında qeydiyyatdan keçən və teatr, muzey, simfonik orkestr, habelə film istehsalını və dublyajını həyata keçirən kinematoqrafiya müəssisələri və film prodüserləri həmin fəaliyyət üzrə istifadə etdikləri torpaqlara görə 2025-ci il yanvarın 1-dən 5 il müddətinə torpaq vergisini ödəməkdən azaddırlar.","notes":[],"parent":null,"article":"207","repealed":false,"title":"Teatr, muzey, film — 5 il"}]}],"overlaps":[{"id":"park-rezident","title":"Sənaye / texnologiyalar parkı rezidenti","hint":"10 il — 5 vergi","duration":"10 il","taxes":["102","106","164","199","207"],"items":[{"article":"102","code":"102.1.21","note":"fəaliyyətdən gəlir (əməkhaqqı istisna)"},{"article":"106","code":"106.1.13","note":"parkdakı fəaliyyətdən gəlir"},{"article":"164","code":"164.1.16","note":"texnika, avadanlıq, qurğu idxalı"},{"article":"199","code":"199.7","note":"parkdakı əmlaka görə"},{"article":"207","code":"207.3","note":"parkda istifadə olunan torpaq"}]},{"id":"texnopark-it","title":"Texnopark — parkdan kənar IT","hint":"sistem inteqrasiyası, proqram təminatı","duration":"10 il","taxes":["102","106","199","207"],"items":[{"article":"102","code":"102.1.21","note":"gəlirə də şamil edilir"},{"article":"102","code":"102.1.21-1","note":"dividend — 10 il"},{"article":"106","code":"106.1.13","note":"hüquqi şəxsin gəliri"},{"article":"106","code":"106.1.13-1","note":"dividend — 10 il"},{"article":"199","code":"199.7","note":"əmlak güzəşti də tətbiq edilir"},{"article":"207","code":"207.3","note":"torpaq güzəşti də tətbiq edilir"}]},{"id":"investisiya","title":"İnvestisiya təşviqi sənədi","hint":"7 il — 5 vergi","duration":"7 il","taxes":["102","106","164","199","207"],"items":[{"article":"102","code":"102.1.23","note":"gəlirin 50%-i"},{"article":"106","code":"106.1.17","note":"mənfəətin 50%-i"},{"article":"164","code":"164.1.26","note":"texnika, const FACT_SRC = "(?<![\\d.])(\\d{1,3}(?:\\.\\d{3})+|\\d+(?:\\s*[-–]\\s*\\d+)?)[\\s\\u00a0]*(manatdan|manatadək|manatdək|manat|faizindən|faizdən|faizini|faizi|faiz|ildən|illik|aydan|aylıq|yaşınadək|yaşa|nəfərdən|nəfər|kubsantimetrdən|kubsantimetr|ədəddən|ədəd|milyon|kVt|ay|yaş|il)(?![\\p{L}])";
const YEAR_SRC = "(?<![\\d.])(20\\d{2}-c[uüıi]\\s+il(?:in)?(?:(?:\\s+\\d{1,2}\\s+(?:" + MONTH + "))|(?:\\s+(?:" + MONTH + ")(?:ın|in|un|ün)?(?:\\s+\\d{1,2}-d[əea][nk])?))?)";

const ui = {
  article: "102",
  filter: "all",
  query: "",
  cardArticle: "all",
  cardDir: "num",
  onlyLeft: true,
  queue: null,
  pos: 0,
  revealed: false,
  forceQueue: false,
  pendingScroll: null,
  quiz: null,
  expandAll: false,
  quizLen: 10,
  quizArticle: "all",
  overlapMin: 2,
  vatFilter: "all",
  touchX: null,
  sheetGuard: 0
};

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return {};
    return JSON.parse(raw);
  } catch (e) {
    return {};
  }
}
const store = Object.assign({
  status: {},
  stars: {},
  theme: null,
  font: 1,
  tip: true,
  quizLen: 10,
  article: "102",
  cardArticle: "all",
  onlyLeft: true,
  cardDir: "num",
  quizArticle: "all"
}, load());
ui.article = store.article || "102";
ui.cardArticle = store.cardArticle || "all";
ui.cardDir = store.cardDir || "num";
ui.onlyLeft = store.onlyLeft !== false;
ui.quizLen = [10, 25, 50, 999].includes(store.quizLen) ? store.quizLen : 10;
ui.quizArticle = store.quizArticle || "all";

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
}
function getStatus(id) { return store.status[id] || ""; }
function setStatus(id, status) {
  if (status) store.status[id] = status;
  else delete store.status[id];
  save();
}
function toggleStatus(id, status) {
  if (getStatus(id) === status) delete store.status[id];
  else store.status[id] = status;
  save();
}
function stats(code) {
  const items = code && code !== "all" ? ARTICLE[code].items : ITEMS;
  const live = items.filter((it) => !it.repealed);
  const know = live.filter((it) => getStatus(it.id) === "know").length;
  const hard = live.filter((it) => getStatus(it.id) === "hard").length;
  const again = live.filter((it) => getStatus(it.id) === "again").length;
  return { live: live.length, know, hard, again, left: live.length - know, repealed: items.length - live.length, total: items.length };
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fold(s) {
  return s.toLocaleLowerCase("az")
    .replace(/ə/g, "e").replace(/ö/g, "o").replace(/ü/g, "u")
    .replace(/ğ/g, "g").replace(/ı/g, "i").replace(/ş/g, "s")
    .replace(/ç/g, "c");
}
function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function familyOf(unit) {
  const u = unit.toLocaleLowerCase("az");
  if (u.startsWith("manat")) return "manat";
  if (u.startsWith("faiz")) return "faiz";
  if (u.startsWith("il")) return "il";
  if (u.startsWith("ay")) return "ay";
  if (u.startsWith("yaş")) return "yaş";
  if (u.startsWith("nəfər")) return "nəfər";
  if (u.startsWith("kub")) return "kub";
  if (u.startsWith("ədəd")) return "ədəd";
  if (u.startsWith("milyon")) return "milyon";
  if (u === "kvt") return "kvt";
  return u;
}
function collectFacts(text) {
  const raw = [];
  const year = new RegExp(YEAR_SRC, "giu");
  const fact = new RegExp(FACT_SRC, "giu");
  let m;
  while ((m = year.exec(text))) {
    raw.push({ start: m.index, end: m.index + m[0].length, full: m[0], value: m[0], unit: "tarix", family: "tarix" });
  }
  while ((m = fact.exec(text))) {
    raw.push({ start: m.index, end: m.index + m[0].length, full: m[0], value: m[1], unit: m[2], family: familyOf(m[2]) });
  }
  raw.sort((a, b) => a.start - b.start || b.end - a.end);
  const kept = [];
  let end = -1;
  for (const s of raw) {
    if (s.start < end) continue;
    kept.push(s);
    end = s.end;
  }
  return kept;
}
function highlight(text, hideStart) {
  const spans = collectFacts(text);
  let out = "";
  let i = 0;
  for (const s of spans) {
    out += escapeHtml(text.slice(i, s.start));
    if (hideStart != null && s.start === hideStart) out += '<span class="gap">······</span>';
    else out += "<mark>" + escapeHtml(s.full) + "</mark>";
    i = s.end;
  }
  out += escapeHtml(text.slice(i));
  return out;
}
function renderText(text, hideStart) {
  try {
    return highlight(text || "", hideStart).split("\n").map((p) => p.trim()).filter(Boolean).map((p) => "<p>" + p + "</p>").join("");
  } catch (e) {
    return String(text || "").split("\n").map((p) => p.trim()).filter(Boolean).map((p) => "<p>" + escapeHtml(p) + "</p>").join("");
  }
}
function starSvg() {
  return '<svg viewBox="0 0 24 24" stroke-width="1.7" stroke-linejoin="round"><path d="m12 3.4 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8 6.8 19.5l1-5.8L3.5 9.6l5.9-.9z"/></svg>';
}
function toast(text) {
  const el = document.getElementById("toast");
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 1600);
}
function buzz(ok) {
  try { navigator.vibrate?.(ok ? 12 : [18, 36, 18]); } catch (e) {}
}
function themeNow() {
  if (store.theme) return store.theme;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function applyChrome() {
  const theme = themeNow();
  document.documentElement.dataset.theme = theme;
  document.documentElement.dataset.font = String(store.font ?? 1);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = theme === "dark" ? "#121614" : "#efe7da";
}
function parseHash() {
  const parts = (location.hash || "#/ana").replace(/^#\/?/, "").split("/").filter(Boolean);
  return { name: parts[0] || "ana", arg: parts[1] || "", extra: parts[2] || "" };
}
function go(hash) {
  if (location.hash === hash) route();
  else location.hash = hash;
}
function setTab(name) {
  document.querySelectorAll("[data-tab]").forEach((b) => b.classList.toggle("is-on", b.dataset.tab === name));
}
function setEyebrow(text) {
  document.getElementById("eyebrow").textContent = text;
  document.title = "Güzəştlər · " + text;
}

function ring(pct) {
  return '<div class="ring-wrap" aria-hidden="true"><svg viewBox="0 0 36 36"><circle class="ring-bg" cx="18" cy="18" r="15.5"></circle><circle class="ring-fg" cx="18" cy="18" r="15.5" pathLength="100" stroke-dasharray="' + pct + ' 100"></circle></svg><span class="ring-label">' + pct + '%</span></div>';
}
function renderHome() {
  setTab("ana");
  setEyebrow("Əzbər dəftəri");
  const s = stats();
  const pct = s.live ? Math.round((s.know / s.live) * 100) : 0;
  const cards = ARTICLES.map((a) => {
    const m = META[a.code];
    const st = stats(a.code);
    const p = st.live ? Math.round((st.know / st.live) * 100) : 0;
    return '<article class="acard" style="--c:' + m.color + '"><button type="button" class="acard-main" data-act="open" data-mode="oxu" data-code="' + a.code + '"><div class="acard-top"><span class="acode">' + a.code + '</span><span class="acount">' + st.know + ' / ' + st.live + '</span></div><h2>' + m.name + '</h2><p>' + escapeHtml(a.title) + '</p><div class="bar"><span style="width:' + p + '%"></span></div></button><button type="button" class="acard-side" data-act="open" data-mode="kart" data-code="' + a.code + '">Kart</button></article>';
  }).join("");
  const tip = store.tip ? '<div class="tip"><p>Faylı telefona göndərib brauzerdə aç. İnternet lazım deyil. Başlığa toxun, mətn açılsın. Manat, faiz və il rənglə işarələnib.</p><button type="button" data-act="dismiss-tip" aria-label="Bağla">×</button></div>' : "";
  const startLabel = s.left ? "Qalan " + s.left + " bəndi kartla aç" : "Hamısını yenidən kartla aç";
  document.getElementById("view").innerHTML = tip +
    '<section class="hero">' + ring(pct) + '<div><p class="hero-kicker">Əzbər</p><p class="hero-num">' + s.know + '</p><p class="hero-sub">' + s.live + ' bənddən · ' + s.left + ' qalıb' + (s.hard ? " · " + s.hard + " çətin" : "") + (s.again ? " · " + s.again + " təkrar" : "") + '</p></div></section>' +
    '<button type="button" class="primary" data-act="start-all">' + startLabel + '</button>' +
    '<button type="button" class="ghost" data-act="nav" data-hash="#/ortaq">Ortaq cədvəl · ' + (DATA.overlaps || []).length + ' mövzu</button>' +
    '<button type="button" class="ghost" data-act="nav" data-hash="#/edv">ƏDV cədvəli · idxal / istehsal / satış</button>' +
    '<h2 class="section-title">Maddələr</h2><div class="home-grid">' + cards + '</div>' +
    '<p class="fine">Oxu rejimində bildiyini işarələ. Kartda əvvəl xatırla, sonra aç. Sınaqda bəndi və rəqəmi yoxla.</p>' +
    '<p class="fine"><button type="button" class="linkish" data-act="reset">İrəliləyişi sıfırla</button></p>';
}

function pills(active, act) {
  const all = '<button type="button" class="pill' + (active === "all" ? " is-on" : "") + '" data-act="' + act + '" data-code="all">Hamısı</button>';
  const rest = ARTICLES.map((a) => '<button type="button" class="pill' + (active === a.code ? " is-on" : "") + '" data-act="' + act + '" data-code="' + a.code + '">' + a.code + " " + META[a.code].short + "</button>").join("");
  return '<div class="pills">' + all + rest + "</div>";
}
function visibleItems() {
  let items = ui.article === "all" ? ITEMS.slice() : ARTICLE[ui.article].items.slice();
  const q = fold(ui.query.trim());
  if (q) items = items.filter((it) => fold(it.id + " " + (it.title || "") + " " + it.text + " " + it.notes.join(" ") + " " + META[it.article].name).includes(q));
  if (ui.filter === "out") return items.filter((it) => it.repealed);
  items = items.filter((it) => !it.repealed);
  if (ui.filter === "left") items = items.filter((it) => getStatus(it.id) !== "know");
  if (ui.filter === "star") items = items.filter((it) => store.stars[it.id]);
  return items;
}
function clauseHTML(node, flat, open) {
  const st = getStatus(node.id);
  const depth = Math.min(node.id.split(".").length - 2, 3);
  const bits = ['<article class="clause d' + depth + '" data-id="' + node.id + '" data-state="' + st + '">'];
  bits.push('<div class="clause-top"><button type="button" class="opener" data-act="toggle-clause"><span class="idline"><span class="idbtn" data-act="copy">' + node.id + "</span>");
  if (flat) bits.push('<span class="mini">' + META[node.article].short + "</span>");
  if (node.repealed) bits.push('<span class="tag">Çıxarılıb</span>');
  bits.push("</span>");
  if (node.title) bits.push('<span class="ttl">' + escapeHtml(node.title) + "</span>");
  bits.push('</button><button type="button" class="iconbtn' + (store.stars[node.id] ? " is-on" : "") + '" data-act="star" aria-label="Ulduz" aria-pressed="' + (!!store.stars[node.id]) + '">' + starSvg() + "</button></div>");
  bits.push('<div class="fold"' + (open ? "" : " hidden") + ">");
  bits.push('<div class="body">' + renderText(node.text) + "</div>");
  if (node.notes.length) {
    bits.push('<button type="button" class="textbtn" data-act="note">Qeyd</button><div class="notes" hidden>' + node.notes.map((n) => "<p>" + escapeHtml(n) + "</p>").join("") + "</div>");
  }
  if (!node.repealed) {
    bits.push('<div class="marks">' +
      markBtn("again", "Təkrar", st) +
      markBtn("hard", "Çətin", st) +
      markBtn("know", "Bilirəm", st) +
      "</div>");
  }
  bits.push("</div></article>");
  return bits.join("");
}
function markBtn(status, label, current) {
  return '<button type="button" class="mark' + (current === status ? " is-on" : "") + '" data-act="status" data-status="' + status + '">' + label + "</button>";
}
function treeOf(items) {
  const map = new Map(items.map((it) => [it.id, Object.assign({ kids: [] }, it)]));
  const roots = [];
  for (const node of map.values()) {
    if (node.parent && map.has(node.parent)) map.get(node.parent).kids.push(node);
    else roots.push(node);
  }
  return roots;
}
function treeHTML(nodes, flat, open) {
  return nodes.map((n) => {
    const kids = n.kids && n.kids.length ? '<div class="kids">' + treeHTML(n.kids, flat, open) + "</div>" : "";
    return '<div class="node">' + clauseHTML(n, flat, open) + kids + "</div>";
  }).join("");
}
function qeydHTML() {
  if (ui.query.trim() || ui.filter !== "all") return "";
  const codes = ui.article === "all" ? ARTICLES.map((a) => a.code) : [ui.article];
  return codes.map((code) => {
    const notes = ARTICLE[code].notes || [];
    if (!notes.length) return "";
    return '<aside class="qeyd"><h3>' + META[code].short + " · qeyd</h3>" + notes.map((n) => "<p>" + escapeHtml(n) + "</p>").join("") + "</aside>";
  }).join("");
}
function fillList(scroll) {
  const items = visibleItems();
  const searching = !!ui.query.trim();
  const flat = searching || ui.filter === "star" || ui.filter === "out";
  const list = document.getElementById("list");
  if (!list) return;
  const open = searching || ui.expandAll;
  let html = "";
  if (!items.length) html = '<div class="empty">Bu seçimdə bənd yoxdur.</div>';
  else if (!flat && ui.article === "all") {
    html = ARTICLES.map((a) => {
      const mine = items.filter((it) => it.article === a.code);
      if (!mine.length) return "";
      return '<h2 class="section-title">' + META[a.code].name + "</h2>" + treeHTML(treeOf(mine), false, open);
    }).join("") + qeydHTML();
  } else if (!flat) html = treeHTML(treeOf(items), false, open) + qeydHTML();
  else html = items.map((it) => clauseHTML(it, true, open)).join("");
  list.innerHTML = html;
  const rc = document.getElementById("resultCount");
  if (rc) rc.textContent = items.length + (ui.query.trim() ? " nəticə" : " bənd");
  const expandBtn = document.getElementById("expandBtn");
  if (expandBtn) expandBtn.textContent = ui.expandAll ? "Mətnləri yığ" : "Mətnləri aç";
  document.querySelectorAll('[data-act="article"]').forEach((b) => b.classList.toggle("is-on", b.dataset.code === ui.article));
  document.querySelectorAll('[data-act="filter"]').forEach((b) => b.classList.toggle("is-on", b.dataset.filter === ui.filter));
  const name = ui.article === "all" ? "bütün maddələr" : META[ui.article].name;
  setEyebrow("Oxu · " + name);
  if (scroll) window.scrollTo(0, 0);
  if (ui.pendingScroll) {
    const el = list.querySelector('[data-id="' + ui.pendingScroll + '"]');
    ui.pendingScroll = null;
    if (el) {
      const fold = el.querySelector(".fold");
      if (fold) fold.hidden = false;
      el.scrollIntoView({ block: "start" });
    }
  }
}
function renderRead() {
  setTab("oxu");
  ui.query = "";
  const filters = [
    ["all", "Hamısı"],
    ["left", "Qalan"],
    ["star", "Ulduz"],
    ["out", "Çıxarılmış"]
  ].map(([id, label]) => '<button type="button" class="filter' + (ui.filter === id ? " is-on" : "") + '" data-act="filter" data-filter="' + id + '">' + label + "</button>").join("");
  document.getElementById("view").innerHTML =
    '<div class="toolbar"><label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg><input id="q" type="search" placeholder="Bənd, söz və ya rəqəm" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search"></label>' +
    pills(ui.article, "article") +
    '<div class="filters">' + filters + "</div></div>" +
    '<div class="result-row"><span id="resultCount"></span><span><button type="button" class="textbtn" id="expandBtn" data-act="expand-all">Mətnləri aç</button><button type="button" class="textbtn" data-act="jump">Bənd xəritəsi</button></span></div>' +
    '<div id="list"></div>';
  fillList(false);
}
function paintClause(el) {
  const id = el.dataset.id;
  const st = getStatus(id);
  el.dataset.state = st;
  el.querySelectorAll('[data-act="status"]').forEach((b) => b.classList.toggle("is-on", b.dataset.status === st));
  const star = el.querySelector('[data-act="star"]');
  if (star) {
    star.classList.toggle("is-on", !!store.stars[id]);
    star.setAttribute("aria-pressed", !!store.stars[id]);
  }
}
function openSheet() {
  closeSheet();
  const groups = ui.article === "all" ? ARTICLES : [ARTICLE[ui.article]];
  const body = groups.map((a) => {
    const chips = a.items.map((it) => '<button type="button" class="id-chip' + (it.repealed ? " is-out" : "") + '" data-state="' + getStatus(it.id) + '" data-act="jump-to" data-id="' + it.id + '">' + it.id + "</button>").join("");
    return "<h3>" + META[a.code].short + "</h3><div class=\"id-grid\">" + chips + "</div>";
  }).join("");
  const root = document.createElement("div");
  root.id = "sheetRoot";
  root.innerHTML = '<div class="backdrop" data-act="close-sheet"></div><div class="sheet" role="dialog" aria-label="Bənd xəritəsi"><div class="handle"></div><h2>Bənd xəritəsi</h2><div class="sheet-scroll">' + body + "</div></div>";
  document.body.appendChild(root);
  document.body.classList.add("sheet-open");
}
function closeSheet() {
  document.getElementById("sheetRoot")?.remove();
  document.body.classList.remove("sheet-open");
}

function cardPool() {
  return ITEMS.filter((it) => {
    if (it.repealed) return false;
    if (ui.cardArticle !== "all" && it.article !== ui.cardArticle) return false;
    if (ui.onlyLeft && getStatus(it.id) === "know") return false;
    return true;
  });
}
function resetQueue() {
  ui.queue = cardPool();
  ui.pos = 0;
  ui.revealed = false;
}
function renderCard() {
  setTab("kart");
  closeSheet();
  if (ui.forceQueue || !ui.queue) {
    ui.forceQueue = false;
    resetQueue();
  }
  const name = ui.cardArticle === "all" ? "bütün maddələr" : META[ui.cardArticle].name;
  setEyebrow("Kart · " + name);
  const dir = '<div class="seg" style="margin-top:10px"><button type="button" data-act="dir" data-dir="num"' + (ui.cardDir === "num" ? ' class="is-on"' : "") + '>Nömrə → mətn</button><button type="button" data-act="dir" data-dir="text"' + (ui.cardDir === "text" ? ' class="is-on"' : "") + '>Mətn → nömrə</button></div>';
  const head = pills(ui.cardArticle, "card-article") + dir +
    '<div class="toolrow"><button type="button" class="ghost" data-act="only-left">' + (ui.onlyLeft ? "Qalanlar" : "Hamısı") + '</button><button type="button" class="ghost" data-act="shuffle">Qarışdır</button></div>';
  const q = ui.queue || [];
  if (!q.length) {
    document.getElementById("view").innerHTML = head + '<div class="empty"><p>Bu seçimdə qalan bənd yoxdur.</p><button type="button" class="primary" data-act="show-known">Bilirəmləri də aç</button></div>';
    return;
  }
  const it = q[Math.min(ui.pos, q.length - 1)];
  ui.pos = Math.min(ui.pos, q.length - 1);
  const m = META[it.article];
  let middle;
  const cue = it.title ? '<p class="study-title">' + escapeHtml(it.title) + "</p>" : "";
  if (ui.cardDir === "num") {
    middle = '<p class="study-kicker">' + m.name + '</p><h2 class="big-id">' + it.id + "</h2>" + cue +
      (ui.revealed ? '<div class="study-text">' + renderText(it.text) + "</div>" : '<p class="hint">Əvvəl qaydanı xatırla, sonra mətni aç.</p><button type="button" class="primary" data-act="reveal">Mətni göstər</button>');
  } else {
    middle = '<p class="study-kicker">' + m.name + "</p>" +
      '<div class="study-text">' + renderText(it.text) + "</div>" +
      (ui.revealed ? '<h2 class="big-id">' + it.id + "</h2>" + cue : '<p class="hint">Bu mətn hansı bənddir?</p><button type="button" class="primary" data-act="reveal">Nömrəni göstər</button>');
  }
  const rates = ui.revealed ? '<div class="marks">' + markBtn("again", "Təkrar", getStatus(it.id)) + markBtn("hard", "Çətin", getStatus(it.id)) + markBtn("know", "Bilirəm", getStatus(it.id)) + "</div>" : "";
  document.getElementById("view").innerHTML = head +
    '<article class="study" style="--c:' + m.color + '"><div class="study-bar"></div><div class="study-body">' + middle + rates +
    '<div class="card-nav"><button type="button" data-act="card-prev">Geri</button><span class="pos">' + (ui.pos + 1) + " / " + q.length + '</span><button type="button" data-act="card-next">Növbəti</button></div></div></article>';
  window.scrollTo(0, 0);
}
function rateCard(status) {
  const q = ui.queue;
  if (!q || !q.length) return;

function optionsFor(fact) {

  const pool = [];
  for (const it of ITEMS) {
    if (it.repealed) continue;
    for (const f of collectFacts(it.text)) {
      if (f.family === fact.family && !seen.has(f.full)) {
        seen.add(f.full);
        pool.push(f.full);
      }
    }
  }
  const opts = shuffle(pool).slice(0, 3);
  if (fact.family !== "tarix" && !/[-–]/.test(fact.value)) {
    const cleaned = fact.value.replace(/\s/g, "");
    let num = null;
    if (/^\d{1,3}(\.\d{3})+$/.test(cleaned)) num = Number(cleaned.replace(/\./g, ""));
    else if (/^\d+$/.test(cleaned)) num = Number(cleaned);
    if (num) {
      for (const n of [Math.round(num / 2), num * 2, num * 4, Math.max(1, num - 1), num + 50, num * 10]) {
        if (opts.length >= 3) break;
        if (!n || n === num) continue;
        const text = String(Math.round(n)) + " " + fact.unit;
        if (!seen.has(text)) {
          seen.add(text);

        }

function makeBend(len) {

  const questions = [];
  for (const it of pool) {
    const same = ITEMS.filter((x) => x.article === it.article && x.id !== it.id && !x.repealed);
    const prefer = shuffle(same.filter((x) => x.parent === it.parent));
    const rest = shuffle(same.filter((x) => x.parent !== it.parent));
    const ids = [];
    for (const x of prefer.concat(rest)) {
      if (!ids.includes(x.id)) ids.push(x.id);
      if (ids.length >= 3) break;
    }
    if (ids.length < 3) continue;
    questions.push({ itemId: it.id, options: shuffle([it.id].concat(ids)), answer: it.id, picked: null, hideStart: null });
    if (questions.length >= len) break;

function makeReqem(len) {
  const bag = [];
  for (const it of quizItems()) {
    if (it.repealed) continue;
    for (const f of collectFacts(it.text)) bag.push({ it, f });
  }
  const shuffled = shuffle(bag);
  const questions = [];
  const used = new Set();
  const seenQ = new Set();
  function take(row, unique) {
    const key = row.it.id + "@" + row.f.start;
    if (seenQ.has(key)) return;
    if (unique && used.has(row.it.id)) return;
    const options = optionsFor(row.f);
    if (!options) return;
    seenQ.add(key);
    used.add(row.it.id);
    questions.push({ itemId: row.it.id, options, answer: row.f.full, picked: null, hideStart: row.f.start });
  }
  for (const row of shuffled) {
    if (questions.length >= len) break;
    take(row, true);
  }

    for (const row of shuffled) {
      if (questions.length >= len) break;
      take(row, false);
    }
  }
  return questions;
}

function copyText(text) {
  const done = () => toast(text + " kopyalandı");
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallback());
  } else fallback();
  function fallback() {
    const t = document.createElement("textarea");
    t.value = text;
    document.body.appendChild(t);
    t.select();
    try { document.execCommand("copy"); done(); } catch (e) { toast(text); }
    t.remove();
  }
}

nin yerinə yetirilməsi ilə bağlı Azərbaycan Respublikasının Mərkəzi Bankı tərəfindən mal idxalı, iş görülməsi, xidmət göstərilməsi və Azərbaycan Respublikasının Mərkəzi Bankı üçün xidmətlərin göstərilməsi və işlərin görülməsi, o cümlədən xəzinə avadanlıqlarına texniki servis xidməti, pul nişanlarının istehsalı, daşınması, saxlanılması, sığortalanması, istehsal prosesinin auditinin keçirilməsi, ekspertizası, beynəlxalq qızıl-valyuta ehtiyatlarının saxlanılması və idarə edilməsi ilə əlaqədar xidmətlərin, informasiya sistemləri üzrə dəstəkləmə xidmətlərinin, habelə Azərbaycan Respublikası Mərkəzi Bankının məqsəd və funksiyalarının həyata keçirilməsi ilə əlaqədar məsləhət xidmətlərinin göstərilməsi;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Mərkəzi Bankın xidmət və idxalı"},{"id":"164.1.10","text":"Azərbaycan Respublikasının Dövlət Neft Fondunun qanunvericiliklə nəzərdə tutulmuş vəzifələrinin yerinə yetirilməsi ilə bağlı mal idxalı, iş görülməsi və xidmət göstərilməsi.","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Dövlət Neft Fondunun idxalı"},{"id":"164.1.10-1","text":"yaşayış sahələrini satmaq öhdəliyi ilə kirayəyə vermə sahəsində fəaliyyət göstərən müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən yaşayış sahələrinin kirayəçilərə təqdim edilməsi;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Satmaq öhdəliyi ilə kirayə mənzil"},{"id":"164.1.11","text":"Azərbaycan Respublikasına, o cümlədən onu təmsil edən hüquqi şəxslərə neft-qaz ehtiyatlarının kəşfiyyatı, işlənməsi və hasilatın pay bölgüsü, ixrac boru kəmərləri haqqında və bu qəbildən olan digər sazişlərə uyğun olaraq verilməsi nəzərdə tutulan əsas fondların, daşınan əmlakın və digər aktivlərin Azərbaycan Respublikası Dövlət Neft Fonduna və ya Azərbaycan Respublikasını təmsil edən tərəfə hər hansı şəkildə təqdim edilməsi, habelə idxalı üzrə əməliyyatlar.","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Neft-qaz / pay bölgüsü aktivləri"},{"id":"164.1.12","text":"Metropolitenlə sərnişindaşıma xidmətləri.","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Metropoliten sərnişindaşıma"},{"id":"164.1.13","text":"Ödənişli təhsil xidmətlərinin göstərilməsi (digər fəaliyyətləri ilə bağlı xidmətlərin göstərilməsi istisna olmaqla).","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Ödənişli təhsil xidmətləri"},{"id":"164.1.14","text":"Bu Məcəllənin 106.1.9-106.1.11-ci maddələri ilə müəyyən olunan aktivlərin dəyəri və onların hər hansı şəkildə təqdim olunması üzrə əməliyyatlar;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"106.1.9–11 aktivlərinin təqdimi"},{"id":"164.1.15","text":"müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) yaratdığı sənaye, yaxud texnologiyalar parklarının infrastrukturunun, istehsal sahələrinin yaradılması və tikintisi, habelə elmi-tədqiqat və təcrübə-konstruktor işlərinin görülməsi məqsədi ilə sənaye, yaxud texnologiyalar parklarının idarəedici təşkilatı və ya operatoru tərəfindən müvafiq icra hakimiyyəti orqanının təsdiqedici sənədi əsasında siyahısı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən təsdiq edilən texnikanın, texnoloji avadanlıqların və qurğuların idxalı;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Park operatorunun texnika idxalı"},{"id":"164.1.16","text":"müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) yaratdığı sənaye və texnologiyalar parkında istehsal sahələrinin tikintisi, elmi-tədqiqat və təcrübə-konstruktor işlərinin görülməsi və istehsal məqsədi ilə sənaye, yaxud texnologiyalar parklarının rezidenti olan hüquqi şəxslər və hüquqi şəxs yaratmadan sahibkarlıq fəaliyyətini həyata keçirən fiziki şəxslər tərəfindən müvafiq icra hakimiyyəti orqanının təsdiqedici sənədi əsasında idxal olunan siyahısı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən təsdiq edilən texnikanın, texnoloji avadanlıqların və qurğuların idxalı - rezidentin sənaye və texnologiyalar parkında qeydiyyata alındığı tarixdən 10 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Park rezidentinin texnika idxalı — 10 il"},{"id":"164.1.17","text":"hüquqi şəxsin iştirak paylarının və ya səhmlərinin təqdim edilməsi;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"İştirak payı / səhmin təqdimi"},{"id":"164.1.18","text":"kənd təsərrüfatı məhsullarının istehsalçıları (o cümlədən, sənaye üsulu ilə) tərəfindən özlərinin istehsal etdikləri kənd təsərrüfatı məhsullarının satışı üzrə dövriyyələr - 2014-cü il yanvarın 1-dən 13 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Kənd təsərrüfatı satışı — 13 il"},{"id":"164.1.19","text":"müdafiə təyinatlı məmulatların (döyüş təyinatlı hərbi texnika, hərbi silah və döyüş sursatlarının, partlayıcı maddə və qurğuların, onların dəstləşdirici hissələrinin) layihələndirilməsi, istehsalı, satışı, təmiri və onlara texniki xidmət göstərilməsi fəaliyyətini həyata keçirən şəxslər tərəfindən bu məqsədlə müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) təsdiqedici sənədi əsasında texnologiyaların, avadanlıqların, dəstləşdirici hissələrin, materialların və xammalın idxalı, habelə həmin şəxslər tərəfindən müdafiə təyinatlı məmulatların satışı, təmiri və onlara texniki xidmət göstərilməsi;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Müdafiə təyinatlı məmulatlar"},{"id":"164.1.19-1","text":"müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum), Azərbaycan Respublikasının Baş Prokurorluğu tərəfindən verilmiş təsdiqedici sənəd əsasında müdafiə və dövlət təhlükəsizliyi məqsədləri üçün istifadə olunan bütün növ texnika və texniki vasitələrin, onların ehtiyat hissələrinin, xüsusi proqram təminatlarının və silah-sursatın idxalı və satışı;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Müdafiə və təhlükəsizlik texnikası"},{"id":"164.1.20","text":"Azərbaycan Respublikasının ərazisində mövcud qaydada qeydiyyatdan keçmiş humanitar təşkilatlar, həmçinin müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) razılığı ilə digər hüquqi və fiziki şəxslər tərəfindən humanitar yardım kimi gətirilən mallar;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Humanitar yardım malları"},{"id":"164.1.21","text":"texniki yardım da daxil olmaqla, təmənnasız yardım və xeyriyyə məqsədi ilə dövlətlərin, hökumətlərin və beynəlxalq təşkilatların xətti ilə gətirilən mallar;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Təmənnasız / xeyriyyə malları"},{"id":"164.1.22","text":"müvafiq icra hakimiyyəti orqanı tərəfindən müəyyən edilmiş hallarda və qaydada fiziki şəxs tərəfindən gömrük sərhədindən keçirilən istehsal, yaxud kommersiya məqsədləri üçün nəzərdə tutulmayan mallar;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Fiziki şəxsin qeyri-kommersiya malları"},{"id":"164.1.23","text":"ixrac məqsədli neft-qaz fəaliyyəti ilə əlaqədar gətirilən avadanlıq və materiallar (müvafiq icra hakimiyyəti orqanı tərəfindən ixrac məqsədli neft-qaz fəaliyyəti üzrə Azərbaycan Respublikasına idxal olunan avadanlıq və materialların təsdiq olunmuş siyahısı gömrük orqanlarına təqdim edildiyi təqdirdə);","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"İxrac məqsədli neft-qaz avadanlığı"},{"id":"164.1.24","text":"xüsusi iqtisadi zonaya idxal edilən mallar (aksizli mallar istisna olmaqla);","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Xüsusi iqtisadi zona idxalı"},{"id":"164.1.25","text":"siyahısı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən təsdiq edilən lizinq müqaviləsinin obyekti olan əsas vəsaitlərin idxalı;","notes":["(164.1.25-ci maddəyə Azərbaycan Respublikasının 2026-cı il 26 may tarixli 413-VIIQD nömrəli Qanunu ilə edilmiş dəyişiklik 2026-cı il dekabr 25-dən qüvvəyə minir.)"],"parent":"164.1","article":"164","repealed":false,"title":"Lizinq obyekti olan əsas vəsait"},{"id":"164.1.26","text":"investisiya təşviqi sənədini almış hüquqi şəxslər və fərdi sahibkarlar tərəfindən müvafiq icra hakimiyyəti orqanının təsdiqedici sənədi əsasında texnikanın, texnoloji avadanlıqların və qurğuların idxalı – investisiya təşviqi sənədinin alındığı tarixdən 7 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"İnvestisiya təşviqi idxalı — 7 il"},{"id":"164.1.27","text":"buğdanın idxalı və satışı, buğda ununun və çörəyin istehsalı və satışı - 2017-ci il yanvarın 1-dən 10 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Buğda, un, çörək — 10 il"},{"id":"164.1.28","text":"gəmiqayırma və gəmi təmiri müəssisələri tərəfindən müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) təsdiqedici sənədi əsasında həmin fəaliyyətin məqsədləri üçün bütün növ malların idxalı – 2026-cı il mayın 1-dən 3 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Gəmiqayırma / təmir idxalı — 3 il"},{"id":"164.1.29","text":"damazlıq heyvanların idxalı və satışı;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Damazlıq heyvanlar"},{"id":"164.1.30","text":"toxum və tinglərin idxalı və satışı;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Toxum və tinglər"},{"id":"164.1.31","text":"siyahısı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən təsdiq edilən gübrələrin, pestisidlərin idxalı və satışı;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Gübrə və pestisidlər"},{"id":"164.1.32","text":"siyahısı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən təsdiq edilən toxumların yetişdirilməsi, quşçuluq və arıçılıq üçün avadanlıqların, o cümlədən bu sahələrdə istifadəsi nəzərdə tutulmuş laboratoriya avadanlıqlarının, toxum, taxıl və quru paxlalı bitkilərin təmizlənməsi, çeşidlənməsi və ya kalibrlənməsi üçün maşınların idxalı və satışı;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Toxum / quşçuluq / arıçılıq avadanlığı"},{"id":"164.1.33","text":"siyahısı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən təsdiq edilən kənd təsərrüfatı heyvanlarının və quşların profilaktikası, diaqnostikası və müalicəsi üçün istifadə olunan baytarlıq preparatlarının idxalı;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Baytarlıq preparatları"},{"id":"164.1.34","text":"siyahısı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən təsdiq olunmuş bilavasitə kənd təsərrüfatı təyinatlı suvarma və digər qurğuların, maşınların, avadanlıqların və texnikaların, habelə kənd təsərrüfatı texnikasının ehtiyat hissələrinin istehsalı, idxalı və satışı;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Kənd təsərrüfatı texnikası"},{"id":"164.1.34-1","text":"kənd təsərrüfatı texnikalarının mülkiyyət hüququnun keçməməsişərtilə kənd təsərrüfatı istehsalçılarına lizinqə (icarəyə) verilməsi;","notes":["(164.1.34-1-ci maddəyə Azərbaycan Respublikasının 2026-cı il 26 may tarixli 413-VIIQD nömrəli Qanunu ilə edilmiş dəyişiklik 2026-cı il dekabr 25-dən qüvvəyə minir.)"],"parent":"164.1","article":"164","repealed":false,"title":"KT texnikasının lizinqi"},{"id":"164.1.34-2","text":"kənd təsərrüfatı məhsullarının istehsalçılarına aqrotexniki xidmətlərin göstərilməsi;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Aqrotexniki xidmətlər"},{"id":"164.1.35","text":"siyahısı müvafiq icra hakimiyyəti orqanı tərəfindən müəyyən olunan xammalın və materialların idxalı;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Müəyyən xammal və material idxalı"},{"id":"164.1.36","text":"ödəmə qabiliyyətini itirmiş bankların rezolyusiyası və sağlamlaşdırma tədbirləri çərçivəsində müvafiq icra hakimiyyəti orqanının müəyyən etdiyi qaydada qeyri-işlək (toksik) aktivlərin təqdim edilməsi, habelə bankın iflas proseduru çərçivəsində aktivlərinin təqdim edilməsi – 2017-ci il yanvarın 1-dən 14 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Bank rezolyusiyası aktivləri — 14 il"},{"id":"164.1.37","text":"heyvan və quş ətinin satışı – 2020-ci il yanvarın 1-dən 7 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Heyvan və quş ətinin satışı — 7 il"},{"id":"164.1.38","text":"mülki aviasiya məqsədləri üçün idxal edilən hava gəmiləri, onların ehtiyat hissələri, mühərrikləri və güc qurğuları;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Mülki aviasiya hava gəmiləri"},{"id":"164.1.40","text":"KOB klaster şirkəti tərəfindən mikro, kiçik və orta sahibkarlığın inkişafını dəstəkləyən müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) təsdiqedici sənədi əsasında istehsal, yaxud emal məqsədləri üçün texnikanın, texnoloji avadanlıqların və qurğuların idxalı – KOB klaster şirkətinin KOB klaster şirkətlərinin reyestrinə daxil edildiyi tarixdən 7 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"KOB klaster texnika idxalı — 7 il"},{"id":"164.1.41","text":"müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən verilmiş təsdiqedici sənədə əsasən sənaye parklarının rezidentləri tərəfindən sənaye istehsalı (yığımı) məqsədilə oturacaqsız, tutacaqsız və monitoru quraşdırılmamış yalnız elektrik mühərriki ilə işləyən avtobusların idxalı və sənaye parklarının rezidentləri tərəfindən idxal edilmiş həmin avtobusların oturacağı, tutacağı və monitoru quraşdırılmaqla satışı – 2026-cı il yanvarın 1-dən 1 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Elektrik avtobus idxalı — 1 il"},{"id":"164.1.41-1","text":"istehsal tarixi 3 ildən və mühərrikinin həcmi 2500 kubsantimetrdən çox olmayan hibrid avtomobillərin idxalı və satışı - 2022-ci il yanvarın 1-dən 4 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Hibrid avtomobil — 4 il"},{"id":"164.1.41-2","text":"elektrik mühərriki ilə işləyən avtomobillər üçün ikinci və üçüncü səviyyə elektrik enerji doldurucularının idxalı və satışı - 2022-ci il yanvarın 1-dən 5 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Elektrik doldurucu — 5 il"},{"id":"164.1.41-3","text":"Azərbaycan Respublikasının ərazisində istehsal olunan minik avtomobillərinin satışı – 2023-cü il mayın 1-dən 10 il müddətinə;","notes":["(164.1.41-3-cü maddəyə Azərbaycan Respublikasının 2025-ci il 9 dekabr tarixli 297-VIIQD nömrəli Qanunu ilə edilmiş dəyişiklik 2027-ci il 1 yanvar tarixində qüvvəyə minir.)"],"parent":"164.1","article":"164","repealed":false,"title":"Yerli minik avtomobili — 10 il"},{"id":"164.1.41-4","text":"Azərbaycan Respublikasının ərazisində istehsal olunan avtobusların və yük avtomobillərinin satışı, habelə müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) təsdiqedici sənədi əsasında hüquqi şəxslər tərəfindən istehsal məqsədilə avtobusların və yük avtomobillərinin ehtiyat hissələrinin idxalı – avtobuslara münasibətdə 2025-ci il yanvarın 1-dən 8 il müddətinə, yük avtomobillərinə münasibətdə 2026-cı il yanvarın 1-dən 7 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Yerli avtobus və yük avtomobili"},{"id":"164.1.41-5","text":"müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) təsdiqedici sənədi əsasında şəxs tərəfindən təqvim ili ərzində 1 ədəddən (ölkə üzrə ümumilikdə 10 ədəddən) artıq olmamaqla raritet avtonəqliyyat vasitələrinin idxalı;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Raritet avtomobil (ildə 1 ədəd)"},{"id":"164.1.42","text":"“Məşğulluq haqqında” Azərbaycan Respublikasının Qanununa uyğun olaraq müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən haqqı ödənilən ictimai işlərin təşkili ilə əlaqədar işçi qüvvəsinin təqdim edilməsi üzrə əməliyyatlar;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"İctimai işlərə işçi qüvvəsi"},{"id":"164.1.43","text":"kəpəyin istehsalı və satışı – 2019-cu il martın 1-dən 8 il müddətinə.","notes":["(2019-cu il martın 1-dən 2021-ci il avqustun 1-dək qüvvədədir.)"],"parent":"164.1","article":"164","repealed":false,"title":"Kəpək istehsalı və satışı — 8 il"},{"id":"164.1.46","text":"siyahısı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən təsdiq edilən yem məhsullarının və yem əlavələrinin satışı üzrə dövriyyələr – 2020-ci il yanvarın 1-dən 7 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Yem və yem əlavələri — 7 il"},{"id":"164.1.47","text":"bina tikintisi fəaliyyəti ilə məşğul olan şəxslər tərəfindən tikilən binanın yaşayış və qeyri-yaşayış sahələrinin dövlətə ayrılan hissəsinin təqdim edilməsi üzrə dövriyyələr;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Binanın dövlətə ayrılan hissəsi"},{"id":"164.1.48","text":"siyahısı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən təsdiq edilən dövlət adından yaradılan publik hüquqi şəxslər tərəfindən nizamnamələrində nəzərdə tutulan və onlara həvalə edilən vəzifələrin yerinə yetirilməsi üçün dövlət büdcəsindən ayrılmış vəsait hesabına müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) ilə bağlanılmış müqavilə əsasında işlərin və xidmətlərin göstərilməsi – 2020-ci il yanvarın 1-dən 7 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Publik hüquqi şəxsin büdcə işləri — 7 il"},{"id":"164.1.49","text":"Azərbaycan Respublikasında keçirilən Formula 1 və Formula 2 yarışları ilə bağlı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) ilə bağlanılmış müqavilə əsasında mal, iş və xidmətin təqdim edilməsi – 2018-ci il yanvarın 1-dən 9 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Formula 1 / 2 — 9 il"},{"id":"164.1.50","text":"Azərbaycan Respublikasında daimi nümayəndəlik yaratmayan qeyri-rezident şəxslərin mülki aviasiya fəaliyyəti çərçivəsində hava gəmilərinin və hava gəmilərinin mühərriklərinin rezident hüquqi şəxslərə icarəyə və ya lizinqə verilməsi;","notes":["(164.1.50-ci maddəyə Azərbaycan Respublikasının 2026-cı il 26 may tarixli 413-VIIQD nömrəli Qanunu ilə edilmiş dəyişiklik 2026-cı il dekabr 25-dən qüvvəyə minir.)"],"parent":"164.1","article":"164","repealed":false,"title":"Qeyri-rezident hava gəmisi icarəsi"},{"id":"164.1.51","text":"“Tibbi sığorta haqqında” Azərbaycan Respublikasının Qanununa uyğun olaraq icbari tibbi sığorta fondunun, habelə siyahısı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən təsdiq edilən ictimai və sosial məqsədlər üçün yaradılmış fondların vəsaiti hesabına tibbi xidmətlərin göstərilməsi – 2024-cü il yanvarın 1-dən 3 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"İcbari tibbi sığorta xidmətləri — 3 il"},{"id":"164.1.51-1","text":"tədris bazası kimi fəaliyyət göstərən tibb müəssisələrində tibbi xidmətlərin göstərilməsi -2024-cü il yanvarın 1-dən 3 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Tədris tibb müəssisəsi — 3 il"},{"id":"164.1.52","text":"müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) təsdiqedici sənədi əsasında iri neft emalı zavodlarının (xam neft üzrə illik emal gücü 3 milyon tondan az olmayan) yenidən qurulması layihələri çərçivəsində avadanlıqların və materialların idxalı – 2021-ci il yanvarın 1-dən 8 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"İri neft emalı zavodu — 8 il"},{"id":"164.1.54","text":"qızıldan və gümüşdən hazırlanan zərgərlik məmulatlarının istehsalı və emalı işlərinin görülməsi məqsədilə müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) təsdiqedici sənədi əsasında dəzgahların, avadanlıqların və qurğuların idxalı – 2021-ci il yanvarın 1-dən 6 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Zərgərlik dəzgahı idxalı — 6 il"},{"id":"164.1.55","text":"külçə, sikkə və ya qranul şəklində qızılın və gümüşün satışı;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Külçə / sikkə qızıl və gümüş"},{"id":"164.1.56","text":"müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) təsdiqedici sənədi əsasında Azərbaycan Respublikasının işğaldan azad edilmiş ərazilərinin, habelə müharibə və hərbi əməliyyatların təsirinə məruz qalmış digər təhlükəli ərazilərin minalardan və digər partlayıcı sursatlardan təmizlənməsi çərçivəsində bütün növ texnikanın, avadanlıqların, texniki vasitələrin və qurğuların, onların ehtiyat hissələrinin, fərdi zirehli qoruyucu geyimlərin, alətlərin, partlayıcı və pirotexniki vasitələrin , onların yaradılması və (və ya) istehsalı üçün texnologiyaların, avadanlıqların, dəstləşdirici hissələrin və xammalın, habelə minaaxtaran itlərin idxalı – 2023-cü il martın 1-dən 5 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Minatəmizləmə idxalı — 5 il"},{"id":"164.1.56-1","text":"müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) təsdiqedici sənədi əsasında Azərbaycan Respublikasının işğaldan azad edilmiş ərazilərinin, habelə müharibə və hərbi əməliyyatların təsirinə məruz qalmış digər təhlükəli ərazilərin minalardan və digər partlayıcı sursatlardan təmizlənməsi çərçivəsində bütün növ texnikanın, avadanlıqların, texniki vasitələrin və qurğuların, onların ehtiyat hissələrinin, fərdi zirehli qoruyucu geyimlərin, alətlərin, partlayıcı və pirotexniki vasitələrin istehsalı və satışı – 2023-cü il martın 1-dən 5 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Minatəmizləmə istehsalı — 5 il"},{"id":"164.1.57","text":"lotereya biletlərinin satıcısı ilə bağlanmış müqavilə əsasında və ya onun tapşırığı əsasında lotereya biletlərinin bütün mərhələlərdə agent qaydasında satışının həyata keçirilməsi üzrə xidmətlərin göstərilməsi;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Lotereya bileti agent satışı"},{"id":"164.1.58","text":"özəl baytarlıq xidmətlərinin göstərilməsi;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Özəl baytarlıq xidmətləri"},{"id":"164.1.59","text":"vəkillər və vəkil qurumları tərəfindən order markasının əldə edilməsi ilə bağlı Azərbaycan Respublikasının Vəkillər Kollegiyasına edilən ödənişlər; (vəkillər və vəkil qurumları tərəfindən order markasının əldə edilməsi ilə bağlı “Vəkillər və vəkillik fəaliyyəti haqqında” Azərbaycan Respublikasının Qanununa ediləcək dəyişikliklərlə eyni gündə qüvvəyə minir)","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Vəkil order markası"},{"id":"164.1.60","text":"siyahısı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən təsdiq edilmiş əsas vəsaitlərin idxalı;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Müəyyən əsas vəsait idxalı"},{"id":"164.1.61","text":"müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) təsdiqedici sənədi əsasında müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) yenidən qurulması layihəsi çərçivəsində avadanlıqların və ehtiyat hissələrinin idxalı – 2023-cü il yanvarın 1-dən 3 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Qurumun yenidən qurulması — 3 il"},{"id":"164.1.62","text":"müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) verdiyi təsdiqedici sənəd əsasında svop əməliyyatları çərçivəsində xam neftin və təbii qazın idxalı -2024-cü il yanvarın 1-dən 3 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Svop — xam neft və qaz — 3 il"},{"id":"164.1.63","text":"aşağıda göstərilən hallarda və müddətlərdə müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) təsdiqedici sənədi əsasında malların idxalı:","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"DÖT / enerji layihəsi idxalı — 30 il"},{"id":"164.1.63.1","text":"dövlət-özəl tərəfdaşlığı layihələri çərçivəsində özəl tərəfdaş və ya layihə şirkəti olan şəxslər tərəfindən texnikanın, texnoloji avadanlıqların və qurğuların idxalı – “Dövlət-özəl tərəfdaşlığı haqqında” Azərbaycan Respublikasının Qanununa uyğun olaraq bağlanılmış dövlət-özəl tərəfdaşlığı müqaviləsində müəyyən olunan müddətdə, lakin 30 ildən (tikinti dövrü də daxil olmaqla) çox olmayaraq;","notes":[],"parent":"164.1.63","article":"164","repealed":false,"title":"DÖT özəl tərəfdaşın idxalı"},{"id":"164.1.63.2","text":"dövlətin satınalma öhdəliyi ilə bərpa olunan enerji mənbələrindən istifadə edilməklə, müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) müəyyən etdiyi məbləğdən aşağı olmayan elektrik enerjisi istehsalı layihələri üzrə istehsalçı olan şəxslər tərəfindən texnikanın, texnoloji avadanlıqların və qurğuların idxalı – “Elektrik enerjisi istehsalında bərpa olunan enerji mənbələrindən istifadə haqqında” Azərbaycan Respublikasının Qanununa uyğun olaraq bağlanılmış elektrik enerjisinin satınalma müqaviləsi ilə müəyyən olunan müddətdə, lakin 30 ildən (tikinti dövrü də daxil olmaqla) çox olmayaraq;","notes":[],"parent":"164.1.63","article":"164","repealed":false,"title":"Bərpa olunan enerji idxalı"},{"id":"164.1.63.3","text":"dövlət-özəl tərəfdaşlığı müqaviləsində vergi güzəştlərindən istifadə etmək hüququ nəzərdə tutulan və belə müqavilə üzrə özəl tərəfdaşın və ya layihə şirkətinin tikinti işlərinə cəlb etdiyi podratçısı tərəfindən texnikanın, texnoloji avadanlıqların və qurğuların idxalı (idxal edilən mallar həmin layihənin dəyərinə aid edildiyi təqdirdə) - dövlət-özəl tərəfdaşlığı müqaviləsində tikinti işlərinin həyata keçirilməsi üçün nəzərdə tutulan müddətdə;","notes":[],"parent":"164.1.63","article":"164","repealed":false,"title":"DÖT podratçısının idxalı"},{"id":"164.1.64","text":"müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) təsdiqedici sənədi əsasında xarici iqtisadi fəaliyyətin mal nomenklaturasının kodları üzrə siyahısı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən müəyyən olunan incəsənət əsərlərinin, kolleksiya əşyalarının və əntiq əşyaların idxalı.","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"İncəsənət, kolleksiya, əntiq əşya"}]},{"code":"199","title":"Əmlak vergisindən azadolmalar və güzəştlər","notes":[],"items":[{"id":"199.1","text":"Dövlət hakimiyyəti orqanları, büdcə təşkilatları və yerli özünü idarəetmə orqanları, Azərbaycan Respublikasının Mərkəzi Bankı və onun qurumları, dövlətin adından yaradılan publik hüquqi şəxslər (sahibkarlıq fəaliyyəti məqsədləri üçün istifadə olunan əmlaka görə ödənilməli əmlak vergisi istisna olmaqla), dövlət fondları və əlilliyi olan şəxslərin qeyri-hökumət təşkilatları əmlak vergisini ödəməkdən azaddır.","notes":[],"parent":null,"article":"199","repealed":false,"title":"Dövlət orqanları, MB, əlillik QHT"},{"id":"199.2","text":"Misgərlik, qalayçılıq, dulusçuluq və saxsı məmulatlarının, təsərrüfat müxəlləfatının, bağçılıq-bostançılıq alətlərinin, xalq musiqi alətlərinin, oyuncaqların, suvenirlərin, qamışdan və qarğıdan məişət əşyalarının düzəldilməsi, keramika məmulatlarının bədii işlənməsi, bədii tikmə, ağac materiallardan məişət alətlərinin hazırlanması sahəsində hüquqi şəxs yaratmadan sahibkarlıq fəaliyyəti ilə məşğul olan fiziki şəxslərin sənətkarlıq emalatxanalarının binaları və ya binaların bu emalatxanalar yerləşən hissələri əmlak vergisinə cəlb edilmir.","notes":[],"parent":null,"article":"199","repealed":false,"title":"Sənətkarlıq emalatxanası"},{"id":"199.3","text":"Binaların icarəyə, kirayəyə verildiyi, habelə sahibkarlıq və ya kommersiya fəaliyyəti ilə məşğul olmaq üçün istifadə edildiyi hallar istisna olmaqla, bu Məcəllənin 102.1-1-ci və 102.2-ci maddələrində göstərilən şəxslərin, habelə pensiyaçıların və müddətli hərbi xidmət hərbi qulluqçularının və onların ailə üzvlərinin müddətli hərbi xidmət dövründə binalara görə ödəməli olduqları əmlak vergisininin məbləği 30 manat azaldılır.","notes":[],"parent":null,"article":"199","repealed":false,"title":"102.1-1 / 102.2 / pensiyaçı — 30 manat"},{"id":"199.4","text":"Vergitutma məqsədləri üçün müəssisənin və fərdi sahibkarın əmlakının dəyəri aşağıdakı əmlakların dəyərində (bu Məcəllənin 199.4.4-cü maddəsində nəzərdə tutulmuş əsas vəsaitlərə münasibətdə onların dəyərinin 75 faizi həddində) azaldılır:","notes":[],"parent":null,"article":"199","repealed":false,"title":"Əmlak dəyərinin azaldılması"},{"id":"199.4.1","text":"ekologiya və yanğından mühafizə üçün istifadə edilən əsas vəsaitlər;","notes":[],"parent":"199.4","article":"199","repealed":false,"title":"Ekologiya və yanğından mühafizə"},{"id":"199.4.1-1","text":"müəssisələrin mülkiyyətində (balansında) olan və siyahısı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən təsdiq edilən mülki müdafiə təyinatlı əmlaklar;","notes":[],"parent":"199.4","article":"199","repealed":false,"title":"Mülki müdafiə əmlakı"},{"id":"199.4.2","text":"məhsul ötürən kəmərlər, dəmir və avtomobil yolları, rabitə və enerji ötürücü xətləri, meliorasiya və suvarma sistemi obyektləri, peyklər və digər kosmik obyektlər;","notes":[],"parent":"199.4","article":"199","repealed":false,"title":"Kəmər, yol, xətt, peyk"},{"id":"199.4.3","text":"fiziki şəxslərə məxsus sahibkarlıq fəaliyyətində istifadə olunmayan minik avtomobilləri;","notes":[],"parent":"199.4","article":"199","repealed":false,"title":"Sahibkarlıqda istifadə olunmayan minik"},{"id":"199.4.4","text":"təhsil, tibb, mədəniyyət və idman sahəsində fəaliyyət göstərən vergi ödəyicilərinin yalnız bu sahələrin təyinatı üzrə istifadə etdiyi əsas vəsaitlər;","notes":[],"parent":"199.4","article":"199","repealed":false,"title":"Təhsil, tibb, mədəniyyət, idman"},{"id":"199.4.5","text":"Çıxarılmışdır.","notes":[],"parent":"199.4","article":"199","repealed":true,"title":""},{"id":"199.5","text":"Şəhərlərdə sərnişin daşımaları üçün istifadə olunan trolleybuslar və tramvaylar əmlak vergisindən azaddır.","notes":[],"parent":null,"article":"199","repealed":false,"title":"Trolleybus və tramvay"},{"id":"199.6","text":"Çıxarılmışdır.","notes":[],"parent":null,"article":"199","repealed":true,"title":""},{"id":"199.7","text":"Müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) yaratdığı sənaye, yaxud texnologiyalar parklarının rezidenti olan hüquqi şəxslər və hüquqi şəxs yaratmadan sahibkarlıq fəaliyyətini həyata keçirən fiziki şəxslər qanunvericiliyə uyğun olaraq, sənaye və texnologiyalar parkında qeydiyyata alındıqları hesabat ilindən başlayaraq, 10 il müddətinə sənaye və texnologiyalar parkındakı əmlaklarına görə əmlak vergisini ödəməkdən azaddırlar. Bu maddədə nəzərdə tutulan güzəşt texnologiyalar parkının rezidenti kimi texnologiyalar parkından kənar sistem inteqrasiyası, proqram təminatının hazırlanması və inkişaf etdirilməsi fəaliyyətini həyata keçirən şəxslərə də tətbiq edilir.","notes":[],"parent":null,"article":"199","repealed":false,"title":"Sənaye / texnopark rezidenti — 10 il"},{"id":"199.7-1","text":"Müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) yaratdığı sənaye parkında müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) müəyyən etdiyi fəaliyyətlə məşğul olan sənaye parkının rezidenti həmin fəaliyyət prosesində istifadə etdiyi sənaye parkındakı əmlakına görə 2025-ci il yanvarın 1-dən 6 il müddətinə əmlak vergisini ödəməkdən azaddır.","notes":[],"parent":null,"article":"199","repealed":false,"title":"Sənaye parkı xüsusi fəaliyyət — 6 il"},{"id":"199.8","text":"Müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) yaratdığı sənaye, yaxud texnologiyalar parklarının və sənaye məhəllələrinin idarəedici təşkilatı və ya operatoru sənaye, yaxud texnologiyalar parklarının və sənaye məhəllələrinin ərazisində yerləşən əmlaklarına görə əmlak vergisini ödəməkdən azaddır.","notes":[],"parent":null,"article":"199","repealed":false,"title":"Park operatorunun əmlakı"},{"id":"199.9","text":"Kənd təsərrüfatı məhsullarının istehsalı ilə məşğul olan (o cümlədən, sənaye üsulu ilə) hüquqi və fiziki şəxslər həmin fəaliyyət prosesində istifadə olunan əmlaka görə 2014-cü il yanvarın 1-dən 13 il müddətinə əmlak vergisini ödəməkdən azaddırlar.","notes":[],"parent":null,"article":"199","repealed":false,"title":"Kənd təsərrüfatı əmlakı — 13 il"},{"id":"199.11","text":"İnvestisiya təşviqi sənədini almış hüquqi şəxs və fərdi sahibkar həmin sənədi aldığı tarixdən müvafiq investisiya layihəsi çərçivəsində investisiya vəsaiti hesabına əldə edilmiş (alınmış, gətirilmiş, istehsal edilmiş, tikilmiş və ya quraşdırılmış) əmlakına görə 7 il müddətinə əmlak vergisini ödəməkdən azaddır. Bu maddə ilə müəyyən edilmiş azadolma investisiya təşviqi sənədi alınan tarixədək əldə edilmiş və hüquqi şəxs və ya fərdi sahibkar tərəfindən sahibkarlıq fəaliyyətində istifadə edilmiş əmlaklara tətbiq edilmir. Bu maddə ilə müəyyən edilən azadolma investisiya layihəsi çərçivəsində sahibkarlıq fəaliyyətinə cəlb edilən və əvvəllər vergi ödəyicisinin sahibkarlıq fəaliyyətində istifadə edilməyən binalara da şamil edilir.","notes":[],"parent":null,"article":"199","repealed":false,"title":"İnvestisiya təşviqi əmlakı — 7 il"},{"id":"199.12","text":"2019-cu il yanvarın 1-dən 2022-ci il yanvarın 1-dək özəlləşdirilməsi başa çatmış dövlət əmlakına görə ödənilmiş əmlak vergisi aşağıdakı şərtlər daxilində vergi ödəyicisinin ərizəsi əsasında qaytarılır və ya onun razılığı ilə sonrakı vergi öhdəliklərinin yerinə yetirilməsinə aid edilir:","notes":[],"parent":null,"article":"199","repealed":false,"title":"Özəlləşdirilmiş əmlak vergisinin qaytarılması"},{"id":"199.12.1","text":"hesabat ilində digər vergilər üzrə hesablanmış və ödənilmiş verginin məbləği özəlləşdirilməsi başa çatmış əmlaka görə həmin hesabat ili üçün dövlət büdcəsinə hesablanmış və ödənilmiş verginin məbləğindən az olmasın;","notes":[],"parent":"199.12","article":"199","repealed":false,"title":"Digər vergilər az olmasın"},{"id":"199.12.2","text":"ödənilmiş əmlak vergisinin qaytarılmasına dair ərizə ilə müraciət edildiyi tarixə vergi ödəyicisinin dövlət büdcəsinə vergilər, faizlər və maliyyə sanksiyaları üzrə borcu olmasın.","notes":[],"parent":"199.12","article":"199","repealed":false,"title":"Büdcəyə borc olmasın"},{"id":"199.13","text":"Bu Məcəllənin 199.12-ci maddəsi ilə müəyyən olunmuş güzəşt hüququ eyni əmlaka görə yalnız bir hesabat ili üzrə tətbiq edilir.","notes":[],"parent":null,"article":"199","repealed":false,"title":"Qaytarma yalnız 1 il üçün"},{"id":"199.14","text":"Mikro sahibkarlıq subyekti olan şəxslər əmlak vergisini ödəməkdən azaddırlar (mülkiyyətində olan əsas vəsaitlərin ilin əvvəlinə qalıq dəyəri 1.000.000 manatdan artıq olan şəxslər istisna olmaqla).","notes":[],"parent":null,"article":"199","repealed":false,"title":"Mikro sahibkar — əmlak azad"},{"id":"199.15","text":"KOB klaster şirkətləri KOB klaster şirkətlərinin reyestrinə daxil edildiyi tarixdən KOB klaster fəaliyyətində istifadə olunan əmlaklara görə 7 il müddətinə əmlak vergisini ödəməkdən azaddırlar.","notes":[],"parent":null,"article":"199","repealed":false,"title":"KOB klaster əmlakı — 7 il"},{"id":"199.16","text":"Müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) ödəmə qabiliyyətini itirmiş bankların rezolyusiyası və sağlamlaşdırma tədbirləri çərçivəsində müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanının (qurumun) qərarına əsasən aldığı problemli aktivlərin (borcların) əvəzində əldə etdiyi, onun mülkiyyətində (balansında) olan və siyahısını müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) ilə razılaşdırdığı əmlaka görə 2019-cu il yanvarın 1-dən 12 il müddətinə əmlak vergisini ödəməkdən azaddır.","notes":[],"parent":null,"article":"199","repealed":false,"title":"Bank rezolyusiyası əmlakı — 12 il"},{"id":"199.17","text":"Siyahısı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən təsdiq edilmiş idxal mallarını yerli istehsal (emal) malları ilə əvəz edəcək qida məhsullarının istehsalı ilə məşğul olan hüquqi və fiziki şəxslər həmin fəaliyyət prosesində istifadə olunan əmlaka görə müvafiq siyahının təsdiq edildiyi ildən etibarən 7 il müddətinə əmlak vergisini ödəməkdən azaddırlar.","notes":[],"parent":null,"article":"199","repealed":false,"title":"Qida idxalını əvəzetmə — 7 il"},{"id":"199.18","text":"Kredit təşkilatları məhkəmənin qanuni qüvvəyə minmiş qərarına əsasən müflis elan olunduğu halda kredit təşkilatının müflis elan olunması ilə bağlı məhkəmə qərarının qüvvəyə mindiyi aydan etibarən əmlak vergisini ödəməkdən azaddırlar.","notes":[],"parent":null,"article":"199","repealed":false,"title":"Müflis kredit təşkilatı"},{"id":"199.19","text":"Azərbaycan Respublikasında dövlət əmlakının özəlləşdirilməsinin dövlət proqramlarına uyğun olaraq 2023-cü il 1 yanvar tarixindən sonra özəlləşdirilməsi barədə qərar qəbul edilən dövlətə məxsus hüquqi şəxslər özəlləşdirilməsi barədə qərarın qəbul edildiyi ildən etibarən özəlləşdirilmə prosesi müddətində, lakin 3 ildən çox olmayaraq, əmlak vergisini ödəməkdən azaddırlar.","notes":[],"parent":null,"article":"199","repealed":false,"title":"Özəlləşdirmə prosesi — 3 il"},{"id":"199.20","text":"Kredit təşkilatları verilmiş kredit müqabilində onların mülkiyyətinə keçən əmlaklara görə həmin əmlakların balansa götürüldüyü təqvim ilindən başlayaraq 2 il müddətinə əmlak vergisini ödəməkdən azaddırlar.","notes":[],"parent":null,"article":"199","repealed":false,"title":"Kredit müqabilində əmlak — 2 il"},{"id":"199.21","text":"Bu Məcəllənin 199.11-ci, 199.14-cü və 199.15-ci maddələri nəzərə alınmaqla, Bakı, Sumqayıt, Xırdalan şəhərləri və Abşeron rayonu istisna olmaqla, respublikanın digər şəhər və rayonlarında, o cümlədən Naxçıvan Muxtar Respublikasında mehmanxana (hotel) və sanatoriya fəaliyyətində istifadə edilən (bu Məcəllənin 16.3-cü maddəsinə müvafiq olaraq sahibkarlıq fəaliyyətinin müvəqqəti dayandırıldığı dövr istisna olmaqla) yerləşmə vasitəsi olan daşınmaz əmlaklara görə əmlak vergisi 2024-ci il yanvarın 1-dən 3 il müddətinə 75 faiz azaldılır.","notes":[],"parent":null,"article":"199","repealed":false,"title":"Region hotel / sanatoriya — 75%, 3 il"},{"id":"199.22","text":"dövlət-özəl tərəfdaşlığı layihələri üzrə özəl tərəfdaş və ya layihə şirkəti olan, habelə dövlətin satınalma öhdəliyi ilə bərpa olunan enerji mənbələrindən istifadə edilməklə, müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) müəyyən etdiyi məbləğdən aşağı olmayan elektrik enerjisi istehsalı layihələri üzrə istehsalçı olan fərdi sahibkarlar və hüquqi şəxslər müvafiq olaraq “Dövlət-özəl tərəfdaşlığı haqqında” Azərbaycan Respublikasının Qanununa uyğun olaraq bağlanılmış dövlət-özəl tərəfdaşlığı müqaviləsində və ya “Elektrik enerjisi istehsalında bərpa olunan enerji mənbələrindən istifadə haqqında” Azərbaycan Respublikasının Qanununa uyğun olaraq bağlanılmış elektrik enerjisinin satınalma müqaviləsi ilə müəyyən olunan müddətə, lakin 30 ildən (tikinti dövrü də daxil olmaqla) çox olmayaraq həmin layihələr çərçivəsində istifadə olunan əmlaka görə əmlak vergisini ödəməkdən azaddırlar.","notes":[],"parent":null,"article":"199","repealed":false,"title":"DÖT və bərpa olunan enerji — 30 il"}]},{"code":"207","title":"Torpaq vergisindən azadolmalar və güzəştlər","notes":[],"items":[{"id":"207.1","text":"Aşağıdakı torpaqlar torpaq vergisinə cəlb edilmir:","notes":[],"parent":null,"article":"207","repealed":false,"title":"Torpaq vergisinə cəlb olunmayanlar"},{"id":"207.1.1","text":"yaşayış məntəqələrinin ümumi istifadədə olan torpaqları;","notes":[],"parent":"207.1","article":"207","repealed":false,"title":"Ümumi istifadə torpaqları"},{"id":"207.1.2","text":"Dövlət hakimiyyəti orqanlarının, büdcə təşkilatlarının və yerli özünü idarəetmə orqanlarının, Azərbaycan Respublikası Mərkəzi Bankının və onun qurumlarının, dövlətin adından yaradılan publik hüquqi şəxslərin (sahibkarlıq fəaliyyəti məqsədləri üçün istifadə olunan torpaqlar istisna olmaqla), habelə Azərbaycan Respublikasının Dövlət Neft Fondunun mülkiyyətində və ya istifadəsində olan torpaqlar;","notes":[],"parent":"207.1","article":"207","repealed":false,"title":"Dövlət orqanları, MB, Neft Fondu"},{"id":"207.1.3","text":"fiziki və hüquqi şəxslərin istifadəsinə verilməmiş dövlət, meşə və su fondu torpaqları, Xəzər dənizinin (gölünün) Azərbaycan Respublikasına məxsus olan sektorunun altında yerləşən torpaqlar;","notes":[],"parent":"207.1","article":"207","repealed":false,"title":"Dövlət, meşə, su fondu, Xəzər dibi"},{"id":"207.1.4","text":"dövlət sərhəd zolaqları və müdafiə təyinatlı torpaqlar.","notes":[],"parent":"207.1","article":"207","repealed":false,"title":"Sərhəd zolağı və müdafiə torpaqları"},{"id":"207.2","text":"Bu Məcəllənin 102.1-1-ci və 102.2-ci maddələrində göstərilən şəxslərin mülkiyyətində olan torpaqlara görə torpaq vergisinin məbləği 10 manat azaldılır.","notes":[],"parent":null,"article":"207","repealed":false,"title":"102.1-1 / 102.2 şəxslər — 10 manat"},{"id":"207.3","text":"Müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) yaratdığı sənaye, yaxud texnologiyalar parklarının rezidenti olan hüquqi şəxslər və hüquqi şəxs yaratmadan sahibkarlıq fəaliyyətini həyata keçirən fiziki şəxslər qanunvericiliyə uyğun olaraq, sənaye və texnologiyalar parkında qeydiyyata alındıqları hesabat ilindən başlayaraq, sənaye və texnologiyalar parkında istifadə etdikləri torpaqlara görə 10 il müddətinə torpaq vergisini ödəməkdən azaddırlar. Bu maddədə nəzərdə tutulan güzəşt texnologiyalar parkının rezidenti kimi texnologiyalar parkından kənar sistem inteqrasiyası, proqram təminatının hazırlanması və inkişaf etdirilməsi fəaliyyətini həyata keçirən şəxslərə də tətbiq edilir.","notes":[],"parent":null,"article":"207","repealed":false,"title":"Sənaye / texnopark rezidenti — 10 il"},{"id":"207.3-1","text":"Müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) yaratdığı sənaye parkında müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) müəyyən etdiyi fəaliyyətlə məşğul olan sənaye parkının rezidenti həmin fəaliyyət prosesində istifadə etdiyi sənaye parkındakı torpaqlara görə 2025-ci il yanvarın 1-dən 6 il müddətinə torpaq vergisini ödəməkdən azaddır.","notes":[],"parent":null,"article":"207","repealed":false,"title":"Sənaye parkı xüsusi fəaliyyət — 6 il"},{"id":"207.4","text":"Müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) yaratdığı sənaye, yaxud texnologiyalar parklarının və sənaye məhəllələrinin idarəedici təşkilatı və ya operatoru sənaye, yaxud texnologiyalar parklarının və sənaye məhəllələrinin ərazisində istifadə etdiyi torpaqlara görə torpaq vergisini ödəməkdən azaddır.","notes":[],"parent":null,"article":"207","repealed":false,"title":"Park operatorunun torpağı"},{"id":"207.5","text":"İnvestisiya təşviqi sənədini almış hüquqi şəxs və fərdi sahibkar həmin sənədi aldığı tarixdən mülkiyyətində və ya istifadəsində olan müvafiq torpaqlara görə 7 il müddətinə torpaq vergisini ödəməkdən azaddır.","notes":[],"parent":null,"article":"207","repealed":false,"title":"İnvestisiya təşviqi — 7 il"},{"id":"207.6","text":"KOB klaster şirkətləri KOB klaster şirkətlərinin reyestrinə daxil edildiyi tarixdən 7 il müddətinə mülkiyyətində və ya istifadəsində olan və KOB klaster fəaliyyətində istifadə olunan torpaqlara görə torpaq vergisini ödəməkdən azad edilirlər.","notes":[],"parent":null,"article":"207","repealed":false,"title":"KOB klaster — 7 il"},{"id":"207.7","text":"Müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) ödəmə qabiliyyətini itirmiş bankların rezolyusiyası və sağlamlaşdırma tədbirləri çərçivəsində müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanının (qurumun) qərarına əsasən aldığı problemli aktivlərin (borcların) əvəzində əldə etdiyi, onun mülkiyyətində (balansında) olan və siyahısını müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) ilə razılaşdırdığı torpağa görə 2019-cu il yanvarın 1-dən 12 il müddətinə torpaq vergisini ödəməkdən azaddır.","notes":[],"parent":null,"article":"207","repealed":false,"title":"Bank rezolyusiyası torpağı — 12 il"},{"id":"207.8","text":"Geoloji ayırma sənədi əsasında faydalı qazıntı yataqlarının (neft və qaz yataqları istisna olmaqla) axtarışı, qiymətləndirilməsi və kəşfiyyatı işlərinə cəlb edilən torpaq sahələrinə görə torpaq vergisi müvafiq təsdiqedici sənədlər (geoloji-kəşfiyyat işlərini həyata keçirən şəxsin podrat müqaviləsi, geoloji-kəşfiyyat planı, geoloji-kəşfiyyatla bağlı təqdim edilən hesabat) əsasında faydalı qazıntı yataqlarının axtarışı, qiymətləndirilməsi və kəşfiyyatı işlərinə başlanıldığı təqvim ili üzrə 75 faiz azaldılır. Bu maddənin müddəaları eyni vergi ilində geoloji ayırma sənədi əsasında faydalı qazıntı yataqlarının (neft və qaz yataqları istisna olmaqla) axtarışı, qiymətləndirilməsi və kəşfiyyatı işlərinə cəlb edilən və istismar edilərək faydalı qazıntılar çıxarılan torpaq sahələrinə münasibətdə tətbiq edilmir.","notes":[],"parent":null,"article":"207","repealed":false,"title":"Geoloji kəşfiyyat — 75%"},{"id":"207.9","text":"Kredit təşkilatları məhkəmənin qanuni qüvvəyə minmiş qərarına əsasən müflis elan olunduğu halda kredit təşkilatının müflis elan olunması ilə bağlı məhkəmə qərarının qüvvəyə mindiyi ildən etibarən torpaq vergisini ödəməkdən azaddırlar.","notes":[],"parent":null,"article":"207","repealed":false,"title":"Müflis kredit təşkilatı"},{"id":"207.10","text":"Siyahısı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən təsdiq edilmiş idxal mallarını yerli istehsal (emal) malları ilə əvəz edəcək qida məhsullarının istehsalı ilə məşğul olan hüquqi və fiziki şəxslər həmin fəaliyyət prosesində istifadə olunan torpaqlara görə müvafiq siyahının təsdiq edildiyi ildən etibarən 7 il müddətinə torpaq vergisini ödəməkdən azaddırlar.","notes":[],"parent":null,"article":"207","repealed":false,"title":"Qida idxalını əvəzetmə — 7 il"},{"id":"207.11","text":"Azərbaycan Respublikasında dövlət əmlakının özəlləşdirilməsinin dövlət proqramlarına uyğun olaraq 2023-cü il 1 yanvar tarixindən sonra özəlləşdirilməsi barədə qərar qəbul edilən dövlətə məxsus hüquqi şəxslər özəlləşdirilməsi barədə qərarın qəbul edildiyi ildən etibarən özəlləşdirilmə prosesi müddətində, lakin 3 ildən çox olmayaraq, torpaq vergisini ödəməkdən azaddırlar.","notes":[],"parent":null,"article":"207","repealed":false,"title":"Özəlləşdirmə prosesi — 3 il"},{"id":"207.12","text":"Kredit təşkilatları verilmiş kredit müqabilində onların mülkiyyətinə keçən torpaqlara görə həmin torpaqların balansa götürüldüyü təqvim ilindən başlayaraq 2 il müddətinə torpaq vergisini ödəməkdən azaddırlar.","notes":[],"parent":null,"article":"207","repealed":false,"title":"Kredit müqabilində torpaq — 2 il"},{"id":"207.13","text":"Dövlət-özəl tərəfdaşlığı layihələri üzrə özəl tərəfdaş və ya layihə şirkəti olan, habelə dövlətin satınalma öhdəliyi ilə bərpa olunan enerji mənbələrindən istifadə edilməklə, müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) müəyyən etdiyi məbləğdən aşağı olmayan elektrik enerjisi istehsalı layihələri üzrə istehsalçı olan fərdi sahibkarlar və hüquqi şəxslər müvafiq olaraq “Dövlət-özəl tərəfdaşlığı haqqında” Azərbaycan Respublikasının Qanununa uyğun olaraq bağlanılmış dövlət-özəl tərəfdaşlığı müqaviləsində və ya “Elektrik enerjisi istehsalında bərpa olunan enerji mənbələrindən istifadə haqqında” Azərbaycan Respublikasının Qanununa uyğun olaraq bağlanılmış elektrik enerjisinin satınalma müqaviləsi ilə müəyyən olunan müddətə, lakin 30 ildən (tikinti dövrü də daxil olmaqla) çox olmayaraq həmin layihələr çərçivəsində istifadə olunan torpaqlara görə torpaq vergisini ödəməkdən azaddırlar.","notes":[],"parent":null,"article":"207","repealed":false,"title":"DÖT və bərpa olunan enerji — 30 il"},{"id":"207.14","text":"Qanunla müəyyən edilmiş qaydada Azərbaycan Respublikasında qeydiyyatdan keçən və teatr, muzey, simfonik orkestr, habelə film istehsalını və dublyajını həyata keçirən kinematoqrafiya müəssisələri və film prodüserləri həmin fəaliyyət üzrə istifadə etdikləri torpaqlara görə 2025-ci il yanvarın 1-dən 5 il müddətinə torpaq vergisini ödəməkdən azaddırlar.","notes":[],"parent":null,"article":"207","repealed":false,"title":"Teatr, muzey, film — 5 il"}]}],"overlaps":[{"id":"park-rezident","title":"Sənaye / texnologiyalar parkı rezidenti","hint":"10 il — 5 vergi","duration":"10 il","taxes":["102","106","164","199","207"],"items":[{"article":"102","code":"102.1.21","note":"fəaliyyətdən gəlir (əməkhaqqı istisna)"},{"article":"106","code":"106.1.13","note":"parkdakı fəaliyyətdən gəlir"},{"article":"164","code":"164.1.16","note":"texnika, avadanlıq, qurğu idxalı"},{"article":"199","code":"199.7","note":"parkdakı əmlaka görə"},{"article":"207","code":"207.3","note":"parkda istifadə olunan torpaq"}]},{"id":"texnopark-it","title":"Texnopark — parkdan kənar IT","hint":"sistem inteqrasiyası, proqram təminatı","duration":"10 il","taxes":["102","106","199","207"],"items":[{"article":"102","code":"102.1.21","note":"gəlirə də şamil edilir"},{"article":"102","code":"102.1.21-1","note":"dividend — 10 il"},{"article":"106","code":"106.1.13","note":"hüquqi şəxsin gəliri"},{"article":"106","code":"106.1.13-1","note":"dividend — 10 il"},{"article":"199","code":"199.7","note":"əmlak güzəşti də tətbiq edilir"},{"article":"207","code":"207.3","note":"torpaq güzəşti də tətbiq edilir"}]},{"id":"investisiya","title":"İnvestisiya təşviqi sənədi","hint":"7 il — 5 vergi","duration":"7 il","taxes":["102","106","164","199","207"],"items":[{"article":"102","code":"102.1.23","note":"gəlirin 50%-i"},{"article":"106","code":"106.1.17","note":"mənfəətin 50%-i"},{"article":"164","code":"164.1.26","note":"texnika, atı ilə"],"answer":"Əmək məzuniyyəti üçün ayrıca təsdiq olunmuş, nəzərə alınan və alınmayan ödənişlər siyahısı ilə","explain":"Əmək məzuniyyəti pulu öz siyahısı ilə sayılır."},{"itemId":"ferq","q":"İşçi işdən çıxır və istifadə etmədiyi əmək məzuniyyətinə görə ona kompensasiya ödənilməlidir. Kompensasiyanın məbləği orta əməkhaqqı ilə tapılır. Mühasib hansı qaydanı götürməlidir?","options":["Əmək məzuniyyətinə çıxanın pulu üçün olan xüsusi siyahını","Əmək məzuniyyəti pulu istisna olmaqla qalan hallar üçün olan orta əməkhaqqı siyahısını","Yalnız rəhbərin şifahi göstərişini","Yalnız ezamiyyət gündəliyini"],"answer":"Əmək məzuniyyəti pulu istisna olmaqla qalan hallar üçün olan orta əməkhaqqı siyahısını","explain":"İstifadə edilməmiş məzuniyyət kompensasiyası məzuniyyətə çıxmaq deyil, o biri qayda ilə sayılır."},{"itemId":"artiq","q":"İşçi iyunda 10 gün əmək məzuniyyətinə çıxır. Aprel və mayda ona iş vaxtından artıq işlənmiş saatlara görə əlavə haqq ödənilmişdir. İyun məzuniyyəti üçün orta əməkhaqqı hesablanarkən bu artıq iş haqqı daxil edilirmi?","options":["Bəli, daxil edilir","Xeyr, daxil edilmir"],"answer":"Bəli, daxil edilir","explain":"Əmək məzuniyyəti üçün orta əməkhaqqında iş vaxtından artıq iş nəzərə alınan ödənişlər sırasındadır."},{"itemId":"artiq","q":"İşçi iyulda 5 gün ezamiyyətə göndərilir. Ezamiyyətdə olduğu günlər üçün ona orta əməkhaqqı saxlanılacaq. May və iyunda ona iş vaxtından artıq işlənmiş saatlara görə əlavə haqq ödənilmişdir. Ezamiyyət günlərinin orta əməkhaqqına bu artıq iş haqqı daxil edilirmi?","options":["Bəli, daxil edilir","Xeyr, daxil edilmir"],"answer":"Xeyr, daxil edilmir","explain":"Ezamiyyət məzuniyyət pulu deyil. Bu halda iş vaxtından artıq iş nəzərə alınmayan ödənişlər sırasındadır."},{"itemId":"artiq","q":"İşçi işdən çıxır. İstifadə etmədiyi 12 günlük əmək məzuniyyətinə görə ona kompensasiya hesablanır. Son aylarda ona iş vaxtından artıq işə görə əlavə haqq ödənilmişdir. Bu artıq iş haqqı kompensasiya üçün orta əməkhaqqına daxil edilirmi?","options":["Bəli, daxil edilir","Xeyr, daxil edilmir"],"answer":"Xeyr, daxil edilmir","explain":"İstifadə edilməmiş məzuniyyət kompensasiyası məzuniyyətə çıxmaq deyil. Artıq iş bu hesablamada daxil edilmir."},{"itemId":"artiq","q":"İşçi mart ayında 8 saat iş vaxtından artıq işləyib və haqq alıb. Apreldə əmək məzuniyyətinə çıxanda bu 8 saatın haqqı məzuniyyət orta əməkhaqqına düşür. Mayda eyni işçini ezamiyyətə göndərəndə isə həmin 8 saatın haqqı ezamiyyət orta əməkhaqqına düşmür. Bu fikir düzgündür?","options":["Düzgündür","Səhvdir"],"answer":"Düzgündür","explain":"Eyni artıq iş ödənişi məzuniyyətdə daxil edilir, ezamiyyətdə daxil edilmir."},{"itemId":"artiq","q":"İşçi faktiki olaraq iş vaxtından artıq işləyib və haqq alıb. Ezamiyyət günləri üçün orta əməkhaqqı hesablanarkən mühasib deyir: «Faktiki işlənib, ona görə tarif maaşı kimi avtomatik daxil edirəm.» Bu yanaşma düzgündürmü?","options":["Bəli, faktiki işlənən hər haqq daxil edilir","Xeyr, ezamiyyət orta əməkhaqqında iş vaxtından artıq iş daxil edilmir","Yalnız gecə növbəsindəki artıq iş daxil edilir","Yalnız bayram günündəki artıq iş daxil edilir"],"answer":"Xeyr, ezamiyyət orta əməkhaqqında iş vaxtından artıq iş daxil edilmir","explain":"Faktiki işlənsə belə, ezamiyyət, kompensasiya və məcburi işburaxmada artıq iş çıxılır."},{"itemId":"bayram","q":"İşçi avqustda əmək məzuniyyətinə çıxır. İyulda istirahət günündə işə çıxıb və buna görə əlavə haqq alıb. Məzuniyyət üçün orta əməkhaqqına istirahət günündəki bu haqq daxil edilirmi?","options":["Bəli, daxil edilir","Xeyr, daxil edilmir"],"answer":"Bəli, daxil edilir","explain":"Əmək məzuniyyəti üçün orta əməkhaqqında istirahət günündə iş nəzərə alınır."},{"itemId":"bayram","q":"İşçi sentyabrda ezamiyyətə göndərilir. Avqustda istirahət günündə işə çıxıb və buna görə əlavə haqq alıb. Ezamiyyət günləri üçün orta əməkhaqqına istirahət günündəki bu haqq daxil edilirmi?","options":["Bəli, daxil edilir","Xeyr, daxil edilmir"],"answer":"Xeyr, daxil edilmir","explain plain":"Dörd gün eyni qaydadadır: məzuniyyətdə daxil et, o biri hallarda çıxar."},{"itemId":"bayram","q":"Mühasib deyir: «Bayram günündə işləməyə görə ödənilən pul da əməkhaqqıdır, ona görə həm məzuniyyət, həm ezamiyyət, həm də istifadə edilməmiş məzuniyyət kompensasiyası orta əməkhaqqına daxil edirəm.» Bu yanaşma düzgündürmü?","options":["Bəli, əməkhaqqı olduğu üçün hər yerdə daxil edilir","Xeyr, yalnız əmək məzuniyyəti orta əməkhaqqına daxil edilir","Yalnız ezamiyyətə daxil edilir","Heç birinə daxil edilmir"],"answer":"Xeyr, yalnız əmək məzuniyyəti orta əməkhaqqına daxil edilir","explain":"Bayram günündə iş məzuniyyətdə daxil edilir, ezamiyyət və kompensasiyada daxil edilmir."},{"itemId":"avez","q":"İşçi bir ay ərzində xəstə olan şöbə müdirini müvəqqəti əvəz edib və buna görə əlavə haqq alıb. Sonra əmək məzuniyyətinə çıxır. Məzuniyyət üçün orta əməkhaqqına müvəqqəti əvəzetmə əlavəsi daxil edilirmi?","options":["Bəli, daxil edilir","Xeyr, daxil edilmir"],"answer":"Bəli, daxil edilir","explain":"Əmək məzuniyyətində müvəqqəti əvəzetmə nəzərə alınır."},{"itemId":"avez","q":"İşçi bir ay ərzində şöbə müdirini müvəqqəti əvəz edib və buna görə əlavə haqq alıb. Sonra ezamiyyətə göndərilir. Ezamiyyət günləri üçün orta əməkhaqqına müvəqqəti əvəzetmə əlavəsi daxil edilirmi?","options":["Bəli, daxil edilir","Xeyr, daxil edilmir"],"answer":"Xeyr, daxil edilmir","explain":"Ezamiyyət orta əməkhaqqında müvəqqəti əvəzetmə nəzərə alınmır."},{"itemId":"avez","q":"İşçi bir ay ərzində şöbə müdirini müvəqqəti əvəz edib və buna görə əlavə haqq alıb. İşdən çıxanda istifadə etmədiyi məzuniyyətinə görə kompensasiya hesablanır. Kompensasiya üçün orta əməkhaqqına bu əlavə daxil edilirmi?","options":["Bəli, daxil edilir","Xeyr, daxil edilmir"],"answer":"Xeyr, daxil edilmir","explain":"Kompensasiya orta əməkhaqqında müvəqqəti əvəzetmə nəzərə alınmır."},{"itemId":"avez","q":"İşçi 20 gün rəhbəri müvəqqəti əvəz edib və əlavə alıb. Əmək məzuniyyətinə çıxanda bu əlavə məzuniyyət orta əməkhaqqına düşür. Eyni əlavə istifadə edilməmiş məzuniyyət kompensasiyası üçün orta əməkhaqqına düşmür. Bu fikir düzgündür?","options":["Düzgündür","Səhvdir"],"answer":"Düzgündür","explain":"Müvəqqəti əvəzetmə məzuniyyətdə daxil edilir, kompensasiyada daxil edilmir."},{"itemId":"avez","q":"Kollektiv müqavilədə peşələrin (vəzifələrin) əvəz edilməsinə görə daimi əlavə nəzərdə tutulub və hər ay ödənilir. Bundan ayrı, işçi bir dəfə xəstə həmkarını 15 gün müvəqqəti əvəz edib. Daimi əvəzetmə əlavəsi həm məzuniyyət, həm ezamiyyət orta əməkhaqqına daxil edilir. 15 günlük müvəqqəti əvəzetmə isə yalnız məzuniyyət orta əməkhaqqına daxil edilir. Bu fikir düzgündür?","options":["Düzgündür","Səhvdir"],"answer":"Düzgündür","explain":"Daimi vəzifə əvəzetməsi hər yerdə daxil edilir. Müvəqqəti əvəzetmə yalnız məzuniyyətdə daxil edilir."},{"itemId":"mukafat","q":"Kollektiv müqavilədə istehsalın səmərəliliyi üçün rüblük mükafat nəzərdə tutulub. İşçiyə 900 manat rüblük mükafat ödənilib. İşçi əmək məzuniyyətinə çıxır. Məzuniyyət üçün orta əməkhaqqında bu mükafat necə götürülür?","options":["Yalnız 300 manat — mütləq üçə bölünməlidir","Siyahıya düşən ödənilmiş mükafat kimi 900 manat götürülə bilər","Heç götürülmür","Yalnız 450 manat götürülür"],"answer":"Siyahıya düşən ödənilmiş mükafat kimi 900 manat götürülə bilər","explain":"Əmək məzuniyyəti siyahısında «mükafatlar» yazılıb, «bir aya düşən hissə» yazılmayıb."},{"itemId":"mukafat","q":"Kollektiv müqavilədə istehsalın səmərəliliyi üçün rüblük mükafat nəzərdə tutulub. İşçiyə 900 manat rüblük mükafat ödənilib. İşçi 3 gün ezamiyyətə göndərilir. Ezamiyyət günləri üçün orta əməkhaqqında bu mükafat necə götürülür?","options":["900 manatın hamısı","Mükafatın bir aya düşən müvafiq hissəsi","Heç götürülmür","Yalnız rəhbər icazə versə götürülür"],"answer":"Mükafatın bir aya düşən müvafiq hissəsi","explain":"Ezamiyyət, kompensasiya və məcburi işburaxmada sistem mükafatı aylıq hissə ilə götürülür."},{"itemId":"mukafat","q":"Dövlət qulluqçusuna 2002-ci il 24 avqust tarixli əsasnamədə nəzərdə tutulan kollektiv və ya fərdi mükafat ödənilib. Dövlət qulluqçusu əmək məzuniyyətinə çıxır. Bu mükafat məzuniyyət üçün orta əməkhaqqına daxil edilirmi?","options":["Bəli, daxil edilir","Xeyr, daxil edilmir"],"answer":"Bəli, daxil edilir","explain":"Əmək məzuniyyətində dövlət qulluqçusunun kollektiv və fərdi mükafatı nəzərə alınır."},{"itemId":"mukafat","q":"Dövlət qulluqçusuna 2002-ci il 24 avqust tarixli əsasnamədə nəzərdə tutulan kollektiv və ya fərdi mükafat ödənilib. Sonra ona ezamiyyət günləri üçün orta əməkhaqqı hesablanır. Bu mükafat necə götürülür?","options":["Tam ödənilmiş məbləğ","Bir aya düşən müvafiq hissəsi","Heç nəzərə alınmır","Yalnız fərdi mükafat nəzərə alınır"],"answer":"Bir aya düşən müvafiq hissəsi","explain":"Ezamiyyətdə həm sistem, həm dövlət qulluğu mükafatı aylıq hissə ilə gedir."},{"itemId":"mukafat","q":"İşçiyə rüblük sistem mükafatı ödənilib. Əmək məzuniyyəti üçün orta əməkhaqqında ödənilən məbləğ götürülə bilər. Ezamiyyət və istifadə edilməmiş məzuniyyət kompensasiyası üçün orta əməkhaqqında isə yalnız bir aya düşən hissəsi götürülür. Bu fikir düzgündür?","options":["Düzgündür","Səhvdir"],"answer":"Düzgündür","explain":"Məzuniyyətdə ödənilən mükafat, o biri hallarda aylıq hissə."},{"itemId":"mukafat","q":"Mühasib deyir: «Sistem mükafatını həm məzuniyyət, həm ezamiyyət orta əməkhaqqında eyni qaydada — tam məbləğlə — götürürəm.» Bu yanaşma düzgündürmü?","options":["Bəli, hər iki yerdə tam götürülür","Xeyr, məzuniyyətdə ödənilən mükafat, ezamiyyətdə bir aya düşən hissə götürülür","Hər iki yerdə yalnız aylıq hissə götürülür","Mükafat heç birinə daxil edilmir"],"answer":"Xeyr, məzuniyyətdə ödənilən mükafat, ezamiyyətdə bir aya düşən hissə götürülür","explain":"Bu, iki siyahının əsas fərqlərindən biridir."},{"itemId":"mukafat","q":"İşçinin yubileyi olub, müəssisə ona birdəfəlik həvəsləndirici pul (mükafat da daxil) verib. İşçi əmək məzuniyyətinə çıxır. Yubiley pulu məzuniyyət üçün orta əməkhaqqına daxil edilirmi?","options":["Bəli, daxil edilir","Xeyr, daxil edilmir"],"answer":"Xeyr, daxil edilmir","explain":"Yubiley, bayram, anadan olan gün və oxşar birdəfəlik həvəsləndirmə heç bir orta əməkhaqqına daxil edilmir."},{"itemId":"mukafat","q":"İşçinin yubileyi olub, müəssisə ona birdəfəlik həvəsləndirici pul verib. Sonra ezamiyyət günləri üçün orta əməkhaqqı hesablanır. Yubiley pulu bu hesablamaya daxil edilirmi?","options":["Bəli, daxil edilir","Xeyr, daxil edilmir"],"answer":"Xeyr, daxil edilmir","explain":"Birdəfəlik yubiley həvəsləndirməsi ezamiyyətdə də daxil edilmir."},{"itemId":"mukafat","q":"Kollektiv müqavilədə səmərəlilik üçün nəzərdə tutulan sistem mükafatı orta əməkhaqqına daxil edilə bilər. Yubiley və ad günü üçün verilən pul isə daxil edilmir. Bu qayda həm əmək məzuniyyətinə, həm də ezamiyyətə aiddirmi?","options":["Bəli, yubiley heç birində yoxdur; fərq yalnız sistem mükafatının tam, yoxsa aylıq götürülməsindədir","Xeyr, yubiley məzuniyyətə daxil edilir","Xeyr, sistem mükafatı heç birinə daxil edilmir","Yalnız ezamiyyətə aiddir"],"answer":"Bəli, yubiley heç birində yoxdur; fərq yalnız sistem mükafatının tam, yoxsa aylıq götürülməsindədir","explain":"Yubiley hər yerdə çıxılır. Sistem mükafatı məzuniyyətdə tam, ezamiyyətdə aylıq hissədir."},{"itemId":"mukafat","q":"Orta əməkhaqqı üçün «əməyin ödənilməsi sistemi üzrə mükafat» sayılan hansıdır?","options":["İşçiyə verilən hər nağd hədiyyə","Normativ hüquqi aktda, kollektiv müqavilədə və ya əmək müqaviləsində istehsalın səmərəliliyi və ya işin keyfiyyəti üçün nəzərdə tutulan mükafat","Yalnız rəhbərin şifahi vədi ilə verilən pul","Yalnız yubiley günü verilən pul"],"answer":"Normativ hüquqi aktda, kollektiv müqavilədə və ya əmək müqaviləsində istehsalın səmərəliliyi və ya işin keyfiyyəti üçün nəzərdə tutulan mükafat","explain":"Siyahının qeydində mükafat belə izah olunur."},{"itemId":"ferq4","q":"İşçi həm əmək məzuniyyətinə çıxıb, həm də sonra ezamiyyətə göndərilib. Aşağıdakı ödənişlərdən hansı məzuniyyət orta əməkhaqqına daxil edilir, ezamiyyət orta əməkhaqqına isə daxil edilmir?","options":["İş vaxtından artıq işlənmiş saatlara görə ödəniş","Maddi yardım","Ezamiyyətlə bağlı gündəlik və yol xərci","Yubiley günü verilən pul"],"answer":"İş vaxtından artıq işlənmiş saatlara görə ödəniş","explain":"Artıq iş məzuniyyətdə daxil edilir, ezamiyyətdə daxil edilmir. Digər üçü heç birinə düşmür."},{"itemId":"ferq4","q":"İşçi həm əmək məzuniyyətinə çıxıb, həm də sonra istifadə etmədiyi məzuniyyətinə görə kompensasiya alıb. Aşağıdakılardan hansı məzuniyyət orta əməkhaqqına daxil edilir, kompensasiya orta əməkhaqqına isə daxil edilmir?","options":["Bayram günündə işləməyə görə ödəniş","Sanatoriya-kurort yollayışının dəyəri","İş paltarı və fərdi mühafizə vasitəsinin dəyəri","Mülki-hüquqi müqavilə üzrə haqq"],"answer":"Bayram günündə işləməyə görə ödəniş","explain":"Bayram günündə iş yalnız məzuniyyət orta əməkhaqqına daxil edilir."},{"itemId":"ferq4","q":"İşçi həm əmək məzuniyyətinə çıxıb, həm də sonra ezamiyyətə göndərilib. Aşağıdakılardan hansı məzuniyyət orta əməkhaqqına daxil edilir, ezamiyyət orta əməkhaqqına isə daxil edilmir?","options":["Müvəqqəti əvəzetməyə görə ödənilən əlavə","Əmək alətinin amortizasiyasına görə pul əvəzi","Başqa şəhərə köçəndə mənzil kirayəsi","Yarışın qalibinə verilən pul"],"answer":"Müvəqqəti əvəzetməyə görə ödənilən əlavə","explain":"Müvəqqəti əvəzetmə yalnız məzuniyyətdə daxil edilir."},{"itemId":"ferq4","q":"Əmək məzuniyyəti üçün orta əməkhaqqı ilə ezamiyyət, istifadə edilməmiş məzuniyyət kompensasiyası və məcburi işburaxma üçün orta əməkhaqqı arasındakı əsas fərqlər hansılardır?","options":["İş vaxtından artıq iş, istirahət-bayram-səsvermə-hüzn günündə iş, müvəqqəti əvəzetmə və sistem mükafatının tam, yoxsa aylıq hissə ilə götürülməsi","Yalnız tarif maaşı fərqlidir","Yalnız ezamiyyət xərci fərqlidir","Heç bir fərq yoxdur"],"answer":"İş vaxtından artıq iş, istirahət-bayram-səsvermə-hüzn günündə iş, müvəqqəti əvəzetmə və sistem mükafatının tam, yoxsa aylıq hissə ilə götürülməsi","explain":"Qalan ödənişlər iki qaydada eynidir."},{"itemId":"tarif","q":"İşçi əmək məzuniyyətinə çıxır. Son aylarda ona faktiki işlədiyi vaxta görə tarif (vəzifə) maaşı ödənilib. Bu maaş məzuniyyət üçün orta əməkhaqqına daxil edilirmi?","options":["Bəli, daxil edilir","Xeyr, daxil edilmir"],"answer":"Bəli, daxil edilir","explain":"Tarif maaşı həm məzuniyyət, həm ezamiyyət orta əməkhaqqına daxil edilir."},{"itemId":"tarif","q":"İşçi ezamiyyətə göndərilir. Son aylarda ona faktiki işlədiyi vaxta görə tarif (vəzifə) maaşı ödənilib. Bu maaş ezamiyyət günləri üçün orta əməkhaqqına daxil edilirmi?","options":["Bəli, daxil edilir","Xeyr, daxil edilmir"],"answer":"Bəli, daxil edilir","explain":"Tarif maaşı ezamiyyətdə də daxil edilir."},{"itemId":"daimi","q":"İşçi ağır və zərərli şəraitdə, əlverişsiz iqlimdə, gecə növbəsində və çoxnövbəli rejimdə işləyir. Buna görə hər ay daimi əlavə alır. Əmək məzuniyyətinə çıxanda bu daimi əlavələr məzuniyyət orta əməkhaqqına daxil edilirmi?","options":["Bəli, daxil edilir","Xeyr, daxil edilmir"],"answer":"Bəli, daxil edilir","explain":"Daimi kompensasiya və həvəsləndirici əlavələr məzuniyyətə daxil edilir."},{"itemId":"daimi","q":"İşçi ağır və zərərli şəraitdə, əlverişsiz iqlimdə, gecə növbəsində və çoxnövbəli rejimdə işləyir. Buna görə hər ay daimi əlavə alır. Ezamiyyətə göndəriləndə bu daimi əlavələr ezamiyyət orta əməkhaqqına daxil edilirmi?","options":["Bəli, daxil edilir","Xeyr, daxil edilmir"],"answer":"Bəli, daxil edilir","explain":"Daimi əlavələr ezamiyyətdə də daxil edilir."},{"itemId":"daimi","q":"İşçiyə elmi dərəcəyə, fəxri ada, qulluq stajına, xidmət illərinə, ixtisas dərəcəsinə və xüsusi rütbə maaşına görə hər ay daimi əlavə ödənilir. Bu əlavələr həm əmək məzuniyyəti, həm də ezamiyyət üçün orta əməkhaqqına daxil edilirmi?","options":["Bəli, daxil edilir","Xeyr, daxil edilmir"],"answer":"Bəli, daxil edilir","explain":"Bu daimi əlavələr hər iki hesablamada daxil edilir."},{"itemId":"daimi","q":"Şəhər icra hakimiyyəti başçısına səlahiyyətlərinin icrası ilə bağlı təmsilçilik üçün əlavə pul təminatı ödənilir. Bu məbləğ həm əmək məzuniyyəti, həm də ezamiyyət üçün orta əməkhaqqına daxil edilirmi?","options":["Bəli, daxil edilir","Xeyr, daxil edilmir"],"answer":"Bəli, daxil edilir","explain":"Təmsilçilik pul təminatı hər iki hesablamada yazılıb."},{"itemId":"daimi","q":"Kollektiv müqavilədə peşələrin (vəzifələrin) əvəz edilməsinə görə daimi əlavə nəzərdə tutulub və hər ay ödənilir. Bu daimi əlavə həm əmək məzuniyyəti, həm də ezamiyyət orta əməkhaqqına daxil edilirmi?","options":["Bəli, daxil edilir","Xeyr, daxil edilmir"],"answer":"Bəli, daxil edilir","explain":"Daimi vəzifə əvəzetməsi daxil edilir. 10-20 günlük müvəqqəti əvəzetmə isə yalnız məzuniyyətdə daxil edilir."},{"itemId":"daimi","q":"İşçi çoxnövbəli iş rejimində çalışır və buna görə daimi əlavə alır. Eyni işçiyə növbə metodu ilə (rotasiya qaydasında, məsələn 15 gün iş, 15 gün ev) işlədiyinə görə də əlavə ödənilir. Çoxnövbəli rejim əlavəsi həm məzuniyyət, həm ezamiyyət orta əməkhaqqına daxil edilir. Növbə metodu əlavəsi isə heç birinə daxil edilmir. Bu fikir düzgündür?","options":["Düzgündür","Səhvdir"],"answer":"Düzgündür","explain":"Çoxnövbəli rejim daimi əlavədir. Növbə metodu ezamiyyət-səyyar qrupundadır və çıxılır."},{"itemId":"daimi","q":"İşçi növbə metodu ilə (rotasiya) işləyir və buna görə əlavə alır. Əmək məzuniyyətinə çıxanda bu əlavə məzuniyyət orta əməkhaqqına daxil edilirmi?","options":["Bəli, daxil edilir","Xeyr, daxil edilmir"],"answer":"Xeyr, daxil edilmir","explain":"Növbə metodu, səyyar tikinti və yolda iş əlavələri həm məzuniyyətə, həm ezamiyyətə daxil edilmir."},{"itemId":"daimi","q":"İşçi növbə metodu ilə işləyir və buna görə əlavə alır. Ezamiyyətə göndəriləndə bu əlavə ezamiyyət orta əməkhaqqına daxil edilirmi?","options":["Bəli, daxil edilir","Xeyr, daxil edilmir"],"answer":"Xeyr, daxil edilmir","explain":"Növbə metodu əlavəsi heç bir orta əməkhaqqına daxil edilmir."},{"itemId":"daimi","q":"İşçi gecə növbəsində həm daimi gecə əlavəsi, həm də iş vaxtından artıq iş haqqı alıb. Əmək məzuniyyətinə çıxanda hər ikisi məzuniyyət orta əməkhaqqına daxil edilir. Ezamiyyətə göndəriləndə isə gecə əlavəsi daxil edilir, artıq iş daxil edilmir. Bu fikir düzgündür?","options":["Düzgündür","Səhvdir"],"answer":"Düzgündür","explain":"Gecə əlavəsi daimidir və hər yerdə var. Artıq iş yalnız məzuniyyətdə var."},{"itemId":"usaq","q":"İşçi uşağını yedizdirmək üçün iş günü ərzində fasilə alır və bu fasilə ödənilir. Əmək məzuniyyətinə çıxanda bu ödəniş məzuniyyət orta əməkhaqqına daxil edilirmi?","options":["Bəli, daxil edilir","Xeyr, daxil edilmir"],"answer":"Bəli, daxil edilir","explain":"Uşağın yedizdirilməsi fasiləsi həm məzuniyyətə, həm ezamiyyətə daxil edilir."},{"itemId":"usaq","q":"İşçi uşağını yedizdirmək üçün iş günü ərzində fasilə alır və bu fasilə ödənilir. Ezamiyyətə göndəriləndə bu ödəniş ezamiyyət orta əməkhaqqına daxil edilirmi?","options":["Bəli, daxil edilir","Xeyr, daxil edilmir"],"answer":"Bəli, daxil edilir","explain":"Uşaq fasiləsində iki qayda arasında fərq yoxdur."},{"itemId":"qonorar","q":"Qəzetin, jurnalın, nəşriyyatın, radio və televiziyanın və ya informasiya agentliyinin ştatında olan işçiyə ədəbiyyat qonorarı fondundan qonorar verilib. İşçi əmək məzuniyyətinə çıxır. Bu qonorar məzuniyyət orta əməkhaqqına daxil edilirmi?","options":["Bəli, daxil edilir","Xeyr, daxil edilmir"],"answer":"Bəli, daxil edilir","explain":"Daimi xarakter daşıyan müəlliflik, artist qonorarı və quruluş haqqı məzuniyyətə daxil edilir."},{"itemId":"qonorar","q":"Eyni ştat işçisinə daimi xarakter daşıyan müəlliflik qonorarı, artist qonorarı və ya quruluş haqqı ödənilib. İşçi ezamiyyətə göndərilir. Bu məbləğ ezamiyyət orta əməkhaqqına daxil edilirmi?","options":["Bəli, daxil edilir","Xeyr, daxil edilmir"],"answer":"Bəli, daxil edilir","explain":"Daimi qonorar ezamiyyətdə də daxil edilir."},{"itemId":"qonorar","q":"Daimi xarakter daşıyan müəlliflik və artist qonorarı yalnız əmək məzuniy function save() {

}
function getStatus(id) { return store.status[id] || ""; }

  if (status) store.status[id] = status;
  else delete store.status[id];
  save();
}
function toggleStatus(id, status) {
  if (getStatus(id) === status) delete store.status[id];
  else store.status[id] = status;
  save();
}
function stats(code) {
  const items = code && code !== "all" ? ARTICLE[code].items : ITEMS;
  const live = items.filter((it) => !it.repealed);
  const know = live.filter((it) => getStatus(it.id) === "know").length;
  const hard = live.filter((it) => getStatus(it.id) === "hard").length;
  const again = live.filter((it) => getStatus(it.id) === "again").length;
  return { live: live.length, know, hard, again, left: live.length - know, repealed: items.length - live.length, total: items.length };
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fold(s) {
  return s.toLocaleLowerCase("az")
    .replace(/ə/g, "e").replace(/ö/g, "o").replace(/ü/g, "u")
    .replace(/ğ/g, "g").replace(/ı/g, "i").replace(/ş/g, "s")
    .replace(/ç/g, "c");
}
function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function familyOf(unit) {
  const u = unit.toLocaleLowerCase("az");
  if (u.startsWith("manat")) return "manat";
  if (u.startsWith("faiz")) return "faiz";
  if (u.startsWith("il")) return "il";
  if (u.startsWith("ay")) return "ay";
  if (u.startsWith("yaş")) return "yaş";
  if (u.startsWith("nəfər")) return "nəfər";
  if (u.startsWith("kub")) return "kub";
  if (u.startsWith("ədəd")) return "ədəd";
  if (u.startsWith("milyon")) return "milyon";
  if (u === "kvt") return "kvt";

        if (opts.length >= 3) break;

        if (!seen.has(text)) {
          seen.add(text);

    const ids = [];
    for (const x of prefer.concat(rest)) {
      if (!ids.includes(x.id)) ids.push(x.id);
      if (ids.length >= 3) break;
    }
    if (ids.length < 3) continue;
    questions.push({ itemId: it.id, options: shuffle([it.id].concat(ids)), answer: it.id, picked: null, hideStart: null });
    if (questions.length >= len) break;

function makeReqem(len) {

    if (unique && used.has(row.it.id)) return;
    const options = optionsFor(row.f);

    questions.push({ itemId: row.it.id, options, answer: row.f.full, picked: null, hideStart: row.f.start });
  }
  for (const row of shuffled) {

    take(row, true);
  }

}

function copyText(text) {
  const done = () => toast(text + " kopyalandı");
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallback());
  } else fallback();
  function fallback() {
    const t = document.createElement("textarea");
    t.value = text;
    document.body.appendChild(t);
    t.select();
    try { document.execCommand("copy"); done(); } catch (e) { toast(text); }
    t.remove();
  }
}

function onClick(e) {
  const act = e.target.closest("[data-act]");
  if (!act) return;
  const action = act.dataset.act;
  if (action === "nav") { go(act.dataset.hash === "#/oxu" ? "#/oxu/" + (ui.article || "102") : act.dataset.hash); return; }
  if (action === "font") {
    store.font = ((store.font ?? 1) + 1) % 4;
    save();
    applyChrome();
    return;
  }
  if (action === "theme") {
    store.theme = themeNow() === "dark" ? "light" : "dark";
    save();
    applyChrome();
    return;
  }
  if (action === "dismiss-tip") { store.tip = false; save(); act.closest(".tip")?.remove(); return; }
  if (action === "reset") {
    if (!confirm("Bütün əzbər nişanları və ulduzlar silinsin?")) return;
    store.status = {};
    store.stars = {};
    save();
    ui.queue = null;
    route();
    return;
  }
  if (action === "open") {
    ui.article = act.dataset.code;
    store.article = ui.article;
    if (act.dataset.mode === "kart") {
      ui.cardArticle = act.dataset.code;
      store.cardArticle = ui.cardArticle;
      ui.forceQueue = true;
      save();
      go("#/kart");
    } else {
      save();
      go("#/oxu/" + ui.article);
    }
    return;
  }
  if (action === "start-all") {
    ui.cardArticle = "all";
    store.cardArticle = "all";
    ui.onlyLeft = stats().left > 0;
    store.onlyLeft = ui.onlyLeft;
    ui.forceQueue = true;
    save();
    go("#/kart");
    return;
  }
  if (action === "article") {
    ui.article = act.dataset.code;
    store.article = ui.article === "all" ? store.article : ui.article;
    save();
    history.replaceState(null, "", "#/oxu/" + ui.article);
    fillList(true);
    return;
  }
  if (action === "filter") { ui.filter = act.dataset.filter; fillList(true); return; }
  if (action === "expand-all") { ui.expandAll = !ui.expandAll; fillList(false); return; }
  if (action === "toggle-clause") {
    const fold = act.closest(".clause").querySelector(".fold");
    if (fold) fold.hidden = !fold.hidden;
    return;
  }
  if (action === "jump") { openSheet(); return; }
  if (action === "close-sheet") {
    if (Date.now() < (ui.sheetGuard || 0)) return;
    closeSheet();
    return;
  }
  if (action === "jump-to") {
    const item = ITEM[act.dataset.id];
    closeSheet();
    ui.pendingScroll = item.id;
    ui.filter = item.repealed ? "out" : "all";
    ui.article = item.article;
    store.article = item.article;
    save();
    if (parseHash().name === "oxu") {
      history.replaceState(null, "", "#/oxu/" + item.article);
      if (!document.getElementById("list")) renderRead();
      else fillList(false);
    } else go("#/oxu/" + item.article);
    return;
  }
  if (action === "copy") { copyText(act.closest("[data-id]").dataset.id); return; }
  if (action === "note") {
    const notes = act.parentElement.querySelector(".notes");
    if (!notes) return;
    notes.hidden = !notes.hidden;
    act.textContent = notes.hidden ? "Qeyd" : "Qeydi gizlət";
    return;
  }
  if (action === "star") {
    const el = act.closest("[data-id]");
    const id = el.dataset.id;
    if (store.stars[id]) delete store.stars[id];
    else store.stars[id] = true;
    save();
    if (ui.filter === "star" && !store.stars[id]) el.remove();
    else paintClause(el);
    const rc = document.getElementById("resultCount");
    if (rc && document.getElementById("list")) rc.textContent = document.querySelectorAll("#list .clause").length + " bənd";
    return;
  }
  if (action === "status" && parseHash().name !== "kart") {
    const el = act.closest("[data-id]");
    const id = el.dataset.id;
    const next = act.dataset.status;
    toggleStatus(id, next);
    if (ui.filter === "left" && !document.body.contains(el)) return;
    if (ui.filter === "left" && getStatus(id) === "know") {
      const node = el.closest(".node");
      if (node && node.querySelectorAll(".clause").length === 1) {
        const parentKids = node.parentElement;
        node.remove();
        if (parentKids && parentKids.classList.contains("kids") && !parentKids.children.length) parentKids.remove();
      } else el.remove();
    } else paintClause(el);
    const rc = document.getElementById("resultCount");
    if (rc && document.getElementById("list")) rc.textContent = document.querySelectorAll("#list .clause").length + " bənd";
    return;
  }
  if (action === "card-article") {
    ui.cardArticle = act.dataset.code;
    store.cardArticle = ui.cardArticle;
    if (ui.cardArticle !== "all") { ui.article = ui.cardArticle; store.article = ui.article; }
    ui.forceQueue = true;

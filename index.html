<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efe7da">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Güzəştlər">
<title>Güzəştlər</title>
<link rel="icon" href="icons/icon.svg">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon.svg">
<style>
  :root {
    --bg: #efe7da;
    --bar: #f7f2e8;
    --paper: #fffdf8;
    --paper-2: #f6f0e4;
    --ink: #221c16;
    --muted: #6e665c;
    --line: #e3d8c8;
    --accent: #0f6a45;
    --on-accent: #f4fff8;
    --accent-soft: #e5f3eb;
    --mark: #b64022;
    --mark-bg: #fde7df;
    --again: #9a5b10;
    --again-bg: #f8ecd9;
    --hard: #9d2f2f;
    --hard-bg: #f8e4e1;
    --know: #0f6a45;
    --know-bg: #e6f4ec;
    --shadow: 0 10px 28px rgba(70, 48, 20, .08);
    --header-h: calc(58px + env(safe-area-inset-top));
    --read: 17px;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #121614;
    --bar: #171c19;
    --paper: #1d2521;
    --paper-2: #24302b;
    --ink: #f4efe6;
    --muted: #b7aea2;
    --line: #31403a;
    --accent: #3dcc8e;
    --on-accent: #062116;
    --accent-soft: #1a3328;
    --mark: #ffb089;
    --mark-bg: #3d2a22;
    --again: #f0b56a;
    --again-bg: #3a2e1d;
    --hard: #ff9d94;
    --hard-bg: #3c2422;
    --know: #8ee0b4;
    --know-bg: #1a3328;
    --shadow: 0 12px 28px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
  html[data-font="0"] { --read: 15.5px; }
  html[data-font="1"] { --read: 17px; }
  html[data-font="2"] { --read: 19.5px; }
  html[data-font="3"] { --read: 22px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { scroll-padding-top: calc(var(--header-h) + 150px); }
  body {
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    line-height: 1.45;
    -webkit-tap-highlight-color: transparent;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .top {
    position: sticky;
    top: 0;
    z-index: 30;
    height: var(--header-h);
    padding: env(safe-area-inset-top) 16px 0;
    background: var(--bar);
    border-bottom: 1px solid var(--line);
  }
  .top-inner, .tab-inner, .view {
    width: min(860px, 100%);
    margin: 0 auto;
  }
  .top-inner {
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .brand { min-width: 0; }
  .eyebrow {
    margin: 0;
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  h1 {
    margin: 0;
    font-size: 22px;
    line-height: 1.1;
    letter-spacing: -.03em;
  }
  .tools { display: flex; gap: 8px; flex: none; }
  .tool {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--paper);
    display: grid;
    place-items: center;
    font-weight: 800;
  }
  .tool svg { width: 20px; height: 20px; }
  :root[data-theme="dark"] .icon-moon, :root[data-theme="light"] .icon-sun, :root:not([data-theme]) .icon-sun { display: none; }
  .view {
    padding: 14px 16px calc(112px + env(safe-area-inset-bottom));
  }
  .tip {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--accent-soft);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 12px 12px 12px 14px;
    margin-bottom: 14px;
  }
  .tip p { margin: 0; font-size: 14px; line-height: 1.45; }
  .tip button { width: 36px; height: 36px; border-radius: 10px; flex: none; font-size: 20px; }
  .hero {
    display: flex;
    gap: 14px;
    align-items: center;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 14px;
    box-shadow: var(--shadow);
  }
  .ring-wrap { position: relative; width: 86px; height: 86px; flex: none; }
  .ring-wrap svg { width: 100%; height: 100%; display: block; }
  .ring-bg, .ring-fg { fill: none; stroke-width: 3.2; }
  .ring-bg { stroke: var(--line); }
  .ring-fg {
    stroke: var(--accent);
    stroke-linecap: round;
    transform: rotate(-90deg);
    transform-origin: center;
  }
  .ring-label {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-weight: 800;
    letter-spacing: -.04em;
    font-size: 18px;
  }
  .hero-kicker { margin: 0; color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  .hero-num { margin: 0; font-size: 34px; line-height: 1; letter-spacing: -.04em; font-weight: 800; }
  .hero-sub { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
  .primary, .ghost, .opt, .acard-side, .mark, .choice {
    border-radius: 14px;
  }
  .primary, .ghost {
    width: 100%;
    min-height: 52px;
    margin-top: 12px;
    font-weight: 750;
    font-size: 16px;
  }
  .primary { background: var(--accent); color: var(--on-accent); }
  .ghost { background: var(--paper); border: 1px solid var(--line); }
  .section-title {
    margin: 22px 0 10px;
    font-size: 13px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .acard {
    display: grid;
    grid-template-columns: 1fr auto;
    background: var(--paper);
    border: 1px solid var(--line);
    border-top: 4px solid var(--c);
    border-radius: 18px;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .acard-main { text-align: left; padding: 13px 12px 13px 14px; width: 100%; }
  .acard-top, .clause-top, .spread, .seg, .pills, .filters, .card-nav {
    display: flex;
    align-items: center;
  }
  .acard-top { justify-content: space-between; gap: 8px; }
  .acode {
    font-weight: 800;
    font-size: 20px;
    letter-spacing: -.03em;
    color: var(--c);
  }
  .acount { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .acard h2 { margin: 4px 0 0; font-size: 16px; letter-spacing: -.02em; }
  .acard p { margin: 3px 0 8px; color: var(--muted); font-size: 13px; }
  .bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--c); border-radius: inherit; }
  .acard-side {
    min-width: 64px;
    border-left: 1px solid var(--line);
    color: var(--c);
    font-weight: 800;
    padding: 0 8px;
  }
  .fine {
    margin: 18px 0 0;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
  }
  .linkish { color: var(--accent); font-weight: 700; min-height: 44px; padding: 8px; }
  .toolbar {
    position: sticky;
    top: var(--header-h);
    z-index: 25;
    background: var(--bar);
    margin: -14px -16px 12px;
    padding: 10px 16px 8px;
    border-bottom: 1px solid var(--line);
  }
  .search {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 0 12px;
    min-height: 46px;
  }
  .search svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
  .search input {
    width: 100%;
    border: 0;
    background: transparent;
    padding: 10px 0;
    font-size: 16px;
    outline: none;
  }
  .pills, .filters { gap: 8px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
  .pills::-webkit-scrollbar, .filters::-webkit-scrollbar { display: none; }
  .pill, .filter, .seg button, .choice, .mark, .opt, .id-chip, .idbtn, .textbtn {
    flex: none;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--paper);
    min-height: 36px;
    padding: 0 12px;
    font-size: 13.5px;
    font-weight: 700;
  }
  .pill.is-on, .filter.is-on, .seg button.is-on {
    background: var(--accent);
    color: var(--on-accent);
    border-color: var(--accent);
  }
  .filters { padding-top: 8px; }
  .result-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 2px 0 10px; }
  .result-row span { color: var(--muted); font-size: 13px; }
  .textbtn { border-radius: 10px; color: var(--accent); background: var(--accent-soft); border-color: transparent; }
  #list, .kids { display: flex; flex-direction: column; gap: 8px; }
  .node { display: flex; flex-direction: column; gap: 8px; }
  .kids {
    margin-left: 8px;
    padding-left: 10px;
    border-left: 2px solid var(--line);
  }
  .clause {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 12px;
    scroll-margin-top: calc(var(--header-h) + 168px);
  }
  .clause.d0 { background: var(--paper-2); }
  .clause[data-state="know"] { box-shadow: inset 3px 0 0 var(--know); }
  .clause[data-state="again"] { box-shadow: inset 3px 0 0 var(--again); }
  .clause[data-state="hard"] { box-shadow: inset 3px 0 0 var(--hard); }
  .clause-top { gap: 8px; }
  .idbtn {
    border-radius: 10px;
    background: var(--accent-soft);
    color: var(--accent);
    border-color: transparent;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.02em;
  }
  .mini, .tag {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .tag {
    background: var(--hard-bg);
    color: var(--hard);
    border-radius: 999px;
    padding: 4px 8px;
  }
  .spacer { flex: 1; }
  .iconbtn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: 1px solid var(--line);
    display: grid;
    place-items: center;
    flex: none;
  }
  .iconbtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; }
  .iconbtn.is-on { color: #c4922a; background: #f8efd8; border-color: transparent; }
  :root[data-theme="dark"] .iconbtn.is-on { color: #f0c36a; background: #3a311c; }
  .iconbtn.is-on svg { fill: currentColor; }
  .body p, .study-text p, .qtext p, .notes p, .qeyd p { margin: 0 0 .7em; }
  .body p:last-child, .study-text p:last-child, .qtext p:last-child, .notes p:last-child { margin-bottom: 0; }
  .body, .study-text, .qtext { font-size: var(--read); line-height: 1.55; }
  .body { margin-top: 8px; }
  mark {
    background: var(--mark-bg);
    color: var(--mark);
    font-weight: 750;
    padding: 0 .22em;
    border-radius: .3em;
  }
  .notes { margin-top: 8px; color: var(--muted); font-size: 13.5px; }
  .clause .textbtn { margin-top: 8px; }
  .marks { display: flex; gap: 6px; margin-top: 10px; }
  .mark { flex: 1; border-radius: 12px; min-height: 40px; padding: 0 6px; font-size: 13px; }
  .mark.is-on[data-status="again"] { background: var(--again-bg); color: var(--again); border-color: transparent; }
  .mark.is-on[data-status="hard"] { background: var(--hard-bg); color: var(--hard); border-color: transparent; }
  .mark.is-on[data-status="know"] { background: var(--know-bg); color: var(--know); border-color: transparent; }
  .empty {
    background: var(--paper);
    border: 1px dashed var(--line);
    border-radius: 16px;
    padding: 22px 16px;
    text-align: center;
    color: var(--muted);
  }
  .qeyd {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 16px;
    background: var(--paper);
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 14px;
  }
  .qeyd h3 { margin: 0 0 6px; color: var(--ink); font-size: 14px; }
  .study {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: var(--shadow);
    overflow: hidden;
    min-height: 320px;
    display: flex;
    flex-direction: column;
  }
  .study-bar { height: 6px; background: var(--c, var(--accent)); }
  .study-body { padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
  .study-kicker { margin: 0; text-align: center; color: var(--muted); font-size: 13px; }
  .big-id {
    margin: 0;
    text-align: center;
    font-size: clamp(32px, 9vw, 54px);
    line-height: 1.05;
    letter-spacing: -.04em;
    font-weight: 800;
    overflow-wrap: anywhere;
  }
  .hint { margin: 0; text-align: center; color: var(--muted); font-size: 14px; }
  .card-nav { justify-content: space-between; gap: 8px; margin-top: 8px; }
  .card-nav button, .choice {
    min-height: 44px;
    border: 1px solid var(--line);
    background: var(--paper);
    border-radius: 12px;
    padding: 0 14px;
    font-weight: 700;
  }
  .pos { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 700; }
  .seg { display: flex; gap: 6px; background: var(--paper); border: 1px solid var(--line); padding: 4px; border-radius: 14px; }
  .seg button { flex: 1; border: 0; }
  .toolrow { display: flex; gap: 8px; margin: 10px 0; }
  .toolrow .ghost, .toolrow .primary { margin-top: 0; }
  .quiz-card, .opt {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .quiz-card strong, .done-item strong { display: block; font-size: 17px; margin-bottom: 4px; }
  .quiz-card span, .done-item span { color: var(--muted); font-size: 14px; }
  .qhead { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 13px; font-weight: 700; margin-bottom: 8px; }
  .qtext {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 14px;
    max-height: 38vh;
    overflow: auto;
  }
  .gap {
    display: inline-block;
    min-width: 4.6em;
    padding: 0 .35em;
    border-bottom: 2px solid var(--mark);
    color: var(--mark);
    font-weight: 800;
    letter-spacing: .14em;
    text-align: center;
  }
  .opt { font-weight: 750; font-size: 16px; min-height: 52px; }
  .opt:disabled { cursor: default; }
  .opt.is-right { background: var(--know-bg); color: var(--know); border-color: transparent; }
  .opt.is-wrong { background: var(--hard-bg); color: var(--hard); border-color: transparent; }
  .score {
    font-size: 56px;
    font-weight: 800;
    letter-spacing: -.05em;
    margin: 8px 0;
    text-align: center;
  }
  .done-item { margin-bottom: 8px; }
  .quiz-q { margin: 0 0 14px; font-size: 18px; line-height: 1.4; letter-spacing: -.02em; }
  .explain {
    margin: 12px 0 0;
    padding: 12px 14px;
    border-radius: 14px;
    background: var(--accent-soft);
    color: var(--ink);
    font-size: 14.5px;
    font-weight: 650;
  }
  .quiz-home .quiz-card.wide { grid-column: 1 / -1; }
  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(20, 16, 12, .46);
    z-index: 80;
  }
  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 81;
    background: var(--paper);
    border-radius: 22px 22px 0 0;
    max-height: min(78vh, 680px);
    display: flex;
    flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .handle { width: 42px; height: 5px; border-radius: 99px; background: var(--line); margin: 10px auto 4px; }
  .sheet h2 { margin: 4px 16px 8px; font-size: 18px; }
  .sheet-scroll { overflow: auto; padding: 0 16px 18px; }
  .sheet h3 { margin: 12px 0 8px; font-size: 13px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  .id-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .id-chip { border-radius: 10px; font-variant-numeric: tabular-nums; }
  .id-chip[data-state="know"] { background: var(--know-bg); color: var(--know); border-color: transparent; }
  .id-chip[data-state="again"] { background: var(--again-bg); color: var(--again); border-color: transparent; }
  .id-chip[data-state="hard"] { background: var(--hard-bg); color: var(--hard); border-color: transparent; }
  .id-chip.is-out { text-decoration: line-through; opacity: .55; }
  .opener {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    text-align: left;
    flex: 1;
    min-width: 0;
    padding: 0;
  }
  .idline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ttl, .study-title {
    font-weight: 750;
    letter-spacing: -.02em;
    line-height: 1.35;
  }
  .ttl { font-size: 16.5px; }
  .study-title { margin: 0; text-align: center; font-size: 18px; }
  .fold { margin-top: 8px; }
  .overlap {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .overlap h2 { margin: 8px 0 4px; font-size: 18px; letter-spacing: -.02em; }
  .taxchips { display: flex; flex-wrap: wrap; gap: 6px; }
  .taxchip {
    font-size: 12px;
    font-weight: 800;
    padding: 4px 8px;
    border-radius: 999px;
    background: var(--line);
    color: var(--muted);
  }
  .taxchip.is-on { background: var(--c); color: #fff; }
  .overlap-row {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    width: 100%;
    text-align: left;
    margin-top: 8px;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--bg);
    gap: 2px;
  }
  .overlap-row b { font-variant-numeric: tabular-nums; }
  .overlap-row span { color: var(--muted); font-size: 13.5px; font-weight: 650; }
  .matrix-wrap {
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    margin: 0 -16px 12px;
    padding: 0 16px;
    max-height: calc(100dvh - 210px);
  }
  .matrix {
    width: max-content;
    min-width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
  }
  .matrix th, .matrix td {
    border-bottom: 1px solid var(--line);
    border-right: 1px solid var(--line);
    padding: 10px 8px;
    text-align: center;
    vertical-align: middle;
  }
  .matrix tr:last-child td { border-bottom: 0; }
  .matrix th:last-child, .matrix td:last-child { border-right: 0; }
  .matrix thead th {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
    background: var(--paper-2);
    position: sticky;
    top: 0;
    z-index: 2;
    color: var(--muted);
  }
  .matrix th small {
    display: block;
    font-size: 13px;
    letter-spacing: 0;
    text-transform: none;
    color: var(--ink);
    margin-top: 2px;
  }
  .matrix .topic {
    text-align: left;
    min-width: 148px;
    max-width: 196px;
    position: sticky;
    left: 0;
    background: var(--paper);
    z-index: 1;
    padding: 10px 12px;
  }
  .matrix thead .topic { z-index: 3; background: var(--paper-2); }
  .matrix tbody .topic[data-act] { cursor: pointer; }
  .matrix .topic b { display: block; font-size: 13.5px; line-height: 1.3; }
  .matrix .topic span { display: block; color: var(--muted); font-size: 12px; font-weight: 650; margin-top: 3px; }
  .matrix td { min-width: 64px; }
  .ok-cell { cursor: pointer; touch-action: manipulation; }
  .ok {
    width: 42px;
    height: 42px;
    border-radius: 999px;
    background: var(--know-bg);
    color: var(--know);
    display: inline-grid;
    place-items: center;
    font-size: 20px;
    font-weight: 800;
    position: relative;
    line-height: 1;
    pointer-events: none;
  }
  .ok .n {
    position: absolute;
    top: -2px;
    right: -2px;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    border-radius: 99px;

<script id="boot" type="application/json">{"articles":[{"code":"102","title":"Gəlir vergisindən azadolmalar və güzəştlər","notes":[],"items":[{"id":"102.1","text":"Fiziki şəxslərin aşağıdakı gəlirləri gəlir vergisindən azaddır:","notes":[],"parent":null,"article":"102","repealed":false,"title":"Fiziki şəxslərin azad gəlirləri"},{"id":"102.1.1","text":"Azərbaycan Respublikasının diplomatik nümayəndəliyində və ya konsulluğunda xidmət keçən diplomatik xidmət orqanı əməkdaşlarına, habelə “Diplomatik xidmət haqqında” Azərbaycan Respublikası Qanununun 13.15-ci və 13.16-cı maddələrində nəzərdə tutulan şəxslərə həmin Qanunun 12.5-ci və 13-cü maddələrinə uyğun olaraq ödənilən müavinətlər, kompensasiyalar və aylıq əlavə, müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) xarici dövlətlərdə və beynəlxalq təşkilatlarda nümayəndələrinə dövlət məvacibi istisna olmaqla, müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) müəyyən etdiyi qaydaya uyğun olaraq ödənilən bütün növ ödənişlər, Azərbaycan Respublikasının diplomatik nümayəndəliyində və ya konsulluğunda işləyən və Azərbaycan Respublikasının vətəndaşı olmayan işçinin əməkhaqqı.","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Diplomatik ödənişlər"},{"id":"102.1.2","text":"Azərbaycan Respublikasının rezidenti olmayan şəxsin iş yerindən gəlir - əgər bu gəlir Azərbaycan Respublikasının rezidenti olmayan işə götürən tərəfindən, yaxud onun adından ödənilirsə və qeyri-rezidentin daimi nümayəndəliyi tərəfindən və ya onun adından, yaxud daimi nümayəndəlikdə fəaliyyəti ilə əlaqədar ödənilmirsə;","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Qeyri-rezidentin iş yerindən gəlir"},{"id":"102.1.3","text":"təqvim ili ərzində alınan hədiyyə, maddi yardım, birdəfəlik müavinət və miraslar:","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Hədiyyə, maddi yardım, miras"},{"id":"102.1.3.1","text":"hədiyyələrin və təhsil haqlarını ödəmək üçün maddi yardımın, birdəfəlik müavinətin dəyərinin 2500 manatadək olan hissəsi, mirasların dəyərinin 20000 manatadək olan hissəsi;\nÖlkə daxilində müalicə haqlarını, o cümlədən cərrahiyyə əməliyyatının haqqını ödəmək üçün maddi yardımın, birdəfəlik müavinətin dəyərinin 10000 manatadək olan hissəsi, xaricdə müalicə haqlarını, o cümlədən cərrahiyyə əməliyyatının haqqını ödəmək üçün maddi yardımın, birdəfəlik müavinətin dəyərinin 50000 manatadək olan hissəsi;\nTəhsil və ya müalicə (o cümlədən cərrahiyyə əməliyyatı üçün) haqlarını ödəmək üçün maddi yardım, birdəfəlik müavinət almış şəxslərə bu güzəşt o halda verilir ki, həmin məbləğlərin təyinatı üzrə ödənildiyini təsdiq edən müvafiq sənədlər təqdim edilmiş olsun.","notes":[],"parent":"102.1.3","article":"102","repealed":false,"title":"Hədiyyə 2500 / miras 20000 / müalicə"},{"id":"102.1.3.2","text":"hədiyyə, maddi yardım və miras vergi ödəyicisinin ailə üzvlərindən alındığı halda, onun tam dəyəri;","notes":[],"parent":"102.1.3","article":"102","repealed":false,"title":"Ailə üzvlərindən hədiyyə və miras — tam"},{"id":"102.1.3.3","text":"şəhid olmuş şəxslərin ailə üzvlərinin əldə etdiyi maddi yardımın 20000 manatadək olan hissəsi;","notes":[],"parent":"102.1.3","article":"102","repealed":false,"title":"Şəhid ailəsi — maddi yardım 20000"},{"id":"102.1.3.4","text":"Azərbaycan Respublikasının azadlığı, suverenliyi və ərazi bütövlüyü uğrunda aparılan hərbi əməliyyatlar nəticəsində əlilliyi müəyyən edilmiş hərbi qulluqçuların və mülki şəxslərin əldə etdiyi maddi yardımın 20000 manatadək olan hissəsi.\nMaddi yardım almış mülki şəxslərə bu güzəşt o halda verilir ki, müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən şəxsin hərbi əməliyyatlar nəticəsində əlilliyi müəyyən edildiyini təsdiq edən arayış təqdim edilmiş olsun.","notes":[],"parent":"102.1.3","article":"102","repealed":false,"title":"Müharibə əlilliyi — maddi yardım 20000"},{"id":"102.1.4","text":"Əmək qabiliyyətinin müvəqqəti itirilməsinə görə ödənilən müavinətlər istisna olmaqla, dövlət müavinətləri, əvəzsiz dövlət köçürmələri, dövlət pensiyaları, dövlət təqaüdləri, müəssisənin ləğv edilməsi və ya fiziki şəxs olan işəgötürənin fəaliyyətinə xitam verilməsi və işçilərin sayının və ştatların ixtisar edilməsi ilə əlaqədar olaraq əmək müqaviləsinə xitam verildikdə işçilərə, habelə işçinin vəfatı ilə əlaqədar əmək müqaviləsinə xitam verildikdə isə vəfat edənin vərəsələrinə Azərbaycan Respublikasının Əmək Məcəlləsinə müvafiq ödənilən təminatlar, habelə Azərbaycan Respublikasının qanunları və müvafiq icra hakimiyyəti orqanlarının qərarları əsasında dövlət büdcəsinin vəsaiti hesabına fərdi birdəfəlik ödəmələr və ya maddi yardımlar;","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Dövlət müavinəti, pensiya, təqaüd"},{"id":"102.1.5","text":"alimentlər;","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Alimentlər"},{"id":"102.1.6","text":"Fiziki şəxsin əsas iş yerində hər hansı muzdlu işlə əlaqədar əldə edilən aylıq gəliri 2500 manatadək olduqda, 200 manat, illik gəliri 30000 manatadək olduqda, 2400 manat məbləğində olan hissəsi;","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Əsas iş yeri — 200 / 2400 manat"},{"id":"102.1.7","text":"qiymətli daşlardan və metallardan, qiymətli daşlar və metalların məmulatlarından, incəsənət əsərlərindən, əntiq əşyalardan və vergi ödəyicisinin sahibkarlıq fəaliyyətində istifadə edilən və ya istifadə edilmiş əmlakdan, habelə “Nağdsız hesablaşmalar haqqında” Azərbaycan Respublikası Qanununun 3.5-ci maddəsində göstərilən malların vergi ödəyicilərinə təqdim edilməsindən (kənd təsərrüfatı məhsullarının istehsalçıları tərəfindən istehsal olunan kənd təsərrüfatı məhsullarının təqdim edilməsi istisna olmaqla) başqa, daşınan maddi əmlakın təqdim edilməsindən gəlir;","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Daşınan əmlakın təqdim edilməsi"},{"id":"102.1.8","text":"Sığorta hadisəsi baş verdikdə sığorta olunanın və faydalanan şəxsin həyatına, habelə onun əmlakına və ya əmlak mənafelərinə dəymiş zərərin əvəzini ödəmək üçün pul və ya natura şəklində ödənilmiş vəsait, həmçinin işəgötürən tərəfindən ödənilən bütün növ icbari sığorta və könüllü tibbi sığorta haqları, 3 ildən az olmayan müddətə bağlanan müqavilə ilə həyatın yığım sığortası və pensiya sığortası üzrə qeyri-dövlət sektoruna aid edilən işəgötürənin sığortaolunanın vergiyə cəlb olunan gəlirlərinin 50 faizindən çox olmayan hissəsindən Azərbaycan Respublikasının sığortaçılarına ödədikləri sığorta haqları, həyatın yığım sığortası və pensiya sığortası üzrə müqavilənin qüvvəyə mindiyi andan etibarən 3 illik müddət keçdikdən sonra sığorta olunana və faydalanan şəxsə ödənilən hər hansı məbləğlər;","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Sığorta ödənişləri və haqları"},{"id":"102.1.10","text":"dəymiş zərərlərin ödənilməsi ilə bağlı alınan kompensasiya ödənişləri;","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Zərər kompensasiyası"},{"id":"102.1.11","text":"bilavasitə kənd təsərrüfatı məhsullarının istehsalından (o cümlədən sənaye üsulu ilə) alınan gəlirlər, o cümlədən kənd təsərrüfatı məhsullarının istehsalı ilə məşğul olan fiziki şəxslərin bu fəaliyyət üzrə satışdankənar gəlirləri, habelə kənd təsərrüfatı məhsullarının istehsalı ilə əlaqədar fiziki şəxslərə dövlət büdcəsinin vəsaiti hesabına verilən subsidiyalar;","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Kənd təsərrüfatı istehsalı"},{"id":"102.1.11-1","text":"kənd təsərrüfatı məhsullarının istehsalı ilə məşğul olan (o cümlədən sənaye üsulu ilə) rezident hüquqi şəxslərin iştirakçıları olan fiziki şəxslərin bu sahə üzrə dividend gəlirləri - 2023-cü il yanvarın 1-dən 4 il müddətinə;","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"KT dividend — 4 il"},{"id":"102.1.12","text":"sənətkarlığın misgərlik, qalayçılıq və saxsı məmulatlarının, təsərrüfat müxəlləfatının, bağçılıq-bostançılıq alətlərinin, xalq musiqi alətlərinin, oyuncaqların, suvenirlərin, qamışdan və qarğıdan məişət əşyalarının düzəldilməsi, keramika məmulatlarının bədii işlənməsi, bədii tikmə, ağac materiallardan məişət alətlərinin hazırlanması sahəsində fəaliyyət göstərən fiziki şəxslərin gəliri;","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Sənətkarlıq gəliri"},{"id":"102.1.14","text":"Fiziki şəxslərə kompensasiya xarakterli aşağıdakı ödəmələr:","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Kompensasiya xarakterli ödəmələr"},{"id":"102.1.14.1","text":"iş vaxtı daimi yolda olan və ya işi gediş-gəliş (səyyar) xarakteri daşıyan, çöl təşkilatlarında işləyən işçilərə gündəlik ezamiyyə xərclərinin əvəzində verilən əlavə vəsaitin qanunvericiliklə nəzərdə tutulan məbləği;","notes":[],"parent":"102.1.14","article":"102","repealed":false,"title":"Səyyar / çöl işi ezamiyyə əvəzi"},{"id":"102.1.14.2","text":"müvafiq icra hakimiyyəti orqanının qərarı ilə müəyyən edilmiş ezamiyyə xərclərinin məbləğləri;","notes":[],"parent":"102.1.14","article":"102","repealed":false,"title":"Ezamiyyə xərcləri"},{"id":"102.1.14.3","text":"Çıxarılmışdır.","notes":[],"parent":"102.1.14","article":"102","repealed":true,"title":""},{"id":"102.1.14.4","text":"ağır, zərərli və təhlükəli istehsalatlarda işçilərin tibbi müayinədən keçirilməsi üçün işəgötürənin hesabına qanunvericiliklə müəyyən edilmiş qaydada ödənilmiş xərc məbləğləri;","notes":[],"parent":"102.1.14","article":"102","repealed":false,"title":"Zərərli istehsalatda tibbi müayinə"},{"id":"102.1.14.5","text":"əmək şəraiti zərərli, ağır olan və yeraltı işlərdə çalışan işçilərə verilən pulsuz müalicə-profilaktik yeməklər, süd və ona bərabər tutulan digər məhsulların dəyəri və işçilərə müəyyən edilmiş müddətlərdə və tələb olunan çeşidlərdə verilən xüsusi geyim, xüsusi ayaqqabı və digər fərdi mühafizə vasitələrinin dəyəri;","notes":[],"parent":"102.1.14","article":"102","repealed":false,"title":"Pulsuz yemək, süd, xüsusi geyim"},{"id":"102.1.14.6","text":"istehsalatdan ayrılmaqla təhsil almağa göndərilmiş tələbələrə, doktorantlara və magistrlərə müəssisə və təşkilatların hesabına ödənilən təqaüd məbləğləri;","notes":[],"parent":"102.1.14","article":"102","repealed":false,"title":"İstehsalatdan ayrılmaqla təqaüd"},{"id":"102.1.14.7","text":"Çıxarılmışdır.","notes":[],"parent":"102.1.14","article":"102","repealed":true,"title":""},{"id":"102.1.14.8","text":"təbii fəlakət və digər fövqəladə hallarla əlaqədar müvafiq icra hakimiyyəti orqanlarının qərarları əsasında, habelə xarici dövlətlər və digər təşkilatlar tərəfindən göstərilən birdəfəlik yardımlar;","notes":[],"parent":"102.1.14","article":"102","repealed":false,"title":"Fəlakət və fövqəladə yardımlar"},{"id":"102.1.14.9","text":"verdikləri qana görə donorlara ödənilən kompensasiya məbləğləri;","notes":[],"parent":"102.1.14","article":"102","repealed":false,"title":"Donor kompensasiyası"},{"id":"102.1.14.10","text":"dalğıc işləri üçün pul mükafatı;","notes":[],"parent":"102.1.14","article":"102","repealed":false,"title":"Dalğıc işləri mükafatı"},{"id":"102.1.14.11","text":"Çıxarılmışdır.","notes":[],"parent":"102.1.14","article":"102","repealed":true,"title":""},{"id":"102.1.14.12","text":"Çıxarılmışdır.","notes":[],"parent":"102.1.14","article":"102","repealed":true,"title":""},{"id":"102.1.14.13","text":"ictimai təşkilatlar, xeyriyyə cəmiyyətləri və fondları tərəfindən verilən maddi yardımlar;","notes":[],"parent":"102.1.14","article":"102","repealed":false,"title":"Xeyriyyə və ictimai yardımlar"},{"id":"102.1.14.14","text":"Çıxarılmışdır.","notes":[],"parent":"102.1.14","article":"102","repealed":true,"title":""},{"id":"102.1.14.15","text":"hərbi qulluqçulara, hakimlərə, prokurorluq orqanlarının prokurorluq işçilərinə və prokurorluq işçiləri olmayan hərbi qulluqçularına, hüquq mühafizə orqanlarının (o cümlədən hüquq mühafizə orqanlarının səlahiyyətlərini həyata keçirən müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən müəyyən edilən vergi orqanının) xüsusi rütbəsi olan əməkdaşlarına ödənilən bütün növ ödənişlər (vəzifə və hərbi (xüsusi) rütbəyə görə maaşlar istisna olmaqla), habelə əməliyyat-axtarış fəaliyyəti subyektləri ilə əməkdaşlıq edən şəxslərə, kəşfiyyat və əks-kəşfiyyat fəaliyyəti subyektlərinə kömək edən şəxslərə ödənilən bütün növ əməkhaqqı, mükafat və digər maddi təminatlar;","notes":[],"parent":"102.1.14","article":"102","repealed":false,"title":"Hərbi və hüquq mühafizə ödənişləri"},{"id":"102.1.14.16","text":"işəgötürən tərəfindən işçinin hərbi və alternativ xidmətə çağırılması ilə əlaqədar ödənilən müavinətlərin qanunvericilikdə nəzərdə tutulan məbləği;","notes":[],"parent":"102.1.14","article":"102","repealed":false,"title":"Hərbi çağırış müavinəti"},{"id":"102.1.14.33","text":"dəniz nəqliyyatında xarici daşımaçılıqla məşğul olan ticarət donanmasının heyət üzvlərinə vəzifə maaşlarına verilən aylıq əlavə pul təminatının müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən təsdiq edilən məbləği.","notes":[],"parent":"102.1.14","article":"102","repealed":false,"title":"Dəniz donanması əlavə təminat"},{"id":"102.1.15","text":"yarışlarda və müsabiqələrdə əşya şəklində alınan mükafatların tam dəyəri. Beynəlxalq yarışlarda (idman yarışları istisna olmaqla) və müsabiqələrdə pul şəklində alınan mükafatların dəyəri 4000 manatadək, respublika, regional, şəhər və rayon yarışlarında (idman yarışları istisna olmaqla) və müsabiqələrində isə 200 manatadək;\nBeynəlxalq, ölkələrarası idman yarışları ilə bağlı həmin yarışların təşkilatçıları və respublika idman federasiyaları (assosiasiyaları) tərəfindən verilən mükafatların tam dəyəri, habelə ölkədaxili (respublika, regional, şəhər və rayon səviyyəli) idman yarışları ilə bağlı respublika idman federasiyaları (assosiasiyaları) və idman klubları tərəfindən pul şəklində verilən mükafatların dəyəri 50000 manatadək.","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Yarış və müsabiqə mükafatları"},{"id":"102.1.16","text":"Dövlət qulluqçusu pensiya yaşına çatmasına görə öz arzusu ilə və ya dövlət qulluğunda olmanın yaş həddinə çatdığı üçün işdən çıxması ilə əlaqədar verilən birdəfəlik haqq.","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Dövlət qulluqçusunun birdəfəlik haqqı"},{"id":"102.1.17","text":"Müvafiq icra hakimiyyəti orqanının qərarı ilə vəzifəyə təyin olunan Azərbaycan Respublikasının icra hakimiyyəti və digər dövlət orqanlarının (təsisatlarının), Azərbaycan Respublikasının Mərkəzi Bankının və dövlətin adından yaradılan publik hüquqi şəxslərin rəhbər işçilərinə səlahiyyətlərinin icrası ilə bağlı təmsilçilik xərclərinin ödənilməsi üçün verilən vəzifə maaşlarına aylıq əlavə pul təminatı.","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Təmsilçilik xərci əlavəsi"},{"id":"102.1.18","text":"“Torpaqların dövlət ehtiyacları üçün alınması haqqında” Azərbaycan Respublikasının Qanununa əsasən fiziki şəxslərə ödənilən kompensasiya;","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Torpaqların dövlət ehtiyacı — kompensasiya"},{"id":"102.1.20","text":"Azərbaycan Respublikasının keçmiş Prezidentinə və onun ailə üzvlərinə ödənilən pensiya, müavinət və digər ödənişlərin məbləği.","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Keçmiş Prezident və ailəsi"},{"id":"102.1.21","text":"Müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) yaratdığı sənaye, yaxud texnologiyalar parklarının rezidenti olan hüquqi şəxs yaratmadan sahibkarlıq fəaliyyətini həyata keçirən fiziki şəxslərin sənaye və texnologiyalar parkındakı fəaliyyətdən əldə etdikləri gəlir (əmək haqqından tutulan gəlir vergisi istisna olmaqla) - qanunvericiliyə uyğun olaraq sənaye və texnologiyalar parkında qeydiyyata alındıqları hesabat ilindən başlayaraq - 10 il müddətinə. Bu maddədə nəzərdə tutulan güzəşt texnologiyalar parkının rezidenti kimi texnologiyalar parkından kənar sistem inteqrasiyası, proqram təminatının hazırlanması və inkişaf etdirilməsi fəaliyyətini həyata keçirən şəxslərin həmin fəaliyyətdən (o cümlədən həmin fəaliyyətin həyata keçirilməsindən irəli gələrək alıcılara göstərilən təkmilləşmə, texniki dəstək və təlim xidmətləri) əldə etdikləri gəlirlərə münasibətdə də tətbiq edilir;","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Sənaye / texnopark — 10 il"},{"id":"102.1.21-1","text":"texnologiyalar parkının rezidenti kimi texnologiyalar parkından kənar sistem inteqrasiyası, proqram təminatının hazırlanması və inkişaf etdirilməsi fəaliyyətini həyata keçirən şəxslər tərəfindən ödənilən dividend – texnologiyalar parkının qeydiyyat şəhadətnaməsinin alındığı hesabat ilindən başlayaraq 10 il müddətinə;","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Texnopark dividend — 10 il"},{"id":"102.1.22-1","text":"Bu Məcəllə ilə müəyyən olunmuş qaydada gəlirlərin və xərclərin uçotunu aparan, ƏDV-nin məqsədləri üçün qeydiyyata alınmayan və əməliyyatlarının həcmi ardıcıl 12 aylıq dövrün istənilən ayında (aylarında) 200.000 manatadək olan rezident müəssisənin təsisçisi (payçısı) və yaxud səhmdarları olan fiziki şəxslərin dividend gəlirləri;","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Kiçik müəssisə dividendi (200 min)"},{"id":"102.1.22-2","text":"2023-cü il fevralın 1-dən etibarən 5 (beş) il müddətində Azərbaycan Respublikasının ərazisində, habelə ölkə hüdudlarından kənarda rezident hüquqi şəxslər tərəfindən kütləvi təklif edilmiş və tənzimlənən bazarda ticarətə buraxılmış səhmlər və istiqrazlar üzrə ödənilən dividend, diskont (istiqrazların nominalından aşağı yerləşdirilməsi nəticəsində yaranmış fərq) və faiz gəlirləri.","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Birja səhm və istiqraz — 5 il"},{"id":"102.1.22-3","text":"yerli bank və xarici bankın Azərbaycan Respublikasındakı filialı tərəfindən fiziki şəxslərin hər bir bankda (xarici bankın Azərbaycan Respublikasındakı filialında) milli valyutada olan depozitlər üzrə hesablanan aylıq faiz gəlirlərinin 200 manatadək olan hissəsi;","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Depozit faizi — 200 manat"},{"id":"102.1.22-4","text":"yerli bank və xarici bankın Azərbaycan Respublikasındakı filialı tərəfindən fiziki şəxslərin hər bir bankda (xarici bankın Azərbaycan Respublikasındakı filialında) milli valyutada olan depoziti 18 ay və daha artıq müddətə yerləşdirildikdə və depozitin məbləği 18 aydan tez olmayaraq ödənildikdə hesablanan faiz gəlirlərinin tam hissəsi –3 il müddətinə;","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"18 aylıq depozit faizi — 3 il"},{"id":"102.1.23","text":"investisiya təşviqi sənədini almış fərdi sahibkar həmin sənədi aldığı tarixdən əldə etdiyi gəlirin 50 faizi - 7 il müddətinə;","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"İnvestisiya təşviqi — 50%, 7 il"},{"id":"102.1.25","text":"qanuna uyğun olaraq dövlət büdcəsinə olan vergi borclarının silinməsindən əldə olunan gəlir;","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Vergi borcunun silinməsi"},{"id":"102.1.25-1","text":"Vətən müharibəsi iştirakçılarının və Vətən müharibəsində, habelə Vətən müharibəsindən sonra Azərbaycan Respublikasının ərazi bütövlüyü uğrunda döyüş əməliyyatları və hərbi təxribatlar nəticəsində şəhid ailəsi statusu almış və əlilliyi müəyyən edilmiş şəxslərin banklara və digər kredit təşkilatlarına olan borclarının silinməsindən əldə olunan gəlir;","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Vətən müharibəsi borcunun silinməsi"},{"id":"102.1.26","text":"lotereya təşkilatçısı tərəfindən keçirilən lotereyalardan və idman mərc oyunları operatoru tərəfindən keçirilən idman mərc oyunlarından pul şəklində əldə edilən 500 manatadək uduşlar;","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Lotereya / mərc uduşu — 500 manat"},{"id":"102.1.27","text":"vergi ödəyicisinin azı 3 (üç) il ərzində mülkiyyətində olan iştirak payının və ya səhmin təqdim edilməsindən əldə olunan gəlirlərinin 50 faizi;","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"3 il səhm / pay — 50%"},{"id":"102.1.28","text":"müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən ödənilən maddi yardım (dəstək);","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Dövlət maddi yardımı (dəstək)"},{"id":"102.1.29","text":"müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) müəyyən etdiyi qaydaya uyğun olaraq müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən zəmanət verilmiş kredit üzrə ödəniş edilməsi hallarında borcalanların borclarının ödənilməsinin nəticəsi kimi əldə edilən gəlirləri;","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Zəmanətli kreditin ödənilməsi"},{"id":"102.1.30","text":"bu Məcəllənin 102.1.30-1-ci maddəsində nəzərdə tutulan hal istisna olmaqla, müvafiq il üzrə orta aylıq muzdlu işçi sayı 3 nəfərdən az olmayan və məcburi dövlət sosial sığorta haqları üzrə borcu olmayan mikro sahibkarlıq subyekti olan fərdi sahibkarların sahibkarlıq fəaliyyətindən əldə etdikləri gəlirinin 75 faizi.\nMüvafiq il üzrə orta aylıq muzdlu işçi sayı təqvim ili ərzində muzdlu işçilərin sayının cəmlənərək 12-yə bölünməsi yolu ilə müəyyən edilir.\nVergi ödəyicisi vergi güzəştinin tətbiqi məqsədilə bu maddədə müəyyən edilən şərtlərə cavab vermədikdə və növbəti hesabat ilində mikro sahibkarlıq subyektindən digər kateqoriya sahibkarlıq subyektinə keçdikdə fərdi sahibkarın mikro sahibkar olduğu əvvəlki 3 təqvim ilinin yekunlarına görə hesablanmış və ödənilmiş gəlir vergisinin 75 faizi həcmində vergi güzəşti müəyyən edilməklə digər sahibkarlıq subyekti olduğu dövrlərdə gəlir vergisi öhdəliyindən çıxılır.\nVergi ödəyicisi tərəfindən əmtəəsiz əməliyyatlar aparıldığı halda bu maddə ilə müəyyən edilmiş vergi güzəşti əmtəəsiz əməliyyatlardan yaranan gəlirlərə münasibətdə tətbiq edilmir;","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Mikro sahibkar — 75%"},{"id":"102.1.30-1","text":"aşağıdakı fəaliyyət növləri ilə məşğul olan və həmin fəaliyyət növlərindən təqvim ili üzrə əldə etdiyi gəlirlərin (xərclər nəzərə alınmadan) həcmi 45000 manatadək olan fiziki şəxslərin həmin fəaliyyətdən əldə etdikləri gəlirlərinin 75 faizi:","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Xüsusi xidmətlər — 75% (45 min)"},{"id":"102.1.30-1.1","text":"proqram təminatının işlənməsi sahəsində xidmətlər;","notes":[],"parent":"102.1.30-1","article":"102","repealed":false,"title":"Proqram təminatı"},{"id":"102.1.30-1.2","text":"layihə-dizayn və dekorasiya xidmətləri;","notes":[],"parent":"102.1.30-1","article":"102","repealed":false,"title":"Layihə-dizayn və dekorasiya"},{"id":"102.1.30-1.3","text":"tərcümə xidməti;","notes":[],"parent":"102.1.30-1","article":"102","repealed":false,"title":"Tərcümə"},{"id":"102.1.30-1.4","text":"reklam xidməti;","notes":[],"parent":"102.1.30-1","article":"102","repealed":false,"title":"Reklam"},{"id":"102.1.30-1.5","text":"araşdırma və tədqiqat sahəsində fəaliyyət;","notes":[],"parent":"102.1.30-1","article":"102","repealed":false,"title":"Araşdırma və tədqiqat"},{"id":"102.1.30-1.6","text":"elm, təhsil, mədəniyyət və idman sahəsində göstərilən xidmətlər;","notes":[],"parent":"102.1.30-1","article":"102","repealed":false,"title":"Elm, təhsil, mədəniyyət, idman"},{"id":"102.1.30-1.7","text":"hüquq, sərbəst auditor, mühasibat və maliyyə sahəsi üzrə məsləhət xidmətləri;","notes":[],"parent":"102.1.30-1","article":"102","repealed":false,"title":"Hüquq, auditor, mühasibat"},{"id":"102.1.30-1.8","text":"jurnalistlərin fəaliyyəti;","notes":[],"parent":"102.1.30-1","article":"102","repealed":false,"title":"Jurnalist fəaliyyəti"},{"id":"102.1.30-1.9","text":"bazar konyukturunun öyrənilməsi;","notes":[],"parent":"102.1.30-1","article":"102","repealed":false,"title":"Bazar konyukturu"},{"id":"102.1.30-1.10","text":"qiymətləndirmə fəaliyyəti;","notes":[],"parent":"102.1.30-1","article":"102","repealed":false,"title":"Qiymətləndirmə"},{"id":"102.1.30-1.11","text":"avtonəqliyyat vasitələri ilə yükdaşımaları istisna olmaqla, sifarişlərin çatdırılması və kuryer fəaliyyəti;","notes":[],"parent":"102.1.30-1","article":"102","repealed":false,"title":"Kuryer / çatdırılma"},{"id":"102.1.30-1.12","text":"turizm bələdçiliyi;","notes":[],"parent":"102.1.30-1","article":"102","repealed":false,"title":"Turizm bələdçiliyi"},{"id":"102.1.30-1.13","text":"xidmətlərin ixracı.","notes":[],"parent":"102.1.30-1","article":"102","repealed":false,"title":"Xidmətlərin ixracı"},{"id":"102.1.31","text":"mikro və ya kiçik sahibkarlıq subyekti olan və fərdi sahibkar kimi fəaliyyət göstərən startapların “Startap” şəhadətnaməsi aldığı tarixdən innovasiya fəaliyyətindən əldə etdikləri gəlir – 3 il müddətinə;","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Startap — 3 il"},{"id":"102.1.32","text":"KOB klasterin iştirakçısı olan fərdi sahibkarın KOB klaster şirkəti ilə bağlanmış müqavilə əsasında təqdim etdiyi mal (iş, xidmət) üzrə əldə etdiyi gəlirin kapital xarakterli xərclərin çəkilməsinə yönəldilən hissəsi – 7 il müddətinə;","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"KOB klaster iştirakçısı — 7 il"},{"id":"102.1.33","text":"“Məşğulluq haqqında” Azərbaycan Respublikasının Qanununa uyğun olaraq müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) haqqı ödənilən ictimai işlərə cəlb etdiyi işçilərinin bu fəaliyyətlə əlaqədar gəlirləri;","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Haqqı ödənilən ictimai işlər"},{"id":"102.1.36","text":"lotereya biletlərinin satıcısı ilə bağlanmış müqavilə əsasında və ya onun tapşırığı əsasında lotereya biletlərinin bütün mərhələlərdə agent qaydasında satışının həyata keçirilməsi üzrə göstərilən xidmətlərdən əldə olunan gəlirlər;","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Lotereya bileti agent satışı"},{"id":"102.1.37","text":"siyahısı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən təsdiq edilmiş idxal mallarını yerli istehsal (emal) malları ilə əvəz edəcək qida məhsullarının istehsalını həyata keçirən fərdi sahibkarların həmin fəaliyyətdən əldə etdiyi gəlirin 50 faizi - müvafiq siyahının təsdiq edildiyi ildən etibarən 7 il müddətinə;","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Qida idxalını əvəzetmə — 50%, 7 il"},{"id":"102.1.38","text":"“Elektrik enerjisi istehsalında bərpa olunan enerji mənbələrindən istifadə haqqında” Azərbaycan Respublikası Qanununun 10-cu maddəsinə uyğun olaraq əhali qrupuna daxil olan aktiv istehlakçının bərpa olunan enerji mənbələri hesabına 150 kVt (150 kVt daxil olmaqla) güc həddinədək istehsal etdiyi elektrik enerjisinin elektrik təchizatı şəbəkəsinə ötürülməsindən əldə olunan gəlir;","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Aktiv istehlakçı — 150 kVt"},{"id":"102.1.39","text":"media subyektlərinin (audiovizual media subyektləri istisna olmaqla) öz fəaliyyətlərindən əldə etdikləri gəlirlər (o cümlədən reklam gəlirləri), habelə müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən verilən maddi yardımlar – 2023-cü il yanvarın 1-dən 6 il müddətinə;","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Media subyekti — 6 il"},{"id":"102.1.40","text":"Bu Məcəllənin 165.5-ci, 165.6-cı və 228-ci maddələrinə əsasən fiziki şəxs olan istehlakçılar tərəfindən ödənilmiş ƏDV-nin qaytarılmasına görə əldə olunan gəlirlər;","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"ƏDV-nin qaytarılmasından gəlir"},{"id":"102.1.41","text":"ictimai iaşə fəaliyyəti və özəl tibbi praktika ilə məşğul olan fiziki şəxslər tərəfindən dövlət büdcəsinə ƏDV hesablanarkən bu Məcəllənin 174.5-ci maddəsinə əsasən ƏDV məbləğinin azaldılmasından əldə edilən gəlirlər;","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"İaşə / özəl tibb — ƏDV azalması"},{"id":"102.1.42","text":"Azərbaycan Respublikasında teatr, muzey, simfonik orkestr, habelə film istehsalı, yayımı və dublyajı fəaliyyətinə aid qeyri-maddi aktivlər üzərində müəllif hüquqlarından istifadə olunmasına, yaxud istifadə hüquqlarının verilməsinə görə royalti gəlirləri – 2025-ci il yanvarın 1-dən 5 il müddətinə;","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Teatr, muzey, film royaltisi — 5 il"},{"id":"102.1.43","text":"filmin istehsalı və dublyajı fəaliyyətini həyata keçirən fiziki şəxslərin və filmin prodüserinin həmin fəaliyyətdən əldə etdikləri gəlirlərin 90 faizi – 2025-ci il yanvarın 1-dən 5 il müddətinə;","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"Film istehsalı / dublyaj — 90%, 5 il"},{"id":"102.1.44","text":"dövlət-özəl tərəfdaşlığı layihələri üzrə özəl tərəfdaş olan, habelə dövlətin satınalma öhdəliyi ilə bərpa olunan enerji mənbələrindən istifadə edilməklə, müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) müəyyən etdiyi məbləğdən aşağı olmayan elektrik enerjisi istehsalı layihələri üzrə istehsalçı olan fərdi sahibkarların həmin layihələr üzrə əldə etdikləri gəlir – müvafiq olaraq “Dövlət-özəl tərəfdaşlığı haqqında” Azərbaycan Respublikasının Qanununa uyğun olaraq bağlanılmış dövlət-özəl tərəfdaşlığı müqaviləsində və ya “Elektrik enerjisi istehsalında bərpa olunan enerji mənbələrindən istifadə haqqında” Azərbaycan Respublikasının Qanununa uyğun olaraq bağlanılmış elektrik enerjisinin satınalma müqaviləsi ilə müəyyən olunan müddətə, lakin 30 ildən (tikinti dövrü də daxil olmaqla) çox olmayaraq.","notes":[],"parent":"102.1","article":"102","repealed":false,"title":"DÖT və bərpa olunan enerji — 30 il"},{"id":"102.1-1","text":"şəhid statusu almış şəxslərin valideynlərinin, dul arvadlarının (ərlərinin) və övladlarının hər hansı muzdlu işdən vergi tutulmalı olan aylıq gəliri 800 manat məbləğində azaldılır.","notes":[],"parent":null,"article":"102","repealed":false,"title":"Şəhid ailəsi — aylıq 800 manat"},{"id":"102.2","text":"Aşağıdakı fiziki şəxslərin hər hansı muzdlu işdən vergi tutulmalı olan aylıq gəliri 400 manat məbləğində azaldılır:","notes":[],"parent":null,"article":"102","repealed":false,"title":"Aylıq gəlir 400 manat azaldılır"},{"id":"102.2.1","text":"Azərbaycan Respublikasının Vətən Müharibəsi Qəhrəmanlarının;","notes":[],"parent":"102.2","article":"102","repealed":false,"title":"Vətən Müharibəsi Qəhrəmanları"},{"id":"102.2.1-1","text":"Azərbaycanın Milli Qəhrəmanlarının;","notes":[],"parent":"102.2","article":"102","repealed":false,"title":"Milli Qəhrəmanlar"},{"id":"102.2.2","text":"Sovet İttifaqı və Sosialist Əməyi Qəhrəmanlarının;","notes":[],"parent":"102.2","article":"102","repealed":false,"title":"Sovet İttifaqı və Sosialist Əməyi Qəhrəmanları"},{"id":"102.2.4","text":"müharibə ilə əlaqədar əlilliyi olan şəxslərin;","notes":[],"parent":"102.2","article":"102","repealed":false,"title":"Müharibə ilə əlaqədar əlilliyi olanlar"},{"id":"102.2.5","text":"həlak olmuş, yaxud sonralar vəfat etmiş döyüşçülərin (şəhid statusu almış şəxslər istisna olmaqla) dul arvadlarının (ərlərinin) və övladlarının;","notes":[],"parent":"102.2","article":"102","repealed":false,"title":"Həlak olmuş döyüşçülərin ailəsi"},{"id":"102.2.6","text":"1941-1945-ci illərdə arxa cəbhədə fədakar əməyinə görə orden və medallar ilə təltif edilmiş şəxslərin;","notes":[],"parent":"102.2","article":"102","repealed":false,"title":"1941–1945 arxa cəbhə ordenliləri"},{"id":"102.2.7","text":"qanunvericiliklə müəyyən edilmiş qaydada müharibə veteranı adı almış şəxslərin;","notes":[],"parent":"102.2","article":"102","repealed":false,"title":"Müharibə veteranları"},{"id":"102.2.8","text":"Çernobıl AES-də qəza, mülki və ya hərbi təyinatlı atom obyektlərində digər radiasiya qəzaları nəticəsində, habelə nüvə qurğularının hər hansı növləri, o cümlədən nüvə silahı və kosmik texnika ilə bağlı olan sınaqlar, təlimlər və başqa işlər nəticəsində şüa xəstəliyinə və şüa yükü ilə əlaqədar xəstəliyə tutulmuş və ya bu xəstəlikləri keçirmiş şəxslərin;","notes":[],"parent":"102.2","article":"102","repealed":false,"title":"Çernobıl / radiasiya xəstələri"},{"id":"102.2.9","text":"minatəmizləmə fəaliyyətini həyata keçirən zaman partlayıcı sursatların işə düşməsi nəticəsində baş verən bədbəxt hadisə ilə əlaqədar həlak olan və ya bu zaman aldığı xəsarətdən həyatını itirən minatəmizləyənlərin valideynlərinin, dul arvadlarının (ərlərinin) və övladlarının.","notes":[],"parent":"102.2","article":"102","repealed":false,"title":"Minatəmizləyənlərin ailəsi"},{"id":"102.3","text":"Orqanizmin funksiyalarının 61-100 faiz pozulmasına görə əlilliyi müəyyən edilmiş şəxslərin (müharibə ilə əlaqədar əlilliyi müəyyən edilmiş şəxslər istisna olmaqla), əlilliyi olan uşaqların, daimi qulluq tələb edən əlilliyi olan uşağa və ya orqanizmin funksiyalarının 81-100 faiz pozulmasına görə əlilliyi müəyyən edilmiş şəxsə baxan və onunla birlikdə yaşayan valideynlərdən (o cümlədən övladlığa götürən şəxslərdən) birinin (özlərinin istəyi ilə), arvadın (ərin), himayəçinin və ya qəyyumun hər hansı muzdlu işdən vergi tutulmalı olan aylıq gəliri 200 manat məbləğində azaldılır.","notes":[],"parent":null,"article":"102","repealed":false,"title":"Əlillik / baxıcı — 200 manat"},{"id":"102.4","text":"Aşağıdakı fiziki şəxslərin hər hansı muzdlu işdən vergi tutulmalı olan aylıq gəliri 100 manat məbləğində azaldılır:","notes":[],"parent":null,"article":"102","repealed":false,"title":"Aylıq gəlir 100 manat azaldılır"},{"id":"102.4.1","text":"həlak olmuş, yaxud sonralar vəfat etmiş döyüşçülərin (şəhid statusu almış şəxslər istisna olmaqla) valideynləri, habelə vəzifələrinin icrası zamanı həlak olmuş dövlət qulluqçularının valideynləri və arvadları (ərləri). Bu şəxslərin arvadlarına (ərlərinə) güzəşt o halda verilir ki, onlar təkrar nikaha girmiş olmasınlar;","notes":[],"parent":"102.4","article":"102","repealed":false,"title":"Həlak olmuşların valideynləri"},{"id":"102.4.3","text":"Əfqanıstana və döyüş əməliyyatları aparılan başqa ölkələrə göndərilmiş hərbi qulluqçular və təlim-yoxlama toplanışlarına çağırılmış hərbi vəzifəlilər;","notes":[],"parent":"102.4","article":"102","repealed":false,"title":"Əfqanıstan və digər döyüşçülər"},{"id":"102.4.5","text":"məcburi köçkünlər və onlara bərabər tutulan şəxslər. Bu güzəşt mənzil qanunvericiliyinə və ya mülki hüquqi əqdlərə əsasən ayrıca mənzil sahəsi əldə etməsi nəticəsində daimi məskunlaşmış şəxslərə şamil edilmir.","notes":[],"parent":"102.4","article":"102","repealed":false,"title":"Məcburi köçkünlər"},{"id":"102.5","text":"Qohumluq dərəcəsindən asılı olmayaraq himayəsində azı üç nəfər, o cümlədən gündüz təhsil alan 23 yaşınadək şagirdlər və tələbələr olan ər və ya arvaddan birinin vergi tutulmalı olan aylıq gəliri 50 manat məbləğində azaldılır.\nBu qayda uşaqların 18 yaşa, tələbələrin və şagirdlərin 23 yaşa çatdığı ilin sonunadək, habelə uşaqların və himayədəkilərin öldüyü hallarda ölüm ilinin sonunadək saxlanılır.\nFiziki şəxslərin vergi tutulan gəliri uşağın doğulduğu və himayədə olanın himayəyə götürüldüyü aydan başlayaraq azaldılır.\nHimayədə olanların sayı il ərzində azaldıqda (uşaqların ölüm halları istisna olmaqla) himayədə olanların sayının azaldığı aydan sonrakı aydan başlayaraq onların saxlanması üçün məbləğin çıxılmasına xitam verilir.","notes":[],"parent":null,"article":"102","repealed":false,"title":"Azı 3 himayədar — 50 manat"},{"id":"102.6","text":"Aşağıdakılar himayədə olanlara aid edilmirlər:","notes":[],"parent":null,"article":"102","repealed":false,"title":"Himayədə sayılmayanlar"},{"id":"102.6.1","text":"təqaüd, pensiya və işsizlikdən sığorta ödənişi alan şəxslər (uşaqlardan başqa);","notes":[],"parent":"102.6","article":"102","repealed":false,"title":"Təqaüd, pensiya, işsizlik alanlar"},{"id":"102.6.2","text":"qanuna əsasən tam dövlət təminatında olan şəxslər.","notes":[],"parent":"102.6","article":"102","repealed":false,"title":"Tam dövlət təminatında olanlar"},{"id":"102.7","text":"Fiziki şəxsin bu Məcəllənin 102.1-1-ci, 102.2-ci, 102.3-cü və 102.4-cü maddələri üzrə güzəşt hüququ olduqda, ona bu güzəştlərdən biri, məbləğcə ən böyük olanı verilir.","notes":[],"parent":null,"article":"102","repealed":false,"title":"Bir neçə güzəşt varsa — ən böyüyü"},{"id":"102.8","text":"Əmək haqqından tutulan vergi hesablanarkən fiziki şəxslərin bu maddədə sadalanan vergi güzəştləri hüququ müvafiq icra hakimiyyəti orqanı tərəfindən müəyyənləşdirilmiş sənədlərin təqdim edildiyi andan tətbiq edilir və yalnız fiziki şəxsin əsas iş yerində həyata keçirilir. Fiziki şəxsin bu maddədə sadalanan vergi güzəştlərini əldə etməyə əsas verən statusu olduğu, lakin güzəşt hüququnu təsdiq edən müvafiq sənədləri əmək müqaviləsi (kontraktı) hüquqi qüvvəyə mindikdən sonra təqdim etdiyi halda vergi güzəşti həmin fiziki şəxsin əmək müqaviləsi (kontraktı) hüquqi qüvvəyə mindiyi tarixdən hesablanır.","notes":[],"parent":null,"article":"102","repealed":false,"title":"Güzəşt yalnız əsas iş yerində"},{"id":"102.9","text":"Bu Məcəllənin 102.1.30-1-ci maddəsində nəzərdə tutulan fəaliyyət sahələrində muzdlu işçi kimi çalışan fiziki şəxsin əmək müqaviləsinə xitam verildiyi, həmin fəaliyyətlə fərdi sahibkar kimi məşğul olduğu və fərdi sahibkar kimi fəaliyyətə başladığı tarixdən 1 il müddətində eyni xidmətləri tam və ya qismən əvvəlki işəgötürənə göstərdiyi halda, həmin fərdi sahibkara bu Məcəllənin 102.1.30-1-ci maddəsində nəzərdə tutulan güzəşt şamil edilmir.\nBu Məcəllənin 102.1.30-1-ci maddəsində nəzərdə tutulan fəaliyyət sahələri ilə məşğul olan fiziki şəxs eyni zamanda digər fəaliyyət sahəsi ilə də məşğul olduqda, həmin maddədə nəzərdə tutulan güzəşt hüququndan o halda istifadə edə bilər ki, bu Məcəllənin 102.1.30-1-ci maddəsində nəzərdə tutulan fəaliyyət sahələrindən əldə edilən illik gəlirlərin illik ümumi gəlirlərdə xüsusi çəkisi 50 faizdən az olmasın.","notes":[],"parent":null,"article":"102","repealed":false,"title":"102.1.30-1 məhdudiyyəti"}]},{"code":"106","title":"Mənfəət vergisindən azadolmalar və güzəştlər","notes":[],"items":[{"id":"106.1","text":"Vergidən azaddır:","notes":[],"parent":null,"article":"106","repealed":false,"title":"Mənfəət vergisindən azad olanlar"},{"id":"106.1.1","text":"xeyriyyə təşkilatlarının gəliri - sahibkarlıq fəaliyyətindən əldə etdikləri gəlirdən başqa;","notes":[],"parent":"106.1","article":"106","repealed":false,"title":"Xeyriyyə təşkilatlarının gəliri"},{"id":"106.1.2","text":"qeyri-kommersiya təşkilatlarının aldıqları əvəzsiz köçürmələr, üzvlük haqları və ianələr;","notes":[],"parent":"106.1","article":"106","repealed":false,"title":"Qeyri-kommersiya — ianə, üzvlük"},{"id":"106.1.3","text":"beynəlxalq, dövlətlərarası və hökumətlərarası təşkilatların gəlirləri - sahibkarlıq fəaliyyətindən əldə etdikləri gəlirdən başqa;","notes":[],"parent":"106.1","article":"106","repealed":false,"title":"Beynəlxalq təşkilatlar"},{"id":"106.1.4","text":"dövlət hakimiyyəti orqanlarının, büdcə təşkilatlarının, yerli özünüidarəetmə orqanlarının və dövlətin adından yaradılan publik hüquqi şəxslərin gəlirləri (dividend gəlirləri, sahibkarlıq fəaliyyətindən gəlir, o cümlədən publik hüquqi şəxslərin bu Məcəllənin 164.1.48-ci maddəsində göstərilmiş işlərin görülməsi və xidmətlərin göstərilməsindən (həmin maddədə nəzərdə tutulan müddətdə) başqa digər ödənişli işlər görməsindən və xidmətlər göstərməsindən əldə olunan gəlirləri və faiz gəlirləri istisna olmaqla);","notes":[],"parent":"106.1","article":"106","repealed":false,"title":"Dövlət orqanları və publik hüquqi şəxslər"},{"id":"106.1.5","text":"Azərbaycan Respublikası Mərkəzi Bankının və onun qurumlarının, ipoteka kreditləşməsi və sahibkarların aldıqları kreditlərə təminat verilməsi sahəsində fəaliyyət göstərən müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun), Azərbaycan Respublikası Dövlət Neft Fondunun, Əmanətlərin Sığortalanması Fondunun, İcbari Sığorta Bürosunun gəlirləri, habelə müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) nizamnaməsinə (əsasnaməsinə) uyğun olaraq ayrılmış güzəştli kreditlər üzrə müvəkkil kredit təşkilatları tərəfindən həmin orqanlara (qurumlara) ödənilən faiz gəlirləri;","notes":[],"parent":"106.1","article":"106","repealed":false,"title":"MB, Neft Fondu, sığorta fondları"},{"id":"106.1.6","text":"alınmış sığorta ödənişləri (həmin sığorta hadisəsi ilə əlaqədar zərərə aid edilən məbləğlərdən başqa);","notes":[],"parent":"106.1","article":"106","repealed":false,"title":"Alınmış sığorta ödənişləri"},{"id":"106.1.7","text":"təhsil müəssisələrinin, o cümlədən məktəbəqədər təhsil müəssisələrinin və sağlamlıq imkanları məhdud şəxslərin təhsil alması üçün yaradılmış xüsusi təhsil müəssisələrinin mənfəəti – mənfəətin dividendlərin ödənilməsinə yönəldilən hissəsi istisna olmaqla;","notes":[],"parent":"106.1","article":"106","repealed":false,"title":"Təhsil müəssisələrinin mənfəəti"},{"id":"106.1.8","text":"Azərbaycan Respublikasının qanunvericiliyinə uyğun olaraq dövlət büdcəsinə olan vergi borclarının silinməsindən əldə olunan gəlir.","notes":[],"parent":"106.1","article":"106","repealed":false,"title":"Vergi borcunun silinməsi"},{"id":"106.1.9","text":"Müvafiq icra hakimiyyəti orqanı tərəfindən müəyyən edilmiş hallarda hüquqi şəxsin qərarı ilə onun özünün və onun tam mülkiyyətində olan rezident törəmə müəssisələrinin birinin balansından digərinin balansına əvəzsiz olaraq verilən aktivlərin dəyəri;","notes":[],"parent":"106.1","article":"106","repealed":false,"title":"Törəməyə əvəzsiz aktiv ötürülməsi"},{"id":"106.1.10","text":"Müvafiq icra hakimiyyəti orqanının qərarına əsasən bir hüquqi şəxsin balansından əvəzsiz olaraq digər şəxsin balansına verilmiş əsas vəsaitlərin dəyəri;","notes":[],"parent":"106.1","article":"106","repealed":false,"title":"İcra qərarı ilə əvəzsiz əsas vəsait"},{"id":"106.1.11","text":"Neft-qaz ehtiyatlarının kəşfiyyatı, işlənməsi və hasilatın pay bölgüsü, ixrac boru kəmərləri haqqında və bu qəbildən olan digər sazişlərə uyğun olaraq əsas fondların, daşınar əmlakın və digər aktivlərin hər hansı şəkildə həmin sazişlərdə Azərbaycan Respublikasını təmsil edən tərəfə təqdim edilməsi üzrə əməliyyatlar;","notes":[],"parent":"106.1","article":"106","repealed":false,"title":"Neft-qaz / pay bölgüsü aktivləri"},{"id":"106.1.12","text":"müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) yaratdığı sənaye, yaxud texnologiyalar parklarının idarəedici təşkilatının və ya operatorunun mənfəətinin sənaye, yaxud texnologiyalar parklarının infrastrukturunun tikintisinə və saxlanılmasına yönəldilmiş hissəsi;","notes":[],"parent":"106.1","article":"106","repealed":false,"title":"Park operatorunun infrastruktur mənfəəti"},{"id":"106.1.13","text":"müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) yaratdığı sənaye, yaxud texnologiyalar parklarının rezidenti olan hüquqi şəxslərin sənaye və texnologiyalar parkındakı fəaliyyətdən əldə etdikləri gəlir - qanunvericiliyə uyğun olaraq sənaye və texnologiyalar parkında qeydiyyata alındıqları hesabat ilindən başlayaraq - 10 il müddətinə. Bu maddədə nəzərdə tutulan güzəşt texnologiyalar parkının rezidenti kimi texnologiyalar parkından kənar sistem inteqrasiyası, proqram təminatının hazırlanması və inkişaf etdirilməsi fəaliyyətini həyata keçirən hüquqi şəxslərin həmin fəaliyyətdən (o cümlədən həmin fəaliyyətin həyata keçirilməsindən irəli gələrək alıcılara göstərilən təkmilləşmə, texniki dəstək və təlim xidmətləri) əldə etdikləri gəlirə münasibətdə də tətbiq edilir;","notes":[],"parent":"106.1","article":"106","repealed":false,"title":"Sənaye / texnopark rezidenti — 10 il"},{"id":"106.1.13-1","text":"texnologiyalar parkının rezidenti kimi texnologiyalar parkından kənar sistem inteqrasiyası, proqram təminatının hazırlanması və inkişaf etdirilməsi fəaliyyətini həyata keçirən şəxslər tərəfindən ödənilən dividend – texnologiyalar parkının qeydiyyat şəhadətnaməsinin alındığı hesabat ilindən başlayaraq 10 il müddətinə;","notes":[],"parent":"106.1","article":"106","repealed":false,"title":"Texnopark dividend — 10 il"},{"id":"106.1.13-2","text":"müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) yaratdığı sənaye parkında müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) müəyyən etdiyi fəaliyyətlə məşğul olan sənaye parkının rezidentinin sənaye parkındakı həmin fəaliyyətdən əldə etdiyi mənfəət - 2025-ci il yanvarın 1-dən 6 il müddətinə;","notes":[],"parent":"106.1","article":"106","repealed":false,"title":"Sənaye parkı xüsusi fəaliyyət — 6 il"},{"id":"106.1.14","text":"kənd təsərrüfatı məhsullarının istehsalı ilə məşğul olan (o cümlədən, sənaye üsulu ilə) hüquqi şəxslərin bu fəaliyyətdən əldə etdikləri mənfəət - 2014-cü il yanvarın 1-dən 13 il müddətinə;","notes":[],"parent":"106.1","article":"106","repealed":false,"title":"Kənd təsərrüfatı mənfəəti — 13 il"},{"id":"106.1.14-1","text":"kənd təsərrüfatı məhsullarının istehsalı ilə məşğul olan (o cümlədən sənaye üsulu ilə) hüquqi şəxslərin bu fəaliyyət üzrə satışdankənar gəlirləri, kənd təsərrüfatı məhsullarının istehsalı ilə əlaqədar hüquqi şəxslərə dövlət büdcəsinin vəsaiti hesabına verilən subsidiyalar, habelə kənd təsərrüfatı məhsullarının istehsalı ilə məşğul olan (o cümlədən sənaye üsulu ilə) rezident hüquqi şəxslərin iştirakçıları olan hüquqi şəxslərin bu sahə üzrə dividend gəlirləri - 2023-cü il yanvarın 1-dən 4 il müddətinə;","notes":[],"parent":"106.1","article":"106","repealed":false,"title":"KT satışdankənar, subsidiya, dividend — 4 il"},{"id":"106.1.16","text":"“Torpaqların dövlət ehtiyacları üçün alınması haqqında” Azərbaycan Respublikasının Qanununa əsasən hüquqi şəxslərə ödənilən kompensasiya;","notes":[],"parent":"106.1","article":"106","repealed":false,"title":"Torpaqların dövlət ehtiyacı — kompensasiya"},{"id":"106.1.17","text":"investisiya təşviqi sənədini almış hüquqi şəxsin həmin sənədi aldığı tarixdən əldə etdiyi mənfəətin 50 faizi - 7 il müddətinə;","notes":[],"parent":"106.1","article":"106","repealed":false,"title":"İnvestisiya təşviqi — 50%, 7 il"},{"id":"106.1.18","text":"dövlətin adından yaradılan publik hüquqi şəxslər istisna olmaqla, vergi ödəyicisinin hesabat ilinin mənfəətinin 15 faizindən çox olmayan hissəsinin müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən müəyyən edilən meyarlara cavab verən elm, təhsil, səhiyyə, idman və mədəniyyət sahəsində fəaliyyət göstərən müəssisə, idarə və təşkilatlara, habelə siyahısı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən təsdiq edilən ictimai və sosial məqsədlər üçün yaradılmış fondlara köçürülən hissəsi 2024-cü il yanvarın 1-dən 5 il müddətinə. Bu maddənin müddəaları yalnız nağdsız qaydada ödənilən xərclərə münasibətdə tətbiq edilir.","notes":[],"parent":"106.1","article":"106","repealed":false,"title":"Elm, təhsil, səhiyyəyə 15% köçürmə — 5 il"},{"id":"106.1.19","text":"vergi ödəyicisinin azı 3 (üç) il ərzində mülkiyyətində olan iştirak payının və ya səhmin təqdim edilməsindən əldə olunan gəlirlərinin 50 faizi;","notes":[],"parent":"106.1","article":"106","repealed":false,"title":"3 il səhm / pay — 50%"},{"id":"106.1.20","text":"müvafiq il üzrə orta aylıq muzdlu işçi sayı 3 nəfərdən az olmayan və məcburi dövlət sosial sığorta haqları üzrə borcu olmayan mikro sahibkarlıq subyekti olan hüquqi şəxslərin sahibkarlıq fəaliyyətindən əldə etdikləri mənfəətin 75 faizi;\nMüvafiq il üzrə orta aylıq muzdlu işçi sayı təqvim ili ərzində muzdlu işçilərin sayının cəmlənərək 12-yə bölünməsi yolu ilə müəyyən edilir.\nVergi ödəyicisi vergi güzəştinin tətbiqi məqsədilə bu maddədə müəyyən edilən şərtlərə cavab vermədikdə və növbəti hesabat ilində mikro sahibkarlıq subyektindən digər kateqoriya sahibkarlıq subyektinə keçdikdə hüquqi şəxsin mikro sahibkar olduğu əvvəlki 3 təqvim ilinin yekunlarına görə hesablanmış və ödənilmiş mənfəət vergisinin 75 faizi həcmində vergi güzəşti müəyyən edilməklə digər sahibkarlıq subyekti olduğu dövrlərdə mənfəət vergisi öhdəliyindən çıxılır.\nVergi ödəyicisi tərəfindən əmtəəsiz əməliyyatlar aparıldığı halda bu maddə ilə müəyyən edilmiş vergi güzəşti əmtəəsiz əməliyyatlardan yaranan gəlirlərə münasibətdə tətbiq edilmir;","notes":[],"parent":"106.1","article":"106","repealed":false,"title":"Mikro sahibkar — 75%"},{"id":"106.1.21","text":"KOB klaster şirkətinin mənfəəti – KOB klaster şirkətinin KOB klaster şirkətlərinin reyestrinə daxil edildiyi tarixdən 7 il müddətinə;","notes":[],"parent":"106.1","article":"106","repealed":false,"title":"KOB klaster şirkəti — 7 il"},{"id":"106.1.22","text":"KOB klasterin iştirakçısı olan hüquqi şəxsin KOB klaster şirkəti ilə bağlanmış müqavilə əsasında təqdim etdiyi mal (iş, xidmət) üzrə əldə etdiyi mənfəətin kapital xarakterli xərclərin çəkilməsinə yönəldilən hissəsi – 7 il müddətinə;","notes":[],"parent":"106.1","article":"106","repealed":false,"title":"KOB klaster iştirakçısı — 7 il"},{"id":"106.1.23","text":"mikro və ya kiçik sahibkarlıq subyekti olan və hüquqi şəxs kimi fəaliyyət göstərən startapların “Startap” şəhadətnaməsi aldığı tarixdən innovasiya fəaliyyətindən əldə etdikləri mənfəəti – 3 il müddətinə;","notes":[],"parent":"106.1","article":"106","repealed":false,"title":"Startap — 3 il"},{"id":"106.1.24","text":"“Məşğulluq haqqında” Azərbaycan Respublikasının Qanununa uyğun olaraq müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) haqqı ödənilən ictimai işlərin təşkili ilə bağlı fəaliyyətdən əldə etdiyi gəlir;","notes":[],"parent":"106.1","article":"106","repealed":false,"title":"İctimai işlərin təşkili"},{"id":"106.1.28","text":"Azərbaycan Respublikasında keçirilən Formula 1 və Formula 2 yarışlarına aid qeyri-maddi aktivlər üzərində müəllif hüquqlarından istifadə olunmasına, yaxud istifadə hüquqlarının verilməsinə görə müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) ilə bağlanılmış müqavilə əsasında onun tərəfindən qeyri-rezident hüquqi şəxsə ödənilən royalti gəlirləri - 2018-ci il yanvarın 1-dən 9 il müddətinə;","notes":[],"parent":"106.1","article":"106","repealed":false,"title":"Formula 1 / 2 royaltisi — 9 il"},{"id":"106.1.29","text":"lotereya biletlərinin satıcısı ilə bağlanmış müqavilə əsasında və ya onun tapşırığı əsasında lotereya biletlərinin bütün mərhələlərdə agent qaydasında satışının həyata keçirilməsi üzrə göstərilən xidmətlərdən əldə olunan gəlirlər;","notes":[],"parent":"106.1","article":"106","repealed":false,"title":"Lotereya bileti agent satışı"},{"id":"106.1.30","text":"vəkillər və vəkil qurumları tərəfindən order markasının əldə edilməsi ilə bağlı Azərbaycan Respublikasının Vəkillər Kollegiyasına edilən ödənişlər; (vəkillər və vəkil qurumları tərəfindən order markasının əldə edilməsi ilə bağlı “Vəkillər və vəkillik fəaliyyəti haqqında” Azərbaycan Respublikasının Qanununa ediləcək dəyişikliklərlə eyni gündə qüvvəyə minir)","notes":[],"parent":"106.1","article":"106","repealed":false,"title":"Vəkil order markası"},{"id":"106.1.31","text":"siyahısı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən təsdiq edilmiş idxal mallarını yerli istehsal (emal) malları ilə əvəz edəcək qida məhsullarının istehsalını həyata keçirən hüquqi şəxslərin həmin fəaliyyətdən əldə etdikləri mənfəətin 50 faizi - müvafiq siyahının təsdiq edildiyi ildən etibarən 7 il müddətinə;","notes":[],"parent":"106.1","article":"106","repealed":false,"title":"Qida idxalını əvəzetmə — 50%, 7 il"},{"id":"106.1.32","text":"media subyektlərinin (audiovizual media subyektləri istisna olmaqla) öz fəaliyyətlərindən əldə etdikləri gəlirlər (o cümlədən reklam gəlirləri), habelə müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən verilən maddi yardımlar – 2023-cü il yanvarın 1-dən 6 il müddətinə;","notes":[],"parent":"106.1","article":"106","repealed":false,"title":"Media subyekti — 6 il"},{"id":"106.1.33","text":"qanunla müəyyən olunmuş qaydada Azərbaycan Respublikasında qeydiyyatdan keçən və teatr, muzey, simfonik orkestr, habelə film istehsalını və dublyajını həyata keçirən kinematoqrafiya müəssisəsinin və filmin prodüserinin həmin fəaliyyətdən əldə etdiyi mənfəətin 90 faizi – 2025-ci il yanvarın 1-dən 5 il müddətinə;","notes":[],"parent":"106.1","article":"106","repealed":false,"title":"Teatr, muzey, film — 90%, 5 il"},{"id":"106.1.34","text":"ictimai iaşə fəaliyyəti ilə məşğul olan şəxslər və tibb müəssisələri tərəfindən dövlət büdcəsinə ƏDV hesablanarkən bu Məcəllənin 174.5-ci maddəsinə əsasən ƏDV məbləğinin azaldılmasından əldə edilən gəlirlər;","notes":[],"parent":"106.1","article":"106","repealed":false,"title":"İaşə / tibb — ƏDV azalması"},{"id":"106.1.35","text":"dövlət-özəl tərəfdaşlığı layihələri üzrə özəl tərəfdaş və ya layihə şirkəti olan, habelə dövlətin satınalma öhdəliyi ilə bərpa olunan enerji mənbələrindən istifadə edilməklə, müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) müəyyən etdiyi məbləğdən aşağı olmayan elektrik enerjisi istehsalı layihələri üzrə istehsalçı olan hüquqi şəxslərin həmin layihələr üzrə əldə etdikləri mənfəət – müvafiq olaraq “Dövlət-özəl tərəfdaşlığı haqqında” Azərbaycan Respublikasının Qanununa uyğun olaraq bağlanılmış dövlət-özəl tərəfdaşlığı müqaviləsində və ya “Elektrik enerjisi istehsalında bərpa olunan enerji mənbələrindən istifadə haqqında” Azərbaycan Respublikasının Qanununa uyğun olaraq bağlanılmış elektrik enerjisinin satınalma müqaviləsi ilə müəyyən olunan müddətə, lakin 30 ildən (tikinti dövrü də daxil olmaqla) çox olmayaraq;","notes":[],"parent":"106.1","article":"106","repealed":false,"title":"DÖT və bərpa olunan enerji — 30 il"},{"id":"106.1.36","text":"“Sosial sığorta haqqında” və “İşsizlikdən sığorta haqqında” Azərbaycan Respublikasının qanunlarına uyğun olaraq sərbəst vəsaitlərin investisiyaya yönəldilməsindən əldə olunan gəlirlər.","notes":[],"parent":"106.1","article":"106","repealed":false,"title":"Sosial / işsizlik sığortası investisiyası"},{"id":"106.2","text":"Əlilliyi olan şəxslərin qeyri-hökumət təşkilatlarına məxsus olan işçilərinin ümumi sayının azı 50 faizi əlilliyi olan şəxslərdən ibarət olan istehsal müəssisələrinin mənfəət vergisinin dərəcəsi 50 faiz azaldılır.\nBu güzəştlərin alınması hüququ müəyyən edilərkən işçilərin orta siyahı sayına əvəzçilik, podrat müqavilələri və mülki-hüquqi xarakterli digər müqavilələr üzrə işləyən əlilliyi olan şəxslər daxil edilmir.","notes":[],"parent":null,"article":"106","repealed":false,"title":"Əlilliyi olan şəxslərin müəssisəsi — 50%"},{"id":"106.10","text":"Bu Məcəllə ilə müəyyən olunmuş qaydada gəlirlərin və xərclərin uçotunu aparan, ƏDV-nin məqsədləri üçün qeydiyyata alınmayan və əməliyyatlarının həcmi ardıcıl 12 aylıq dövrün istənilən ayında (aylarında) 200.000 manatadək olan rezident müəssisənin təsisçisi (payçısı) və yaxud səhmdarları olan hüquqi şəxslərin dividend gəlirləri vergidən azaddır.","notes":[],"parent":null,"article":"106","repealed":false,"title":"Kiçik müəssisə dividendi (200 min)"}]},{"code":"164","title":"ƏDV-dən azadolmalar və güzəştlər","notes":["Qeyd: Bu Məcəllənin 164.1.37-ci maddəsinin müddəaları kəsilmə və dondurulma əməliyyatlarına məruz qalan heyvan və quş ətləri istisna olmaqla, emal əməliyyatlarına məruz qalan heyvan və quş ətinə münasibətdə tətbiq edilmir."],"items":[{"id":"164.1","text":"Malların ixracından başqa, malların təqdim edilməsinin, işlər görülməsinin və xidmətlər göstərilməsinin aşağıdakı növlərindən, habelə idxalın aşağıdakı növlərindən ƏDV tutulmur:","notes":[],"parent":null,"article":"164","repealed":false,"title":"ƏDV tutulmayan əməliyyatlar"},{"id":"164.1.1","text":"özəlləşdirilmə qaydasında dövlət müəssisəsindən satın alınan əmlakın dəyəri, habelə dövlət əmlakının icarəyə verilməsindən alınan icarə haqqının büdcəyə ödənilməli olan hissəsi;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Özəlləşdirmə və dövlət icarəsi"},{"id":"164.1.2","text":"maliyyə xidmətlərinin göstərilməsi, o cümlədən maliyyə lizinqi əməliyyatları üzrə ödənilən faizlər;","notes":["(164.1.2-ci maddəyə Azərbaycan Respublikasının 2026-cı il 26 may tarixli 413-VIIQD nömrəli Qanunu ilə edilmiş dəyişiklik 2026-cı il dekabr 25-dən qüvvəyə minir.)"],"parent":"164.1","article":"164","repealed":false,"title":"Maliyyə xidmətləri / lizinq faizləri"},{"id":"164.1.2-1","text":"ƏDV-dən azad olunan, yaxud ƏDV-yə cəlb edilməyən əməliyyatlar çərçivəsində əldə edilmiş aktivlərin (əsas vəsaitlərin) maliyyə lizinqi müqaviləsi üzrə təqdim edilməsi;","notes":["(164.1.2-1-ci maddəyə Azərbaycan Respublikasının 2026-cı il 26 may tarixli 413-VIIQD nömrəli Qanunu ilə edilmiş dəyişiklik 2026-cı il dekabr 25-dən qüvvəyə minir.)"],"parent":"164.1","article":"164","repealed":false,"title":"ƏDV-siz aktivin maliyyə lizinqi"},{"id":"164.1.3","text":"milli və ya xarici valyutanın (numizmatika məqsədlərindən başqa), həmçinin qiymətli kağızların göndərilməsi və ya idxal edilməsi;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Valyuta və qiymətli kağızlar"},{"id":"164.1.4","text":"Azərbaycan Respublikasının Mərkəzi Bankının və Azərbaycan Respublikasının Dövlət Neft Fondunun aktivlərində yerləşdirilməsi üçün nəzərdə tutulan qızılın, habelə Azərbaycan Respublikasının Mərkəzi Bankının valyuta sərvətlərinin, xaricdə istehsal edilmiş Azərbaycan Respublikası pul nişanlarının, yubiley sikkələrinin və digər bu qəbildən olan qiymətlilərin idxalı;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"MB və Neft Fondu qızılı / nişanlar"},{"id":"164.1.5","text":"idxal olunan əmlak istisna olmaqla müəssisənin nizamnamə fonduna (kapitalına) pay şəklində hər hansı əmlakın (əsas vəsaitlər istisna olmaqla) qoyulması (əmlakın pay şəklində qoyuluşu, onun müqabilində bilavasitə digər əmlakın əldə edilməsi ilə əlaqədar olmadıqda);","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Nizamnamə kapitalına əmlak qoyuluşu"},{"id":"164.1.6","text":"tutulan məbləğlər hədlərində dövlət hakimiyyəti, yerli özünü idarəetmə və digər səlahiyyətli orqanların tutduğu dövlət rüsumu, icazə haqları, yığımlar, xüsusi notariusların aldığı haqlar (notariat hərəkətlərinin aparılmasına və notariat hərəkətləri ilə əlaqədar göstərilən xidmətə görə) və onların tutulması müqabilində göstərdiyi xidmətlər;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Dövlət rüsumu, icazə, notariat"},{"id":"164.1.7","text":"siyahısı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən təsdiq edilən media məhsullarının və kitabların (elektron kitablar istisna olmaqla), habelə dərslik komplektlərinin idxalı və satışı, həmin malların (məhsulların) istehsalı (nəşri) ilə bağlı rulon və ya vərəqə şəklində kağızın idxalı və satışı;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Kitab, media, kağız idxalı və satışı"},{"id":"164.1.8","text":"mətbu media məhsullarının və kitabların (o cümlədən elektron kitabların), habelə dərslik komplektlərinin istehsalı ilə bağlı redaksiya, nəşriyyat və poliqrafiya fəaliyyəti (reklam xidmətləri istisna olmaqla);","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Redaksiya, nəşriyyat, poliqrafiya"},{"id":"164.1.8-1","text":"media subyektləri (audiovizual media subyektləri istisna olmaqla) tərəfindən istehsal olunan media məhsullarının təqdim edilməsi, habelə Azərbaycan Respublikasında daimi nümayəndəlik yaratmayan qeyri-rezident şəxslər tərəfindən media subyektlərinə (audiovizual media subyektləri istisna olmaqla) media fəaliyyəti ilə bilavasitə bağlı olan işlərin görülməsi və xidmətlərin göstərilməsi – 2023-cü il yanvarın 1-dən 6 il müddətinə;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Media məhsulu — 6 il"},{"id":"164.1.9","text":"dəfn və qəbiristanlığın mərasim xidmətləri;","notes":[],"parent":"164.1","article":"164","repealed":false,"title":"Dəfn və qəbiristanlıq xidmətləri"},{"id":"164.1.9-1","text":"qanunvericiliklə nəzərdə tutulmuş vəzifələri
